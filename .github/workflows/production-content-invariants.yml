name: Production Content Invariants

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/**'
      - 'data-sources/**'
      - 'public/data/**'
      - 'content/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/data/**'
      - 'scripts/lib/production-content-invariants.mjs'
      - 'scripts/lib/runtime-source-registry-audit.mjs'
      - 'scripts/ci/test-runtime-source-registry-audit.mjs'
      - 'scripts/ci/*production*'
      - '.github/workflows/production-content-invariants.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'data-sources/**'
      - 'public/data/**'
      - 'content/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/data/**'
      - 'scripts/lib/production-content-invariants.mjs'
      - 'scripts/lib/runtime-source-registry-audit.mjs'
      - 'scripts/ci/test-runtime-source-registry-audit.mjs'
      - 'scripts/ci/*production*'
      - '.github/workflows/production-content-invariants.yml'
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: CI run containing the governed static export artifact
        required: false
        type: string
      producer_sha:
        description: Exact PR head SHA bound into the governed static export receipt
        required: false
        type: string
      producer_base_sha:
        description: Exact PR base SHA bound into the governed static export receipt
        required: false
        type: string
      producer_pr_number:
        description: PR number that produced the governed static export
        required: false
        type: string

concurrency:
  group: production-content-invariants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  invariants:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Reject stale producer dispatch
        if: inputs.producer_sha != ''
        env:
          PRODUCER_SHA: ${{ inputs.producer_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$PRODUCER_SHA" ]; then
            echo "Producer dispatch is stale: workflow head=$GITHUB_SHA producer=$PRODUCER_SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.producer_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Next.js build cache for self-built fallback
        if: inputs.producer_run_id == ''
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'lib/**/*', 'components/**/*', 'public/data/**/*', 'data/**/*', 'data-sources/**/*', 'content/**/*', 'scripts/**/*', 'next.config.*', 'tailwind.config.*', 'postcss.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Exercise every invariant with deterministic fixtures
        run: |
          node scripts/ci/test-production-content-invariants.mjs
          node scripts/ci/test-runtime-source-registry-audit.mjs

      - name: Download governed static export
        id: governed-download
        if: inputs.producer_run_id != '' && inputs.producer_sha != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: governed-static-export-${{ inputs.producer_sha }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Verify governed static export receipt and restore governed data
        id: governed-verify
        if: steps.governed-download.outcome == 'success'
        continue-on-error: true
        run: >-
          node scripts/ci/governed-static-export.mjs verify
          --source-sha "${{ inputs.producer_sha }}"
          --base-sha "${{ inputs.producer_base_sha }}"

      - name: Build governed fallback on artifact miss or mismatch
        if: steps.governed-verify.outcome != 'success'
        env:
          COMMIT_HASH: ${{ inputs.producer_sha || github.sha }}
        run: |
          rm -rf out .governed-static-export.json
          npm run build:deploy

      - name: Validate the exact governed profile corpus
        run: node scripts/ci/validate-production-content-invariants.mjs --data-dir=public/data

      - name: Validate governed indexability budget
        run: node scripts/ci/validate-production-indexability-budget.mjs --data-dir=public/data

      - name: Prove placeholders and dev language are absent from visible HTML
        run: node scripts/ci/audit-production-visible-language.mjs

      - name: Verify profile robots after invariant enforcement
        run: node scripts/ci/audit-profile-robots.mjs

      - name: Upload invariant reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-content-invariants-${{ github.run_number }}
          path: |
            reports/production-invariant-enforcement.json
            reports/production-content-invariants.json
            reports/production-visible-language.json
            reports/profile-publication-truth.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo '## Production content invariants' >> "$GITHUB_STEP_SUMMARY"
          echo '- Same-repository PRs reuse the exact governed CI export instead of rebuilding the site.' >> "$GITHUB_STEP_SUMMARY"
          echo '- The receipt restores the hash-bound final public/data state before invariant and indexability validation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Deterministic invariant fixtures still run independently; final HTML visible-language and robots audits still run.' >> "$GITHUB_STEP_SUMMARY"
          echo "- Producer SHA: ${{ inputs.producer_sha || 'none (self-built fallback)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Receipt verified: ${{ steps.governed-verify.outcome == 'success' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Missing, stale, or tampered artifacts fail closed to a complete build:deploy run.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wake trusted merge controller
        if: always() && github.event_name == 'workflow_dispatch' && inputs.producer_pr_number != '' && inputs.producer_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_PR_NUMBER: ${{ inputs.producer_pr_number }}
          PRODUCER_SHA: ${{ inputs.producer_sha }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-merge-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "pr_number=$PRODUCER_PR_NUMBER" \
            -f "expected_head_sha=$PRODUCER_SHA"
