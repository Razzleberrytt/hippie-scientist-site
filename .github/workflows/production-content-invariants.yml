name: Production Content Invariants

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'data/**'
      - 'data-sources/**'
      - 'public/data/**'
      - 'content/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'src/**'
      - 'scripts/data/**'
      - 'scripts/lib/production-content-invariants.mjs'
      - 'scripts/ci/*production*'
      - '.github/workflows/production-content-invariants.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'data-sources/**'
      - 'public/data/**'
      - 'content/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'src/**'
      - 'scripts/data/**'
      - 'scripts/lib/production-content-invariants.mjs'
      - 'scripts/ci/*production*'
      - '.github/workflows/production-content-invariants.yml'
  workflow_dispatch:

concurrency:
  group: production-content-invariants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify release impact
        id: impact
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | node scripts/ci/classify-release-impact.mjs --github-output="$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.impact.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Next.js build cache
        if: steps.impact.outputs.docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'src/**/*', 'lib/**/*', 'components/**/*', 'public/data/**/*', 'data/**/*', 'data-sources/**/*', 'content/**/*', 'scripts/**/*', 'next.config.*', 'tailwind.config.*', 'postcss.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        if: steps.impact.outputs.docs_only != 'true'
        run: npm ci

      - name: Exercise every invariant with deterministic fixtures
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/ci/test-production-content-invariants.mjs

      # Start from the same governed corpus production deploys. Enforcing on raw
      # workbook output skips post-processing, citation quarantine, governance
      # overlay, and PubMed enrichment, which falsely demoted valid profiles.
      - name: Build canonical governed runtime data
        if: steps.impact.outputs.docs_only != 'true'
        run: npm run data:build

      - name: Prepare explicit evidence provenance
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/data/prepare-production-evidence-provenance.mjs --data-dir=public/data

      - name: Scrub internal language and demote unsafe profiles
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/data/enforce-production-content-invariants.mjs --data-dir=public/data --refresh-derived

      - name: Validate the post-enforcement profile corpus
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/ci/validate-production-content-invariants.mjs --data-dir=public/data

      - name: Validate post-enforcement indexability budget
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/ci/validate-production-indexability-budget.mjs --data-dir=public/data

      - name: Build production static HTML from governed data
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/build-production.mjs

      - name: Apply production redirect overrides
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/seo/apply-redirect-overrides.mjs

      - name: Reconcile final sitemap after redirect overrides
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/seo/write-static-sitemap.mjs

      - name: Prove placeholders and dev language are absent from visible HTML
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/ci/audit-production-visible-language.mjs

      - name: Verify profile robots after invariant demotions
        if: steps.impact.outputs.docs_only != 'true'
        run: node scripts/ci/audit-profile-robots.mjs

      - name: Upload invariant reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-content-invariants-${{ github.run_number }}
          path: |
            reports/production-invariant-enforcement.json
            reports/production-content-invariants.json
            reports/production-visible-language.json
            reports/profile-publication-truth.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo '## Production content invariants' >> "$GITHUB_STEP_SUMMARY"
          echo '- A-grade criteria, human-source, safety-source, dose-source, citation resolution, placeholders, canonical duplicates, scientific names and internal-development language are covered.' >> "$GITHUB_STEP_SUMMARY"
          echo '- The workflow evaluates the same governed runtime corpus as production deployment; raw workbook output is never treated as the final publication contract.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Explicit claim-to-source provenance is normalized before enforcement; unsupported numeric dosage is suppressed rather than allowed to create a false page-level indexability failure.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/production-invariant-enforcement.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync('reports/production-invariant-enforcement.json', 'utf8'))
          console.log(`- Profiles scanned: ${r.scannedProfiles}`)
          console.log(`- Profiles scrubbed: ${r.scrubbedProfiles}`)
          console.log(`- Profiles demoted to NEEDS_REVIEW/noindex: ${r.demotedProfiles}`)
          NODE
          fi
          echo '- Invalid profiles remain research-accessible but cannot stay indexable.' >> "$GITHUB_STEP_SUMMARY"
