name: Remediate audit lockfile

on:
  push:
    branches:
      - fix/audit-high-js-yaml-sharp
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/remediate-audit-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/audit-high-js-yaml-sharp
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes were produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(security): refresh lockfile from package manifest'
          git push origin HEAD:fix/audit-high-js-yaml-sharp

      # npm remains the lockfile source of truth; the action only performs a real npm regeneration.