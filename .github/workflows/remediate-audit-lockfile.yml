name: Remediate audit lockfile

on:
  push:
    branches:
      - 'fix/audit-*'
    paths:
      - package.json
      - .github/workflows/remediate-audit-lockfile.yml
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch whose package-lock.json should be regenerated
        required: true
        default: fix/audit-high-js-yaml-sharp
        type: string

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes were produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(security): refresh lockfile from package manifest'
          git push origin HEAD:"$TARGET_BRANCH"
