name: Retype five non-organism entities

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  produce-canonical-workbook:
    name: Produce and validate corrected workbook
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --silent

      - name: Inspect current entity types
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          slugs=(resveratrol tyrosine citicoline quercetin phosphatidylserine)
          needs_change=false
          : > retype-five-compounds-report.txt
          for slug in "${slugs[@]}"; do
            echo "=== $slug before ===" | tee -a retype-five-compounds-report.txt
            output="$(node scripts/data/edit-entity-master-cell.mjs \
              --slug "$slug" \
              --column entity_type \
              --value compound \
              --dry-run)"
            printf '%s\n' "$output" | tee -a retype-five-compounds-report.txt
            if grep -Fq 'old: "herb"' <<<"$output"; then
              needs_change=true
            elif grep -Fq 'old: "compound"' <<<"$output"; then
              :
            else
              echo "Unexpected entity_type for $slug; refusing to write." >&2
              exit 1
            fi
          done
          echo "needs_change=$needs_change" >> "$GITHUB_OUTPUT"

      - name: Apply identity corrections
        if: steps.inspect.outputs.needs_change == 'true'
        shell: bash
        run: |
          set -euo pipefail
          slugs=(resveratrol tyrosine citicoline quercetin phosphatidylserine)
          for slug in "${slugs[@]}"; do
            echo "=== $slug apply ===" | tee -a retype-five-compounds-report.txt
            node scripts/data/edit-entity-master-cell.mjs \
              --slug "$slug" \
              --column entity_type \
              --value compound \
              --in-place | tee -a retype-five-compounds-report.txt
          done

      - name: Preserve legacy URLs after taxonomy correction
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'public/_redirects'
          let text = fs.readFileSync(file, 'utf8')

          const oldResveratrol = [
            '/compounds/resveratrol /herbs/resveratrol/ 301',
            '/compounds/resveratrol/ /herbs/resveratrol/ 301',
            '/compounds/trans-resveratrol /herbs/resveratrol/ 301',
            '/compounds/trans-resveratrol/ /herbs/resveratrol/ 301',
          ].join('\n')
          const newResveratrol = [
            '/herbs/resveratrol /compounds/resveratrol/ 301',
            '/herbs/resveratrol/ /compounds/resveratrol/ 301',
            '/compounds/trans-resveratrol /compounds/resveratrol/ 301',
            '/compounds/trans-resveratrol/ /compounds/resveratrol/ 301',
          ].join('\n')

          if (text.includes(oldResveratrol)) {
            text = text.replace(oldResveratrol, newResveratrol)
          } else if (!text.includes(newResveratrol)) {
            throw new Error('Expected resveratrol redirect block was not found; refusing a blind rewrite')
          }

          const anchor = '# Cross-taxonomy canonical: L-tyrosine is an amino-acid compound, not an herb.'
          const additions = [
            '# Cross-taxonomy canonicals: these rows are compounds, not herbs.',
            '/herbs/citicoline /compounds/citicoline/ 301',
            '/herbs/citicoline/ /compounds/citicoline/ 301',
            '/herbs/quercetin /compounds/quercetin/ 301',
            '/herbs/quercetin/ /compounds/quercetin/ 301',
            '/herbs/phosphatidylserine /compounds/phosphatidylserine/ 301',
            '/herbs/phosphatidylserine/ /compounds/phosphatidylserine/ 301',
            '',
          ].join('\n')

          if (!text.includes('/herbs/citicoline /compounds/citicoline/ 301')) {
            if (!text.includes(anchor)) throw new Error('Tyrosine cross-taxonomy anchor not found')
            text = text.replace(anchor, additions + anchor)
          }

          const forbidden = [
            '/compounds/resveratrol /herbs/resveratrol/ 301',
            '/compounds/resveratrol/ /herbs/resveratrol/ 301',
          ]
          for (const rule of forbidden) {
            if (text.includes(rule)) throw new Error(`Reverse resveratrol canonical still present: ${rule}`)
          }

          fs.writeFileSync(file, text)
          NODE

      - name: Validate workbook schema
        run: npm run validate:workbook-schema --silent | tee -a retype-five-compounds-report.txt

      - name: Verify enrichment contract against corrected workbook
        run: npm run enrich:doctor --silent | tee -a retype-five-compounds-report.txt

      - name: Rescan enrichment gaps
        run: npm run enrich:scan --silent | tee -a retype-five-compounds-report.txt

      - name: Show enrichment status
        run: npm run enrich:status --silent | tee -a retype-five-compounds-report.txt

      - name: Validate redirect indexability
        run: npm run validate:redirect-indexability --silent | tee -a retype-five-compounds-report.txt

      - name: Commit validated identity correction to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-sources/herb_monograph_master.xlsx public/_redirects
          git diff --cached --quiet && exit 0
          git commit -m "fix(data): preserve routes for retyped compounds"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload corrected workbook
        uses: actions/upload-artifact@v7
        with:
          name: retyped-canonical-workbook
          path: data-sources/herb_monograph_master.xlsx
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retype-five-compounds-report
          path: retype-five-compounds-report.txt
          if-no-files-found: warn
          retention-days: 7
