name: Integration Ledger Reconcile 4342-4347

on:
  push:
    branches:
      - integration/ledger-reconcile-4342-4347

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile verified merges
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/SWARM-UPDATES.md')
          text = p.read_text()
          marker = '|---|---:|---|---|---|\n'
          rows = '''| 2026-08-26 23:57 | #4347 | Evidence / canonical BPC-157 source | Applied the human-approved BPC-157 workbook corrections for summary, description, regulatory freshness, and post-PCAC changelog through the governed patch path; merge `a8485288bd43ac4aff9bc6e7a82fff30e198edd2`. | Canonical-source outcome is verified with high attribution confidence: the workbook now acknowledges FDA-identified small human studies without upgrading efficacy/safety certainty and records the completed non-binding PCAC recommendation. Runtime alignment is **not yet complete**: Integration incident #4350 found the committed generated compound-detail artifact still stale, so measured runtime outcome is partial/incident-open. Earliest meaningful completion window is immediate after a bounded canonical detail-sync repair and deploy verification. Blast radius: four BPC-157 canonical text/freshness cells plus deterministic derived copies; rollback is focused PR revert + canonical regeneration. Evidence grade, dose, safety conclusion, source approval, publication, indexability, monetization, and recommendation controls preserved. Learning: workbook approval and green build checks are insufficient when a known detail-file backfill path is outside `data:build:core`; post-merge generated-artifact parity must be verified explicitly. |\n| 2026-08-26 22:23 | #4345 | Content safety / claim-drift debt | Removed the first high-risk directive-dose/titration debt wave across NAC, Berberine, Adaptogens, Kava, and Passionflower and recalibrated adjacent equivalence/onset/symptom-routing/safety claims; merge `12234a2fdf6811e22ee14034b6a492872788ba41`. | Immediate deterministic outcome: ten selected critical directive-dose/titration findings were removed from five authoritative source files while canonical routes/source ownership stayed unchanged. Attribution confidence high for changed-scope claim cleanup; downstream trust/search impact remains Unknown until later traffic/crawl observation. Blast radius: five content owners; clean revert available. Scientific uncertainty, current-source safety boundaries, canonical ownership, publication rules, and the existing changed-file claim-drift gate preserved. Learning: remediate historical claim debt through authoritative content owners and route-specific regressions rather than weakening the scanner. |\n| 2026-08-26 21:37 | #4342 | Evidence governance / BPC-157 proposal | Staged a proposal-status, source-backed workbook patch correcting stale BPC-157 near-zero human-evidence wording without mutating canonical data or generated runtime artifacts; merge `e1f4d903e3d8e4a4e1eff61de111037089567cc7`. | Immediate deterministic outcome: one reviewable canonical correction was staged with exact old-value guards and explicit human approval required before application. Attribution confidence high for governance/proposal correctness; public/runtime outcome intentionally remained Unknown at this stage. Blast radius: one proposal JSON file; deletion/revert is clean rollback. Evidence grade, dose, safety, governance, publication, indexability, monetization, and recommendation controls unchanged. Learning: distinguish existence of small human exposure studies from adequacy of efficacy/safety evidence and stage semantic corrections through governed workbook patches rather than generated JSON edits. |\n'''
          if '#4347 | Evidence / canonical BPC-157 source' in text:
              raise SystemExit('ledger already reconciled')
          if marker not in text:
              raise SystemExit('ledger table marker missing')
          p.write_text(text.replace(marker, marker + rows, 1))
          PY
          git config user.name 'Integration Lane'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/integration-ledger-reconcile-4342-4347.yml
          git add docs/SWARM-UPDATES.md
          git commit -m 'docs(swarm): reconcile merges 4342 through 4347'
          git push origin HEAD
