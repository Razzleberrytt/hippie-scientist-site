name: Publisher production readiness probe

on:
  push:
    branches:
      - probe/publisher-production-readiness-2026-10-06

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production deployment and auth boundaries
        shell: bash
        run: |
          set -euo pipefail

          receipt_code="$(curl -sS -o receipt.json -w '%{http_code}' https://thehippiescientist.net/.well-known/deployment.json)"
          echo "receipt_http=$receipt_code"
          test "$receipt_code" = "200"
          grep -q 'fc0d0fee90a027cb13e2f6b77071d8632ee99b35' receipt.json

          manifest_code="$(curl -sS -o manifest.json -w '%{http_code}' https://thehippiescientist.net/media/distribution/publisher/latest.json)"
          echo "manifest_http=$manifest_code"
          test "$manifest_code" = "200"
          node - <<'NODE'
          const fs = require('fs')
          const m = JSON.parse(fs.readFileSync('manifest.json','utf8'))
          if (m.schemaVersion !== 'ths-publication-media-v1') throw new Error('bad publisher manifest schema')
          if (m.status !== 'ready-for-provider') throw new Error('publisher manifest not provider-ready')
          if (!Array.isArray(m.media) || m.media.length === 0) throw new Error('publisher manifest has no media')
          console.log('manifest_format=' + m.format)
          console.log('manifest_media_type=' + m.mediaType)
          console.log('manifest_research_object_id=' + (m.researchObjectId || ''))
          NODE

          publisher_code="$(curl -sS -o publisher.json -w '%{http_code}' -X POST             -H 'Content-Type: application/json'             -d '{}'             https://thehippiescientist.net/api/publisher/enqueue)"
          echo "publisher_auth_http=$publisher_code"
          cat publisher.json
          echo
          if [ "$publisher_code" = "503" ]; then
            echo "publisher_admin_secret_configured=false"
          elif [ "$publisher_code" = "401" ]; then
            echo "publisher_admin_secret_configured=true"
          else
            echo "Unexpected Publisher auth boundary status: $publisher_code" >&2
            exit 1
          fi

          tiktok_code="$(curl -sS -o tiktok.json -w '%{http_code}' https://thehippiescientist.net/api/tiktok/connection)"
          echo "tiktok_auth_http=$tiktok_code"
          cat tiktok.json
          echo
          if [ "$tiktok_code" = "503" ]; then
            echo "tiktok_admin_secret_configured=false"
          elif [ "$tiktok_code" = "401" ]; then
            echo "tiktok_admin_secret_configured=true"
          else
            echo "Unexpected TikTok auth boundary status: $tiktok_code" >&2
            exit 1
          fi


  inspect-cloudflare-pages-config:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Download current Cloudflare Pages config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_PAGES_PROJECT:-}"
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --no-install wrangler pages download config "$CLOUDFLARE_PAGES_PROJECT"
          config_file="$(find . -maxdepth 1 -type f \( -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) | head -n 1)"
          test -n "$config_file"
          echo "downloaded_config=$config_file"
          echo "---- bindings/config (secrets are not returned by download config) ----"
          cat "$config_file"


  bootstrap-cloudflare-publisher:
    if: ${{ false }}
    needs: inspect-cloudflare-pages-config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --fund=false
      - name: Create and bind Publisher resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_PAGES_PROJECT:-}"

          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          d1_name="ths-publisher-production"
          kv_title="ths-tiktok-token-production"

          curl -fsS "${auth[@]}" "$api/d1/database?name=$d1_name&per_page=100" > d1-list.json
          d1_id="$(jq -r --arg n "$d1_name" '.result[]? | select(.name==$n) | (.uuid // .id)' d1-list.json | head -n1)"
          if [ -z "$d1_id" ]; then
            echo "Creating D1 database $d1_name"
            curl -fsS -X POST "${auth[@]}" "$api/d1/database"               --data "$(jq -nc --arg name "$d1_name" '{name:$name}')" > d1-create.json
            jq -e '.success == true' d1-create.json >/dev/null
            d1_id="$(jq -r '.result.uuid // .result.id' d1-create.json)"
          else
            echo "Reusing existing D1 database $d1_name"
          fi
          test -n "$d1_id"

          curl -fsS "${auth[@]}" "$api/storage/kv/namespaces?per_page=100" > kv-list.json
          kv_id="$(jq -r --arg n "$kv_title" '.result[]? | select(.title==$n) | .id' kv-list.json | head -n1)"
          if [ -z "$kv_id" ]; then
            echo "Creating KV namespace $kv_title"
            curl -fsS -X POST "${auth[@]}" "$api/storage/kv/namespaces"               --data "$(jq -nc --arg title "$kv_title" '{title:$title}')" > kv-create.json
            jq -e '.success == true' kv-create.json >/dev/null
            kv_id="$(jq -r '.result.id' kv-create.json)"
          else
            echo "Reusing existing KV namespace $kv_title"
          fi
          test -n "$kv_id"

          echo "Applying Publisher D1 migration"
          npx --no-install wrangler d1 execute "$d1_name" --remote --file=migrations/0001_ths_publisher.sql

          echo "Binding D1 and KV to production Pages Functions"
          payload="$(jq -nc --arg d1 "$d1_id" --arg kv "$kv_id" '{
            deployment_configs:{
              production:{
                d1_databases:{THS_PUBLISHER_DB:{id:$d1}},
                kv_namespaces:{TIKTOK_TOKEN_KV:{namespace_id:$kv}}
              }
            }
          }')"
          curl -fsS -X PATCH "${auth[@]}"             "$api/pages/projects/$CLOUDFLARE_PAGES_PROJECT"             --data "$payload" > pages-patch.json
          jq -e '.success == true' pages-patch.json >/dev/null

          admin_token="$(printf '%s' 'ths-social-publisher-admin-v1' | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -binary | xxd -p -c 256)"
          test "${#admin_token}" -eq 64
          printf '%s' "$admin_token" | npx --no-install wrangler pages secret put THS_PUBLISHER_ADMIN_TOKEN --project-name "$CLOUDFLARE_PAGES_PROJECT" >/dev/null
          printf '%s' "$admin_token" | npx --no-install wrangler pages secret put TIKTOK_PUBLISHER_ADMIN_TOKEN --project-name "$CLOUDFLARE_PAGES_PROJECT" >/dev/null
          printf '%s' 'https://thehippiescientist.net/api/tiktok/callback' | npx --no-install wrangler pages secret put TIKTOK_REDIRECT_URI --project-name "$CLOUDFLARE_PAGES_PROJECT" >/dev/null

          echo "d1_bound=THS_PUBLISHER_DB"
          echo "kv_bound=TIKTOK_TOKEN_KV"
          echo "publisher_admin_secret=set"
          echo "tiktok_admin_secret=set"
          echo "tiktok_redirect_uri=set"

          echo "Retrying current canonical production deployment so new bindings apply"
          curl -fsS "${auth[@]}" "$api/pages/projects/$CLOUDFLARE_PAGES_PROJECT" > project.json
          deployment_id="$(jq -r '.result.canonical_deployment.id' project.json)"
          test -n "$deployment_id"
          curl -fsS -X POST "${auth[@]}"             "$api/pages/projects/$CLOUDFLARE_PAGES_PROJECT/deployments/$deployment_id/retry" > retry.json
          jq -e '.success == true' retry.json >/dev/null
          retry_id="$(jq -r '.result.id' retry.json)"
          echo "retry_deployment_id=$retry_id"

          for attempt in $(seq 1 60); do
            sleep 5
            curl -fsS "${auth[@]}"               "$api/pages/projects/$CLOUDFLARE_PAGES_PROJECT/deployments/$retry_id" > retry-status.json
            stage="$(jq -r '.result.latest_stage.status // .result.stages[-1].status // empty' retry-status.json)"
            echo "retry_poll_$attempt=$stage"
            if [ "$stage" = "success" ]; then
              exit 0
            fi
            if [ "$stage" = "failure" ] || [ "$stage" = "canceled" ]; then
              cat retry-status.json
              exit 1
            fi
          done
          echo "Timed out waiting for Pages retry deployment" >&2
          exit 1


  inspect-cloudflare-env-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect production Pages environment variable names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$api/pages/projects/$CLOUDFLARE_PAGES_PROJECT" > project.json
          jq -r '
            (.result.deployment_configs.production.env_vars // {})
            | to_entries[]
            | [.key, (.value.type // "unknown")]
            | @tsv
          ' project.json | sort
