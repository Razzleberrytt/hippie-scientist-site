            --name em-lane5-native-full-b --dir film-b
          (cd original-inputs && sha256sum --check PINNED-FILE-SHA256SUMS)
          printf '9dca049ee2d4c827b1283e4816fd6047187f39449de0441fea420b036f959435  %s\n' \
