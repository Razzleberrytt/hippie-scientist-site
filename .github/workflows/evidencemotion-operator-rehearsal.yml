          test "$(find original-renderer original-inputs film-a film-b -type f | wc -l)" -eq 31
          sha256sum --check RECOVERED-FILES-SHA256SUMS
          zip -q -r "$RUNNER_TEMP/EvidenceMotion_Original_Source_WAV_Film_Research_HOLD.zip" \
