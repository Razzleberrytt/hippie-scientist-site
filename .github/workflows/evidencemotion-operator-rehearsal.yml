              "$tag/specimen_NEW_RESEARCH_CANDIDATE.mp4" | sha256sum --check -
            printf '401c5c7eec184d77aeaf16bd55c430e4515106b130d4cdcd0ce39d052cbc7a88  %s\n' \
              "$tag/environment.json" | sha256sum --check -
