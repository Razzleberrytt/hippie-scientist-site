name: Autonomous merge controller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-merge-${{ github.event.pull_request.number || 'fallback' }}
  cancel-in-progress: true

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  merge-controller:
    name: merge-controller
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_RUN_ID: ${{ github.run_id }}
      MERGE_POLL_SECONDS: '30'
      MERGE_MAX_WAIT_MINUTES: '165'
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Follow exact-head checks and merge when green
        run: node scripts/ci/autonomous-merge-controller.mjs

      - name: Controller summary
        if: always()
        run: |
          {
            echo '## Autonomous merge controller'
            echo "- PR: #${PR_NUMBER}"
            echo "- Expected head: ${EXPECTED_HEAD_SHA}"
            echo '- Security: trusted main-branch controller; PR code is never checked out or executed here.'
            echo '- Merge rule: universal workflows plus every triggered exact-head check must be terminal-green.'
            echo '- Failure rule: semantic failures fail closed; only bounded transient workflow outcomes may retry once.'
            echo '- Fallback: scheduled sweep revisits open PRs every 10 minutes.'
          } >> "$GITHUB_STEP_SUMMARY"

  fallback-sweep:
    name: fallback-sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CONTROLLER_RUN_ID: ${{ github.run_id }}
      SWEEP_OPEN_PRS: 'true'
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile open PRs without bypassing gates
        run: node scripts/ci/autonomous-merge-controller.mjs
