name: Autonomous merge controller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows:
      - CI
      - Site Health Check
      - Atomic upgrade gate
      - Build quality regression
      - Production Content Lint
      - Build Check
      - Lighthouse CI
      - Research Distribution
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to reconcile after a governed consumer wake
        required: false
        type: string
      expected_head_sha:
        description: Exact PR head SHA the governed consumer validated
        required: false
        type: string

concurrency:
  group: autonomous-merge-${{ github.event.pull_request.number || inputs.pr_number || 'fallback' }}
  cancel-in-progress: true

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: write

jobs:
  merge-controller:
    name: merge-controller-monitor
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      ready: ${{ steps.monitor.outputs.ready }}
      head_sha: ${{ steps.monitor.outputs.head_sha }}
      base_sha: ${{ steps.monitor.outputs.base_sha }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONTROLLER_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate exact-head readiness once
        id: monitor
        run: node scripts/ci/autonomous-merge-monitor.mjs

      - name: Attest exact-head validation
        if: steps.monitor.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_HEAD_SHA: ${{ steps.monitor.outputs.head_sha }}
          VALIDATED_BASE_SHA: ${{ steps.monitor.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [ -z "$VALIDATED_HEAD_SHA" ] || [ -z "$VALIDATED_BASE_SHA" ]; then
            echo 'Ready monitor did not provide exact head/base SHAs.' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$VALIDATED_HEAD_SHA" \
            -f state=success \
            -f context='autonomous-merge/validated' \
            -f description="PR #$PR_NUMBER exact-head validated on $VALIDATED_BASE_SHA" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Exact-head validation receipt recorded on $VALIDATED_HEAD_SHA for base $VALIDATED_BASE_SHA."

      - name: Monitor summary
        if: always()
        run: |
          {
            echo '## Autonomous merge monitor'
            echo "- PR: #${PR_NUMBER}"
            echo "- Expected head: ${EXPECTED_HEAD_SHA}"
            echo "- Ready for serialized merge: ${{ steps.monitor.outputs.ready || 'false' }}"
            echo '- Security: trusted main-branch monitor; PR code is never checked out or executed here.'
            echo '- Merge rule: universal workflows plus every triggered exact-head check must be terminal-green against the current base.'
            echo '- Base drift: the per-PR monitor is read-only; stale branches are delegated to the globally serialized fallback sweep and must pass a fresh exact-head cycle.'
            echo '- Recovery rule: transient retries, zero-job action_required recovery, branch refresh, and final merge remain owned by the serialized write-capable controller.'
          } >> "$GITHUB_STEP_SUMMARY"

  merge-commit:
    name: merge-commit
    needs: merge-controller
    if: needs.merge-controller.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: autonomous-merge-commit
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ needs.merge-controller.outputs.head_sha }}
      VALIDATED_BASE_SHA: ${{ needs.merge-controller.outputs.base_sha }}
      CONTROLLER_RUN_ID: ${{ github.run_id }}
      MERGE_POLL_SECONDS: '10'
      MERGE_MAX_WAIT_MINUTES: '5'
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Revalidate current base and merge
        run: node scripts/ci/autonomous-merge-controller.mjs

      - name: Attest controller-authorized merge
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          merged="$(jq -r '.merged' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          merge_sha="$(jq -r '.merge_commit_sha // empty' <<<"$pr_json")"
          if [ "$merged" != "true" ]; then
            echo "PR #$PR_NUMBER is not merged; no authorization status emitted."
            exit 0
          fi
          if [ "$head_sha" != "$EXPECTED_HEAD_SHA" ] || [ -z "$merge_sha" ]; then
            echo "Merged PR identity does not match validated controller head; refusing authorization receipt." >&2
            exit 1
          fi

          merge_json="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha")"
          parent_shas="$(jq '[.parents[].sha]' <<<"$merge_json")"
          has_base="$(jq --arg sha "$VALIDATED_BASE_SHA" 'index($sha) != null' <<<"$parent_shas")"
          has_head="$(jq --arg sha "$EXPECTED_HEAD_SHA" 'index($sha) != null' <<<"$parent_shas")"
          merge_tree="$(jq -r '.tree.sha' <<<"$merge_json")"
          head_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$EXPECTED_HEAD_SHA" --jq '.tree.sha')"
          if [ "$has_base" != "true" ] || [ "$has_head" != "true" ] || [ "$merge_tree" != "$head_tree" ]; then
            echo "Merged revision does not exactly match validated controller head/base; refusing authorization receipt." >&2
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD_SHA" \
            -f state=success \
            -f context='autonomous-merge/authorized' \
            -f description="PR #$PR_NUMBER exact controller-authorized merge on ${VALIDATED_BASE_SHA:0:7}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Controller merge authorization recorded on exact validated head $EXPECTED_HEAD_SHA."

      - name: Ensure merged PR enters deploy lifecycle
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged')"
          if [ "$merged" != "true" ]; then
            echo "PR #$PR_NUMBER was not merged after serialized revalidation; no deploy handoff needed."
            exit 0
          fi

          sleep 10
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$main_sha&per_page=100")"
          deploy_count="$(jq '[.workflow_runs[] | select(.name == "Deploy to Cloudflare Pages")] | length' <<<"$runs_json")"
          ci_count="$(jq '[.workflow_runs[] | select(.name == "CI")] | length' <<<"$runs_json")"
          if [ "$deploy_count" -gt 0 ]; then
            echo "Deploy lifecycle already registered for latest main $main_sha."
          elif [ "$ci_count" -gt 0 ]; then
            echo "CI lifecycle registered for latest main $main_sha; successful CI completion owns the deploy handoff."
          else
            echo "No CI or deploy run registered for latest main $main_sha; dispatching deploy.yml self-build fallback."
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" -f ref=main
          fi

  fallback-sweep:
    name: fallback-sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: autonomous-merge-commit
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      CONTROLLER_RUN_ID: ${{ github.run_id }}
      PR_NUMBER: ${{ inputs.pr_number || '' }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
      SWEEP_OPEN_PRS: ${{ inputs.pr_number != '' && 'false' || 'true' }}
      MERGE_POLL_SECONDS: '5'
      MERGE_MAX_WAIT_MINUTES: '3'
    steps:
      - name: Checkout trusted controller from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile one open PR without bypassing gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          node scripts/ci/autonomous-merge-controller.mjs | tee "$log_file"

          merge_line="$(grep -E '^Merged PR #[0-9]+ as [0-9a-f]{40}$' "$log_file" | tail -1 || true)"
          if [ -z "$merge_line" ]; then
            echo 'Fallback sweep did not merge a PR; no authorization status emitted.'
            exit 0
          fi

          pr_number="$(printf '%s\n' "$merge_line" | sed -E 's/^Merged PR #([0-9]+) as ([0-9a-f]{40})$/\1/')"
          merge_sha="$(printf '%s\n' "$merge_line" | sed -E 's/^Merged PR #([0-9]+) as ([0-9a-f]{40})$/\2/')"
          actual_merge_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.merge_commit_sha')"
          if [ "$actual_merge_sha" != "$merge_sha" ]; then
            echo "Controller log / GitHub merge SHA mismatch for PR #$pr_number: $merge_sha != $actual_merge_sha"
            exit 1
          fi

          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.head.sha')"
          base_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge_sha" --jq '.parents[0].sha')"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$head_sha" \
            -f state=success \
            -f context='autonomous-merge/authorized' \
            -f description="PR #$pr_number controller-merged on ${base_sha:0:7}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Controller merge authorization recorded on $head_sha."

      - name: Ensure latest main enters deploy lifecycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sleep 10
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$main_sha&per_page=100")"
          deploy_count="$(jq '[.workflow_runs[] | select(.name == "Deploy to Cloudflare Pages")] | length' <<<"$runs_json")"
          ci_count="$(jq '[.workflow_runs[] | select(.name == "CI")] | length' <<<"$runs_json")"
          if [ "$deploy_count" -gt 0 ]; then
            echo "Deploy lifecycle already registered for latest main $main_sha."
          elif [ "$ci_count" -gt 0 ]; then
            echo "CI lifecycle registered for latest main $main_sha; successful CI completion owns the deploy handoff."
          else
            echo "No CI or deploy run registered for latest main $main_sha; dispatching deploy.yml self-build fallback."
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" -f ref=main
          fi
