name: Retype five compounds v3

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-identity-correction:
    if: github.event.pull_request.head.ref == 'fix/retype-five-compounds-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Retype five canonical workbook rows
        shell: bash
        run: |
          set -euo pipefail
          for slug in resveratrol tyrosine citicoline quercetin phosphatidylserine; do
            node scripts/data/edit-entity-master-cell.mjs \
              --slug "$slug" \
              --column entity_type \
              --value compound \
              --in-place
          done

      - name: Align canonical maps and redirects without undoing newer redirect work
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')

          function replaceOnce(file, oldText, newText) {
            let text = fs.readFileSync(file, 'utf8')
            const first = text.indexOf(oldText)
            if (first < 0) throw new Error(`${file}: expected block not found`)
            if (text.indexOf(oldText, first + oldText.length) >= 0) {
              throw new Error(`${file}: expected block occurs more than once`)
            }
            text = text.replace(oldText, newText)
            fs.writeFileSync(file, text)
          }

          replaceOnce(
            'lib/deprecated-herb-canonicals.ts',
            `  // L-tyrosine is an amino-acid compound, not a botanical profile.\n  tyrosine: 'l-tyrosine',`,
            `  // Cross-taxonomy identity corrections: these rows are compounds, not botanicals.\n  // Values are the final compound canonical slugs; citicoline and tyrosine\n  // deliberately consolidate into stronger existing compound identities.\n  resveratrol: 'resveratrol',\n  citicoline: 'cdp-choline',\n  quercetin: 'quercetin',\n  phosphatidylserine: 'phosphatidylserine',\n  tyrosine: 'l-tyrosine',`,
          )
          replaceOnce(
            'lib/deprecated-herb-canonicals.ts',
            `export const CROSS_TAXONOMY_REDIRECT_SLUGS = new Set(['tyrosine'])`,
            `export const CROSS_TAXONOMY_REDIRECT_SLUGS = new Set([\n  'resveratrol',\n  'citicoline',\n  'quercetin',\n  'phosphatidylserine',\n  'tyrosine',\n])`,
          )

          replaceOnce(
            'lib/deprecated-compound-canonicals.ts',
            `  elderberry: '/herbs/elderberry',\n  resveratrol: '/herbs/resveratrol',\n  'trans-resveratrol': '/herbs/resveratrol',`,
            `  elderberry: '/herbs/elderberry',\n  // Same-substance aliases after correcting workbook taxonomy.\n  tyrosine: 'l-tyrosine',\n  citicoline: 'cdp-choline',\n  'trans-resveratrol': 'resveratrol',`,
          )

          const redirectsPath = 'public/_redirects'
          const affectedSources = new Set([
            '/herbs/resveratrol', '/herbs/resveratrol/',
            '/compounds/resveratrol', '/compounds/resveratrol/',
            '/compounds/trans-resveratrol', '/compounds/trans-resveratrol/',
            '/herbs/citicoline', '/herbs/citicoline/',
            '/compounds/citicoline', '/compounds/citicoline/',
            '/herbs/quercetin', '/herbs/quercetin/',
            '/herbs/phosphatidylserine', '/herbs/phosphatidylserine/',
            '/herbs/tyrosine', '/herbs/tyrosine/',
            '/compounds/tyrosine', '/compounds/tyrosine/',
          ])
          const existing = fs.readFileSync(redirectsPath, 'utf8').split(/\r?\n/)
          const preserved = existing.filter((line) => {
            const trimmed = line.trim()
            if (!trimmed || trimmed.startsWith('#')) return true
            const [source] = trimmed.split(/\s+/)
            return !affectedSources.has(source)
          })
          while (preserved.length && preserved[preserved.length - 1] === '') preserved.pop()
          preserved.push(
            '',
            '# Cross-taxonomy identity corrections: old herb URLs go directly to final compound canonicals.',
            '/herbs/resveratrol /compounds/resveratrol/ 301',
            '/herbs/resveratrol/ /compounds/resveratrol/ 301',
            '/compounds/trans-resveratrol /compounds/resveratrol/ 301',
            '/compounds/trans-resveratrol/ /compounds/resveratrol/ 301',
            '/herbs/citicoline /compounds/cdp-choline/ 301',
            '/herbs/citicoline/ /compounds/cdp-choline/ 301',
            '/compounds/citicoline /compounds/cdp-choline/ 301',
            '/compounds/citicoline/ /compounds/cdp-choline/ 301',
            '/herbs/quercetin /compounds/quercetin/ 301',
            '/herbs/quercetin/ /compounds/quercetin/ 301',
            '/herbs/phosphatidylserine /compounds/phosphatidylserine/ 301',
            '/herbs/phosphatidylserine/ /compounds/phosphatidylserine/ 301',
            '/herbs/tyrosine /compounds/l-tyrosine/ 301',
            '/herbs/tyrosine/ /compounds/l-tyrosine/ 301',
            '/compounds/tyrosine /compounds/l-tyrosine/ 301',
            '/compounds/tyrosine/ /compounds/l-tyrosine/ 301',
            '',
          )
          fs.writeFileSync(redirectsPath, preserved.join('\n'))

          replaceOnce(
            'scripts/verify-redirects.mjs',
            `  '/compounds/resveratrol /herbs/resveratrol/ 301',\n  '/compounds/trans-resveratrol /herbs/resveratrol/ 301',`,
            `  '/herbs/resveratrol /compounds/resveratrol/ 301',\n  '/compounds/trans-resveratrol /compounds/resveratrol/ 301',\n  '/herbs/citicoline /compounds/cdp-choline/ 301',\n  '/compounds/citicoline /compounds/cdp-choline/ 301',\n  '/herbs/quercetin /compounds/quercetin/ 301',\n  '/herbs/phosphatidylserine /compounds/phosphatidylserine/ 301',\n  '/herbs/tyrosine /compounds/l-tyrosine/ 301',\n  '/compounds/tyrosine /compounds/l-tyrosine/ 301',`,
          )
          NODE

      - name: Add canonical regression test
        shell: bash
        run: |
          cat > src/lib/__tests__/retyped-compound-canonicals.test.ts <<'TEST'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'
          import { describe, expect, it } from 'vitest'

          import { canonicalProfileHref } from '../../../lib/canonical-profile-href'
          import { DEPRECATED_COMPOUND_CANONICALS } from '../../../lib/deprecated-compound-canonicals'
          import {
            CROSS_TAXONOMY_REDIRECT_SLUGS,
            DEPRECATED_HERB_CANONICALS,
          } from '../../../lib/deprecated-herb-canonicals'

          describe('retyped compound canonical identities', () => {
            it('routes old herb identities directly to final compound canonicals', () => {
              expect(DEPRECATED_HERB_CANONICALS.resveratrol).toBe('resveratrol')
              expect(DEPRECATED_HERB_CANONICALS.citicoline).toBe('cdp-choline')
              expect(DEPRECATED_HERB_CANONICALS.quercetin).toBe('quercetin')
              expect(DEPRECATED_HERB_CANONICALS.phosphatidylserine).toBe('phosphatidylserine')
              expect(DEPRECATED_HERB_CANONICALS.tyrosine).toBe('l-tyrosine')

              for (const slug of ['resveratrol', 'citicoline', 'quercetin', 'phosphatidylserine', 'tyrosine']) {
                expect(CROSS_TAXONOMY_REDIRECT_SLUGS.has(slug)).toBe(true)
              }

              expect(canonicalProfileHref('herbs', 'resveratrol')).toBe('/compounds/resveratrol/')
              expect(canonicalProfileHref('herbs', 'citicoline')).toBe('/compounds/cdp-choline/')
              expect(canonicalProfileHref('herbs', 'quercetin')).toBe('/compounds/quercetin/')
              expect(canonicalProfileHref('herbs', 'phosphatidylserine')).toBe('/compounds/phosphatidylserine/')
              expect(canonicalProfileHref('herbs', 'tyrosine')).toBe('/compounds/l-tyrosine/')
            })

            it('suppresses duplicate compound aliases while keeping resveratrol canonical', () => {
              expect(DEPRECATED_COMPOUND_CANONICALS.tyrosine).toBe('l-tyrosine')
              expect(DEPRECATED_COMPOUND_CANONICALS.citicoline).toBe('cdp-choline')
              expect(DEPRECATED_COMPOUND_CANONICALS['trans-resveratrol']).toBe('resveratrol')
              expect(DEPRECATED_COMPOUND_CANONICALS.resveratrol).toBeUndefined()

              expect(canonicalProfileHref('compounds', 'tyrosine')).toBe('/compounds/l-tyrosine/')
              expect(canonicalProfileHref('compounds', 'citicoline')).toBe('/compounds/cdp-choline/')
              expect(canonicalProfileHref('compounds', 'trans-resveratrol')).toBe('/compounds/resveratrol/')
              expect(canonicalProfileHref('compounds', 'resveratrol')).toBe('/compounds/resveratrol/')
            })

            it('keeps direct Cloudflare redirects for all migrated identities', () => {
              const redirects = readFileSync(path.join(process.cwd(), 'public/_redirects'), 'utf8')
              const required = [
                '/herbs/resveratrol /compounds/resveratrol/ 301',
                '/compounds/trans-resveratrol /compounds/resveratrol/ 301',
                '/herbs/citicoline /compounds/cdp-choline/ 301',
                '/compounds/citicoline /compounds/cdp-choline/ 301',
                '/herbs/quercetin /compounds/quercetin/ 301',
                '/herbs/phosphatidylserine /compounds/phosphatidylserine/ 301',
                '/herbs/tyrosine /compounds/l-tyrosine/ 301',
                '/compounds/tyrosine /compounds/l-tyrosine/ 301',
              ]
              for (const rule of required) expect(redirects).toContain(rule)
            })
          })
          TEST

      - name: Validate corrected workbook against generated core runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:workbook-schema
          npm run validate:workbook-patches
          npm run data:build:core
          node scripts/ci/validate-workbook-json-parity.mjs
          npm run enrich:doctor
          npx vitest run src/lib/__tests__/tyrosine-canonical.test.ts src/lib/__tests__/retyped-compound-canonicals.test.ts

      - name: Discard generated validation artifacts without writing Git index
        shell: bash
        run: |
          set -euo pipefail

          keep_tracked() {
            case "$1" in
              data-sources/herb_monograph_master.xlsx|lib/deprecated-herb-canonicals.ts|lib/deprecated-compound-canonicals.ts|public/_redirects|scripts/verify-redirects.mjs)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if ! keep_tracked "$path"; then
              mkdir -p "$(dirname "$path")"
              git show "HEAD:$path" > "$path"
            fi
          done < <(git diff --name-only HEAD)

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ "$path" != "src/lib/__tests__/retyped-compound-canonicals.test.ts" ]; then
              rm -rf -- "$path"
            fi
          done < <(git ls-files --others --exclude-standard)

          expected="$(printf '%s\n' \
            data-sources/herb_monograph_master.xlsx \
            lib/deprecated-compound-canonicals.ts \
            lib/deprecated-herb-canonicals.ts \
            public/_redirects \
            scripts/verify-redirects.mjs \
            src/lib/__tests__/retyped-compound-canonicals.test.ts | sort)"
          actual="$({ git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u)"

          echo "Durable dirty set:"
          printf '%s\n' "$actual"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected final dirty set after generated-artifact cleanup." >&2
            echo "Expected:" >&2
            printf '%s\n' "$expected" >&2
            exit 1
          fi

      - name: Prove source-of-truth path and zero generated drift after cleanup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/validate-workbook-source.mjs
          node scripts/ci/validate-workbook-schema.mjs
          node scripts/data/verify-workbook-only-path.mjs
          node scripts/ci/guard-no-full-build-drift.mjs

      - name: Publish corrected source of truth through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from 'node:fs'

          const token = process.env.GH_TOKEN
          const repo = process.env.REPO
          const branch = process.env.BRANCH
          const baseHead = process.env.BASE_HEAD
          if (!token || !repo || !branch || !baseHead) throw new Error('missing GitHub publish environment')

          const api = `https://api.github.com/repos/${repo}`
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'retype-five-compounds-v3',
          }

          async function request(path, options = {}) {
            const res = await fetch(`${api}${path}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            })
            const text = await res.text()
            let body = null
            if (text) {
              try { body = JSON.parse(text) } catch { body = text }
            }
            if (!res.ok) throw new Error(`${options.method || 'GET'} ${path}: ${res.status} ${JSON.stringify(body)}`)
            return body
          }

          const ref = await request(`/git/ref/heads/${encodeURIComponent(branch)}`)
          if (ref.object.sha !== baseHead) {
            throw new Error(`branch moved during validation: expected ${baseHead}, found ${ref.object.sha}`)
          }

          const baseCommit = await request(`/git/commits/${baseHead}`)
          const durable = [
            'data-sources/herb_monograph_master.xlsx',
            'lib/deprecated-compound-canonicals.ts',
            'lib/deprecated-herb-canonicals.ts',
            'public/_redirects',
            'scripts/verify-redirects.mjs',
            'src/lib/__tests__/retyped-compound-canonicals.test.ts',
          ]

          const tree = []
          for (const path of durable) {
            const content = fs.readFileSync(path).toString('base64')
            const blob = await request('/git/blobs', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ content, encoding: 'base64' }),
            })
            tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha })
          }

          tree.push({
            path: '.github/workflows/retype-five-compounds-v3.yml',
            mode: '100644',
            type: 'blob',
            sha: null,
          })

          const newTree = await request('/git/trees', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree }),
          })

          const commit = await request('/git/commits', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: 'fix(data): retype five compounds after duplicate consolidation',
              tree: newTree.sha,
              parents: [baseHead],
            }),
          })

          await request(`/git/refs/heads/${encodeURIComponent(branch)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sha: commit.sha, force: false }),
          })

          console.log(`Published durable commit ${commit.sha}`)
          NODE
