name: Propionate owner PR sync one-shot

on:
  push:
    branches:
      - data/propionate-closure-4992
    paths:
      - .github/workflows/propionate-owner-pr-sync-one-shot.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record owning PR in active control rows
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const edits = [
            {
              path: 'docs/CURRENT_SPRINT.md',
              before: '| Authority/Content | #4992 | site-swarm-integration | Active |',
              after: '| Authority/Content | #4992 / PR #5016 | site-swarm-integration | Active |',
            },
            {
              path: 'docs/MASTER_BACKLOG.md',
              before: '| #4992 | Close staged Propionate evidence before MS follow-up | A evidence | Active under governed lease |',
              after: '| #4992 / PR #5016 | Close staged Propionate evidence before MS follow-up | A evidence | Active under governed lease |',
            },
          ]

          for (const edit of edits) {
            const text = fs.readFileSync(edit.path, 'utf8')
            if (!text.includes(edit.before)) throw new Error(`missing expected active row in ${edit.path}`)
            fs.writeFileSync(edit.path, text.replace(edit.before, edit.after))
          }
          NODE

      - name: Verify project-control reconciliation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_REVISION: ${{ github.sha }}
        run: node scripts/ci/reconcile-project-control.mjs --github --revision "$CONTROL_REVISION"

      - name: Commit control correction and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_SPRINT.md docs/MASTER_BACKLOG.md
          git rm .github/workflows/propionate-owner-pr-sync-one-shot.yml
          git commit -m "docs(control): bind Propionate closure to PR 5016"
          git push origin HEAD:${GITHUB_REF_NAME}
