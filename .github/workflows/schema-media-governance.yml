name: Schema and Media Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'lib/schema*.ts'
      - 'lib/schema-*.ts'
      - 'lib/__tests__/schema*.test.ts'
      - 'lib/__tests__/schema-*.test.ts'
      - 'public/data/**'
      - 'data/evidence/**'
      - 'data/media/**'
      - 'scripts/ci/audit-schema-policy.mjs'
      - 'scripts/ci/audit-structured-data.mjs'
      - 'scripts/media/**'
      - '.github/workflows/schema-media-governance.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'lib/schema*.ts'
      - 'lib/schema-*.ts'
      - 'lib/__tests__/schema*.test.ts'
      - 'lib/__tests__/schema-*.test.ts'
      - 'public/data/**'
      - 'data/evidence/**'
      - 'data/media/**'
      - 'scripts/ci/audit-schema-policy.mjs'
      - 'scripts/ci/audit-structured-data.mjs'
      - 'scripts/media/**'
      - '.github/workflows/schema-media-governance.yml'
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: CI run containing the governed static export artifact
        required: false
        type: string
      producer_sha:
        description: Exact PR head SHA bound into the governed static export receipt
        required: false
        type: string
      producer_base_sha:
        description: Exact PR base SHA bound into the governed static export receipt
        required: false
        type: string
      producer_pr_number:
        description: PR number that produced the governed static export
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  schema-and-media:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject stale producer dispatch
        if: inputs.producer_sha != ''
        env:
          PRODUCER_SHA: ${{ inputs.producer_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$PRODUCER_SHA" ]; then
            echo "Producer dispatch is stale: workflow head=$GITHUB_SHA producer=$PRODUCER_SHA"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.producer_sha || github.sha }}

      - name: Classify release impact
        id: impact
        if: inputs.producer_pr_number != '' || github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ inputs.producer_base_sha || github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | node scripts/ci/classify-release-impact.mjs --github-output="$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Run shared schema regression tests
        run: >-
          npx vitest run
          lib/__tests__/schema-graph.test.ts
          lib/__tests__/schema-injector.test.ts
          lib/__tests__/structured-data.test.ts

      - name: Download governed static export
        id: governed-download
        if: inputs.producer_run_id != '' && inputs.producer_sha != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: governed-static-export-${{ inputs.producer_sha }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Verify governed static export receipt
        id: governed-verify
        if: steps.governed-download.outcome == 'success'
        continue-on-error: true
        run: >-
          node scripts/ci/governed-static-export.mjs verify
          --source-sha "${{ inputs.producer_sha }}"
          --base-sha "${{ inputs.producer_base_sha }}"

      - name: Build static export fallback
        if: steps.governed-verify.outcome != 'success'
        env:
          COMMIT_HASH: ${{ inputs.producer_sha || github.sha }}
        run: |
          rm -rf out .governed-static-export.json
          npm run build:deploy

      - name: Existing structured-data completeness audit
        env:
          FULL_HTML_AUDIT: '1'
        run: node scripts/ci/audit-structured-data.mjs

      - name: Enforce schema safety and truthfulness policy
        run: node scripts/ci/audit-schema-policy.mjs

      - name: Generate review-only research graphics
        if: steps.impact.outputs.leaf_page_only != 'true'
        run: node scripts/media/build-research-graphics.mjs

      - name: Validate graphic promotion registry
        if: steps.impact.outputs.leaf_page_only != 'true'
        run: node scripts/media/promote-reviewed-research-graphics.mjs --check

      - name: Leaf-page media fast path
        if: steps.impact.outputs.leaf_page_only == 'true'
        run: echo 'Leaf-page-only change; schema validation remains full, while unrelated research-graphics generation/promotion checks are skipped.'

      - name: Upload reports and graphics for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schema-media-${{ github.run_number }}
          path: |
            reports/schema-policy.json
            ops/reports/structured-data-completeness.json
            artifacts/research-graphics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Report governed export reuse
        if: always()
        run: |
          echo '## Schema and Media Governance' >> "$GITHUB_STEP_SUMMARY"
          echo "- Producer SHA: ${{ inputs.producer_sha || 'none (self-built fallback)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governed receipt verified: ${{ steps.governed-verify.outcome == 'success' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Same-repository PRs audit the exact CI export instead of rebuilding it.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Schema tests and safety/truthfulness audits are unchanged; leaf-page media fast path is preserved.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wake trusted merge controller
        if: always() && github.event_name == 'workflow_dispatch' && inputs.producer_pr_number != '' && inputs.producer_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_PR_NUMBER: ${{ inputs.producer_pr_number }}
          PRODUCER_SHA: ${{ inputs.producer_sha }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-merge-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "pr_number=$PRODUCER_PR_NUMBER" \
            -f "expected_head_sha=$PRODUCER_SHA"
