name: Security lockfile refresh

on:
  push:
    branches:
      - security/october-audit-sharp-shellquote-6211
    paths:
      - package.json
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/october-audit-sharp-shellquote-6211
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Verify high/critical audit gate
        run: npm run audit:high
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: regenerate patched dependency lockfile"
          git push origin HEAD:security/october-audit-sharp-shellquote-6211
