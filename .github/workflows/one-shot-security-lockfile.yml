name: One-shot security lockfile remediation

on:
  push:
    branches:
      - secondary/security-transitive-overrides

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.event.head_commit.message == 'Bootstrap security lockfile remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: secondary/security-transitive-overrides

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add targeted security overrides
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))

          pkg.overrides = {
            'brace-expansion@1.x': '1.1.18',
            'brace-expansion@2.x': '2.1.4',
            'fast-uri': '3.1.5',
            'postcss': '^8.5.18',
            'sharp': '$sharp',
            'undici': '7.29.0',
            'uuid': '11.1.1',
            'ws': '8.21.0'
          }

          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Show remaining audit findings
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs')
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'))
          console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2))
          for (const [name, finding] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(`${name}: ${finding.severity}`)
          }
          NODE

      - name: Commit generated dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'Apply targeted transitive security overrides'
          git push
