name: One-shot GitHub Actions runtime modernization

on:
  push:
    branches:
      - secondary/github-actions-node24

permissions:
  contents: read

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: secondary/github-actions-node24

      - name: Update official action majors
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          replacements = {
              r'actions/checkout@v\d+': 'actions/checkout@v7',
              r'actions/setup-node@v\d+': 'actions/setup-node@v7',
              r'actions/cache@v\d+': 'actions/cache@v6',
              r'actions/cache/restore@v\d+': 'actions/cache/restore@v6',
              r'actions/cache/save@v\d+': 'actions/cache/save@v6',
              r'actions/upload-artifact@v\d+': 'actions/upload-artifact@v7',
              r'actions/download-artifact@v\d+': 'actions/download-artifact@v8',
          }

          changed = []
          workflow_dir = Path('.github/workflows')
          for path in sorted([*workflow_dir.glob('*.yml'), *workflow_dir.glob('*.yaml')]):
              if path.name == 'modernize-actions-runtime.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for pattern, replacement in replacements.items():
                  updated = re.sub(pattern, replacement, updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if len(changed) != 22:
              raise SystemExit(f'Expected 22 changed workflow files, found {len(changed)}')
          Path('modernized-workflows-manifest.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('\n'.join(changed))
          PY

      - name: Verify deprecated majors are gone
        run: |
          ! grep -R -nE 'actions/(checkout|setup-node|cache|cache/restore|cache/save|upload-artifact|download-artifact)@v[1-4]([^0-9]|$)' .github/workflows --include='*.yml' --include='*.yaml' --exclude='modernize-actions-runtime.yml'

      - name: Remove generator from artifact
        run: rm .github/workflows/modernize-actions-runtime.yml

      - name: Upload modernized workflows
        uses: actions/upload-artifact@v7
        with:
          name: modernized-workflows
          path: |
            .github/workflows
            modernized-workflows-manifest.txt
          if-no-files-found: error
          retention-days: 1
