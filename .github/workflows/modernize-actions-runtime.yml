name: One-shot GitHub Actions runtime modernization

on:
  push:
    branches:
      - secondary/github-actions-node24

permissions:
  contents: write

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: secondary/github-actions-node24
          fetch-depth: 0

      - name: Update official action majors
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          replacements = {
              r'actions/checkout@v\d+': 'actions/checkout@v7',
              r'actions/setup-node@v\d+': 'actions/setup-node@v7',
              r'actions/cache@v\d+': 'actions/cache@v6',
              r'actions/cache/restore@v\d+': 'actions/cache/restore@v6',
              r'actions/cache/save@v\d+': 'actions/cache/save@v6',
              r'actions/upload-artifact@v\d+': 'actions/upload-artifact@v7',
              r'actions/download-artifact@v\d+': 'actions/download-artifact@v8',
          }

          changed = []
          workflow_dir = Path('.github/workflows')
          for path in sorted([*workflow_dir.glob('*.yml'), *workflow_dir.glob('*.yaml')]):
              text = path.read_text(encoding='utf-8')
              updated = text
              for pattern, replacement in replacements.items():
                  updated = re.sub(pattern, replacement, updated)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No live workflow action references required modernization')
          print(f'Updated {len(changed)} workflow files:')
          print('\n'.join(changed))
          PY

      - name: Verify deprecated majors are gone
        run: |
          ! grep -R -nE 'actions/(checkout|setup-node|cache|cache/restore|cache/save|upload-artifact|download-artifact)@v[1-4]([^0-9]|$)' .github/workflows --include='*.yml' --include='*.yaml'

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/modernize-actions-runtime.yml
          git add .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Modernize GitHub Actions runtimes"
          git push origin HEAD:secondary/github-actions-node24
