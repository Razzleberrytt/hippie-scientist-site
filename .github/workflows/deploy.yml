name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      STATIC_OUTPUT_DIR: out
      DEPLOY_MODE: cloudflare-direct
      DEPLOY_BRANCH: ${{ github.ref_name }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify controller-authorized merge
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_AUTH_ATTEMPTS: '30'
          DEPLOY_AUTH_INTERVAL_MS: '10000'
        run: node scripts/ci/verify-deploy-authorization.mjs

      - name: Restore IndexNow state
        uses: actions/cache@v6
        with:
          path: |
            ops/indexnow-state.json
            ops/indexnow-redirect-state.json
          key: indexnow-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-${{ runner.os }}-

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Check Node version contract
        run: npm run check:node

      - name: Audit high-severity dependencies
        run: npm run audit:high

      - name: Run test suite
        run: npm run test

      - name: Validate canonical data pipeline
        run: npm run data:ci

      - name: Validate workbook source
        run: npm run validate:workbook-source

      - name: Validate static export compatibility
        run: npm run validate:static-export

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Guard workbook source-of-truth
        run: npm run guard:source-of-truth

      - name: Audit cluster-member runtime trust
        run: npm run audit:cluster-member-trust:strict

      - name: Build governed Metricool publication pilot
        run: |
          node scripts/distribution/build-research-distribution.mjs
          node scripts/distribution/build-opportunity-selection.mjs
          node scripts/distribution/build-bounded-pilot.mjs

      - name: Provision and verify ffmpeg when governed pilot requires video
        run: |
          set -euo pipefail
          PILOT_FILE="$(find artifacts/distribution/pilots -name bounded-pilot.json -type f -print -quit)"
          if [ -z "${PILOT_FILE:-}" ]; then
            echo '❌ Missing governed bounded pilot; cannot decide ffmpeg requirement.'
            exit 1
          fi
          FORMAT="$(jq -r '.lifecycle.identity.format // .selectedOpportunity.platform // empty' "$PILOT_FILE")"
          if [ "$FORMAT" != 'short-video' ]; then
            echo "[distribution] ${FORMAT:-unknown} pilot does not require ffmpeg; skipping provisioning."
            exit 0
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version | sed -n '1p'

      - name: Stage governed Metricool publication media
        run: node scripts/distribution/stage-metricool-publication-media.mjs

      - name: Build app
        env:
          COMMIT_HASH: ${{ env.DEPLOY_SHA }}
          AMAZON_AFFILIATE_TAG: ${{ vars.AMAZON_AFFILIATE_TAG }}
        run: npm run build:deploy

      - name: Verify build output
        env:
          AMAZON_AFFILIATE_TAG: ${{ vars.AMAZON_AFFILIATE_TAG }}
        run: npm run verify:output

      - name: Verify Amazon affiliate tag (production safety)
        run: npm run audit:affiliate-tag-production

      - name: Validate deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "❌ Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "❌ Missing required secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_PAGES_PROJECT:-}" ]; then
            echo "❌ Missing required secret: CLOUDFLARE_PAGES_PROJECT"
            exit 1
          fi

      - name: Pre-deploy verification
        run: |
          set -euo pipefail

          if [ ! -d "$STATIC_OUTPUT_DIR" ]; then
            echo "❌ Missing deploy directory: $STATIC_OUTPUT_DIR"
            exit 1
          fi

          if [ ! -f "$STATIC_OUTPUT_DIR/index.html" ]; then
            echo "❌ Missing required file: $STATIC_OUTPUT_DIR/index.html"
            exit 1
          fi

          if [ ! -f "$STATIC_OUTPUT_DIR/media/distribution/metricool/latest.json" ]; then
            echo "❌ Missing governed Metricool publication-media manifest"
            exit 1
          fi

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto'
          import fs from 'node:fs'
          import path from 'node:path'
          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const manifestFile = path.join(process.env.STATIC_OUTPUT_DIR || 'out', 'media/distribution/metricool/latest.json')
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'))
          if (manifest?.schemaVersion !== 'metricool-publication-media-v1' || manifest?.status !== 'ready-for-provider') {
            throw new Error('deployed Metricool manifest contract is invalid')
          }
          if (manifest.format === 'carousel' && manifest.mediaType !== 'image') throw new Error('carousel manifest must declare image media')
          if (manifest.format === 'vertical-video' && manifest.mediaType !== 'video') throw new Error('vertical-video manifest must declare video media')
          if (!['carousel', 'vertical-video'].includes(manifest.format)) throw new Error(`unsupported deployed Metricool format: ${manifest.format}`)
          if (!Array.isArray(manifest.media) || manifest.media.length === 0) throw new Error('deployed Metricool manifest has no media')
          if (manifest.format === 'vertical-video' && manifest.media.length !== 1) throw new Error('vertical-video deployment must contain exactly one MP4')
          for (const item of manifest.media) {
            const url = new URL(item.url)
            if (url.hostname !== 'thehippiescientist.net' || !url.pathname.startsWith('/media/distribution/metricool/')) {
              throw new Error(`invalid governed media URL: ${item.url}`)
            }
            const file = path.join(process.env.STATIC_OUTPUT_DIR || 'out', url.pathname.replace(/^\/+/, ''))
            if (!fs.existsSync(file)) throw new Error(`governed media missing from static output: ${url.pathname}`)
            const bytes = fs.readFileSync(file)
            if (sha256(bytes) !== String(item.sha256 || '')) throw new Error(`governed media hash mismatch in static output: ${url.pathname}`)
            if (Number(item.bytes) !== bytes.length) throw new Error(`governed media byte-size mismatch in static output: ${url.pathname}`)
            if (manifest.mediaType === 'video' && !url.pathname.endsWith('.mp4')) throw new Error('vertical-video deployment must expose an MP4')
            if (manifest.mediaType === 'image' && !url.pathname.endsWith('.webp')) throw new Error('carousel deployment must expose WebP media')
          }
          console.log(`[distribution] verified deployed ${manifest.format} manifest with ${manifest.media.length} media asset(s)`)
          NODE

          echo "ℹ️ Top-level deploy files:"
          find "$STATIC_OUTPUT_DIR" -maxdepth 1 -type f -printf ' - %f\n' | sort

          if [ -f "public/_headers" ]; then
            echo "ℹ️ public/_headers exists; requiring $STATIC_OUTPUT_DIR/_headers"
            if [ ! -f "$STATIC_OUTPUT_DIR/_headers" ]; then
              echo "❌ Expected $STATIC_OUTPUT_DIR/_headers because public/_headers exists"
              exit 1
            fi
          else
            echo "ℹ️ public/_headers not present; $STATIC_OUTPUT_DIR/_headers not required"
          fi

          if [ -f "public/_redirects" ]; then
            echo "ℹ️ public/_redirects exists; requiring $STATIC_OUTPUT_DIR/_redirects"
            if [ ! -f "$STATIC_OUTPUT_DIR/_redirects" ]; then
              echo "❌ Expected $STATIC_OUTPUT_DIR/_redirects because public/_redirects exists"
              exit 1
            fi
          else
            echo "ℹ️ public/_redirects not present; $STATIC_OUTPUT_DIR/_redirects not required"
          fi

      - name: Write exact deployment receipt
        env:
          DEPLOY_RECEIPT_PATH: ${{ env.STATIC_OUTPUT_DIR }}/.well-known/deployment.json
        run: node scripts/ci/deployment-receipt.mjs write

      - name: Deployment summary
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          {
            echo "## Cloudflare deployment summary"
            echo "- Node version: $(node --version)"
            echo "- npm version: $(npm --version)"
            echo "- Branch/ref: ${DEPLOY_BRANCH:-$GITHUB_REF}"
            echo "- Commit: ${DEPLOY_SHA:-$GITHUB_SHA}"
            echo "- Project name: ${CLOUDFLARE_PAGES_PROJECT:-<missing>}"
            if [ -f "$STATIC_OUTPUT_DIR/index.html" ]; then
              echo "- out/index.html exists: yes"
            else
              echo "- out/index.html exists: no"
            fi
            if [ -f "$STATIC_OUTPUT_DIR/media/distribution/metricool/latest.json" ]; then
              FORMAT="$(jq -r '.format // "unknown"' "$STATIC_OUTPUT_DIR/media/distribution/metricool/latest.json")"
              MEDIA_TYPE="$(jq -r '.mediaType // "unknown"' "$STATIC_OUTPUT_DIR/media/distribution/metricool/latest.json")"
              echo "- governed Metricool publication media staged: yes (${FORMAT}/${MEDIA_TYPE})"
            else
              echo "- governed Metricool publication media staged: no"
            fi
            if [ -f "$STATIC_OUTPUT_DIR/.well-known/deployment.json" ]; then
              echo "- exact deployment receipt generated: yes"
            else
              echo "- exact deployment receipt generated: no"
            fi
            if [ -f "public/_headers" ]; then
              if [ -f "$STATIC_OUTPUT_DIR/_headers" ]; then
                echo "- _headers found and copied: yes"
              else
                echo "- _headers found and copied: no"
              fi
            else
              echo "- _headers source present: no (not required)"
            fi
            if [ -f "public/_redirects" ]; then
              if [ -f "$STATIC_OUTPUT_DIR/_redirects" ]; then
                echo "- _redirects found and copied: yes"
              else
                echo "- _redirects found and copied: no"
              fi
            else
              echo "- _redirects source present: no (not required)"
            fi
            echo "- Deployment command: npx wrangler pages deploy out --project-name \"$CLOUDFLARE_PAGES_PROJECT\" --branch \"${DEPLOY_BRANCH:-main}\" --commit-hash \"${DEPLOY_SHA:-$GITHUB_SHA}\""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: npx --no-install wrangler pages deploy out --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "${DEPLOY_BRANCH:-main}" --commit-hash "${DEPLOY_SHA:-$GITHUB_SHA}"

      - name: Verify exact production receipt
        env:
          PRODUCTION_ORIGIN: https://thehippiescientist.net
          DEPLOY_RECEIPT_ATTEMPTS: '30'
          DEPLOY_RECEIPT_INTERVAL_SECONDS: '10'
        run: node scripts/ci/deployment-receipt.mjs verify

      - name: Notify IndexNow of changed URLs
        continue-on-error: true
        run: node scripts/seo/indexnow-submit.mjs --submit --bootstrap

      - name: Notify IndexNow of redirect changes
        continue-on-error: true
        run: node scripts/seo/indexnow-redirect-submit.mjs --submit --bootstrap
