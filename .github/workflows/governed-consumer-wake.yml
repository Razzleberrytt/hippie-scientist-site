name: Governed Consumer Wake

on:
  workflow_run:
    workflows:
      - Build Check
      - Lighthouse CI
      - Production Content Lint
    types: [completed]

concurrency:
  group: governed-consumer-wake-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  wake:
    name: wake-trusted-merge-controller
    if: github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve exact open PR for completed consumer
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          candidates="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls")"
          matches="$(jq --arg repo "$GITHUB_REPOSITORY" --arg sha "$HEAD_SHA" \
            '[.[] | select(.state == "open" and .head.repo.full_name == $repo and .head.sha == $sha)]' \
            <<<"$candidates")"
          count="$(jq 'length' <<<"$matches")"
          if [ "$count" -ne 1 ]; then
            echo "::notice title=Merge controller wake::Expected exactly one open same-repo PR for $HEAD_SHA; found $count. No privileged dispatch performed."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number="$(jq -r '.[0].number' <<<"$matches")"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch targeted trusted merge controller
        if: steps.context.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-merge-controller.yml --ref main \
            -f pr_number="${{ steps.context.outputs.pr_number }}" \
            -f expected_head_sha="${{ steps.context.outputs.head_sha }}"
