name: Manual Cobalamin Source Admission

on:
  push:
    branches:
      - manual/cobalamin-closure-20260926
    paths:
      - '.github/workflows/manual-cobalamin-source-admission.yml'

permissions:
  contents: write

concurrency:
  group: manual-cobalamin-source-admission
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manual/cobalamin-closure-20260926
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify live cobalamin lease
        run: |
          node <<'NODE'
          const fs = require('fs')
          const q = JSON.parse(fs.readFileSync('ops/enrichment-governor/work-queue.json','utf8'))
          const lease = (q.leases || []).find(x => x.id === 'lease-5703-cobalamin-closure')
          if (!lease) throw new Error('cobalamin lease missing')
          if (lease.owner !== 'site-swarm-integration') throw new Error('unexpected lease owner')
          if (!Array.isArray(lease.entities) || lease.entities.length !== 1 || lease.entities[0] !== 'compound:cobalamin') throw new Error('unexpected lease scope')
          const remainingMs = Date.parse(lease.expiresAt) - Date.now()
          if (remainingMs <= 5 * 60 * 1000) throw new Error('cobalamin lease has <=5 minutes remaining')
          console.log({ leaseId: lease.id, expiresAt: lease.expiresAt, remainingMinutes: Math.floor(remainingMs/60000) })
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regenerate authoritative intake chain
        run: |
          npx tsx scripts/report-enrichment-health.ts
          npx tsx scripts/report-enrichment-backlog.ts
          npx tsx scripts/report-enrichment-review-cycle.ts
          npx tsx scripts/report-enrichment-workpacks.ts
          npx tsx scripts/report-source-gaps.ts
          npx tsx scripts/report-source-intake-queue.ts

      - name: Stage exactly five cobalamin source candidates and target
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const intake = JSON.parse(fs.readFileSync('ops/reports/source-intake-queue.json','utf8'))
          const sourceClass = 'systematic-review-meta-analysis'
          const tasks = (intake.tasks || [])
            .filter(t => t.itemType === 'compound_page' && t.entitySlug === 'cobalamin')
            .filter(t =>
              (t.recommendedSourceClasses || []).includes(sourceClass) ||
              (t.adaptiveRetryAttempts || []).some(a =>
                a.pass !== 'pass_4_stop_manual_review' && (a.allowedSourceClasses || []).includes(sourceClass)
              )
            )
          const topicRank = new Map([['evidence',0],['source_registry',1],['safety',2],['surface_coverage',3],['mechanism',4],['constituent',5]])
          tasks.sort((a,b) => {
            const aInitial = (a.recommendedSourceClasses || []).includes(sourceClass) ? 0 : 1
            const bInitial = (b.recommendedSourceClasses || []).includes(sourceClass) ? 0 : 1
            return aInitial - bInitial || (topicRank.get(a.topicType) ?? 99) - (topicRank.get(b.topicType) ?? 99) || a.intakeTaskId.localeCompare(b.intakeTaskId)
          })
          const task = tasks[0]
          if (!task) throw new Error('fresh intake chain produced no cobalamin task with initial or recorded-retry authorization for systematic-review-meta-analysis')
          const candidatesPath = 'ops/source-candidates.json'
          const candidates = JSON.parse(fs.readFileSync(candidatesPath,'utf8'))
          const pmids = new Set(['33809274','22221769','37046885','42227307','39655146'])
          const conflicts = candidates.filter(c => pmids.has(String(c.pmid || '')))
          if (conflicts.length) throw new Error('cobalamin PMID already exists in candidate queue: ' + conflicts.map(c=>c.candidateSourceId).join(', '))
          const base = {
            intakeTaskId: task.intakeTaskId,
            sourceClass: 'systematic-review-meta-analysis',
            evidenceClass: 'human-clinical',
            publicationStatus: 'published',
            duplicateRisk: 'low',
            reviewStatus: 'under_review',
            active: true,
            language: 'en',
            relatedEntities: [{ entityType: 'compound', entitySlug: 'cobalamin' }],
            relatedTopicGaps: [task.topicType],
            whyThisSourceMatters: 'Admitted #5703 evidence closure source for the deficiency-versus-enhancement boundary; no consumer-dose inference.'
          }
          const rows = [
            {
              ...base,
              candidateSourceId:'cand_cobalamin-33809274',
              title:'Effects of Vitamin B12 Supplementation on Cognitive Function, Depressive Symptoms, and Fatigue: A Systematic Review, Meta-Analysis, and Meta-Regression',
              shortTitle:'B12 cognition depression fatigue meta-analysis',
              sourceType:'meta-analysis',
              authors:['Stefan Markun','Isaac Gravestock','Levy Jäger','Thomas Rosemann','Giuseppe Pichierri','Jakob M Burgstaller'],
              publicationYear:2021,
              citationText:'Markun S, Gravestock I, Jäger L, Rosemann T, Pichierri G, Burgstaller JM. Nutrients. 2021;13(3):923. PMID:33809274.',
              doi:'10.3390/nu13030923',
              pmid:'33809274',
              canonicalUrl:'https://pubmed.ncbi.nlm.nih.gov/33809274/',
              studyDesign:'meta-analysis',
              proposedReliabilityTier:'tier-a'
            },
            {
              ...base,
              candidateSourceId:'cand_cobalamin-22221769',
              title:'Cognitive impairment and vitamin B12: a review',
              shortTitle:'Vitamin B12 cognitive impairment review',
              sourceType:'systematic-review',
              authors:['Eileen Moore','Alastair Mander','David Ames','Ross Carne','Kerrie Sanders','David Watters'],
              publicationYear:2012,
              citationText:'Moore E, Mander A, Ames D, Carne R, Sanders K, Watters D. Int Psychogeriatr. 2012;24(4):541-556. PMID:22221769.',
              doi:'10.1017/S1041610211002511',
              pmid:'22221769',
              canonicalUrl:'https://pubmed.ncbi.nlm.nih.gov/22221769/',
              studyDesign:'systematic-review',
              proposedReliabilityTier:'tier-b'
            },
            {
              ...base,
              candidateSourceId:'cand_cobalamin-37046885',
              title:'Neurological Implications of Vitamin B12 Deficiency in Diet: A Systematic Review and Meta-Analysis',
              shortTitle:'B12 deficiency neurologic systematic review',
              sourceType:'meta-analysis',
              authors:['Mubarak Alruwaili','Rehana Basri','Raed AlRuwaili','Anas Mohammad Albarrak','Naif H Ali'],
              publicationYear:2023,
              citationText:'Alruwaili M, Basri R, AlRuwaili R, Albarrak AM, Ali NH. Healthcare (Basel). 2023;11(7):958. PMID:37046885.',
              doi:'10.3390/healthcare11070958',
              pmid:'37046885',
              canonicalUrl:'https://pubmed.ncbi.nlm.nih.gov/37046885/',
              studyDesign:'meta-analysis',
              proposedReliabilityTier:'tier-a'
            },
            {
              ...base,
              candidateSourceId:'cand_cobalamin-42227307',
              title:'Vitamin B12 supplementation for growth, development, and cognition in children',
              shortTitle:'Cochrane pediatric vitamin B12 review',
              sourceType:'systematic-review',
              authors:['Doreen Y Larvie','Cristina E Güitrón Leal','Sudha Venkatramanan','Ximena E Palma Molina','Lili B Steel','Rebecca Kuriyan','Julia L Finkelstein'],
              publicationYear:2026,
              citationText:'Larvie DY, Güitrón Leal CE, Venkatramanan S, et al. Cochrane Database Syst Rev. 2026;6:CD015264. PMID:42227307.',
              doi:'10.1002/14651858.CD015264.pub2',
              pmid:'42227307',
              canonicalUrl:'https://pubmed.ncbi.nlm.nih.gov/42227307/',
              studyDesign:'systematic-review',
              proposedReliabilityTier:'tier-a'
            },
            {
              ...base,
              candidateSourceId:'cand_cobalamin-39655146',
              title:'Assessment of Vitamin B12 Efficacy on Cognitive Memory Function and Depressive Symptoms: A Systematic Review and Meta-Analysis',
              shortTitle:'B12 memory depression null meta-analysis',
              sourceType:'meta-analysis',
              authors:['Hayat Alzahrani'],
              publicationYear:2024,
              citationText:'Alzahrani H. Cureus. 2024;16(11):e73350. PMID:39655146.',
              doi:'10.7759/cureus.73350',
              pmid:'39655146',
              canonicalUrl:'https://pubmed.ncbi.nlm.nih.gov/39655146/',
              studyDesign:'meta-analysis',
              proposedReliabilityTier:'tier-b'
            }
          ]
          fs.writeFileSync(candidatesPath, JSON.stringify([...candidates, ...rows], null, 2) + '\n')
          const workpacks = JSON.parse(fs.readFileSync('ops/reports/enrichment-workpacks.json','utf8'))
          const workpack = (workpacks.workpacks || []).find(w => w.workpackId === 'wp_compound_cobalamin')
          if (!workpack) throw new Error('fresh workpack report missing wp_compound_cobalamin')
          const gaps = JSON.parse(fs.readFileSync('ops/reports/source-gaps.json','utf8'))
          const criticality = (gaps.gapItems || [])
            .filter(g => (g.relatedWorkpackIds || []).includes('wp_compound_cobalamin'))
            .filter(g => g.safetyCritical || g.publishBlocking)
            .map(g => g.gapId)
            .sort()
          const target = {
            generatedAt: new Date().toISOString(),
            deterministicModelVersion:'cobalamin-closure-explicit-target-v1',
            targets:[{
              entityType:'compound',
              entitySlug:'cobalamin',
              waveStatus:'declared-target',
              selectionWhy:'admitted Authority/Content closure #5703',
              highestPriorityMissingTopics:[...(workpack.missingTopics || [])].sort(),
              criticality,
              currentGovernedCoverageStatus:workpack.reviewCycleState || 'unknown'
            }]
          }
          fs.mkdirSync('ops/targets',{recursive:true})
          fs.writeFileSync('ops/targets/cobalamin-closure.json', JSON.stringify(target,null,2)+'\n')
          console.log({ intakeTaskId: task.intakeTaskId, topicType: task.topicType, candidateCount: rows.length, missingTopics: target.targets[0].highestPriorityMissingTopics })
          NODE

      - name: Non-mutating candidate promotion preview
        run: |
          npx tsx scripts/report-source-candidate-review.ts
          node <<'NODE'
          const r = JSON.parse(require('fs').readFileSync('ops/reports/source-candidate-review.json','utf8'))
          const ids = new Set(['cand_cobalamin-33809274','cand_cobalamin-22221769','cand_cobalamin-37046885','cand_cobalamin-42227307','cand_cobalamin-39655146'])
          const rows = (r.assessments || []).filter(x => ids.has(x.candidateSourceId))
          if (rows.length !== 5) throw new Error('preview did not assess all five cobalamin candidates')
          const blocked = rows.filter(x => !x.promotable || (x.promotionBlockedReasons || []).length)
          if (blocked.length) throw new Error('cobalamin preview blocked: ' + JSON.stringify(blocked))
          const expected = new Set(['src_pubmed-33809274','src_pubmed-22221769','src_pubmed-37046885','src_pubmed-42227307','src_pubmed-39655146'])
          for (const row of rows) if (!expected.has(row.proposedRegistrySourceId)) throw new Error('unexpected proposed source id: ' + JSON.stringify(row))
          console.log(rows.map(x => ({ candidateSourceId:x.candidateSourceId, sourceId:x.proposedRegistrySourceId, status:x.derivedReviewStatus })))
          NODE

      - name: Recheck lease immediately before canonical source review
        run: |
          node <<'NODE'
          const fs = require('fs')
          const q = JSON.parse(fs.readFileSync('ops/enrichment-governor/work-queue.json','utf8'))
          const lease = (q.leases || []).find(x => x.id === 'lease-5703-cobalamin-closure')
          if (!lease || lease.owner !== 'site-swarm-integration' || lease.entities?.[0] !== 'compound:cobalamin') throw new Error('cobalamin lease missing or changed')
          const remainingMs = Date.parse(lease.expiresAt) - Date.now()
          if (remainingMs <= 2 * 60 * 1000) throw new Error('cobalamin lease has <=2 minutes remaining before source mutation')
          console.log({ expiresAt: lease.expiresAt, remainingMinutes: Math.floor(remainingMs/60000) })
          NODE

      - name: Governed five-source wave review
        run: node scripts/run-enrichment-wave.mjs --wave-id cobalamin-closure --targets ops/targets/cobalamin-closure.json --mode source-review

      - name: Verify exact five-source promotion
        run: |
          node <<'NODE'
          const fs = require('fs')
          const review = JSON.parse(fs.readFileSync('ops/reports/source-cobalamin-closure-review.json','utf8'))
          if (review.summary.reviewedCandidateCount !== 5 || review.summary.approvedCount !== 5 || review.summary.promotedCount !== 5) throw new Error('source review did not promote exactly five: ' + JSON.stringify(review.summary))
          const expected = ['33809274','22221769','37046885','42227307','39655146']
          const registry = JSON.parse(fs.readFileSync('public/data/source-registry.json','utf8'))
          for (const pmid of expected) {
            const row = registry.find(x => String(x.pmid || '') === pmid)
            if (!row) throw new Error('missing registry PMID ' + pmid)
            if (row.sourceId !== 'src_pubmed-' + pmid) throw new Error('wrong registry identity for ' + pmid + ': ' + row.sourceId)
            if (!row.doi) throw new Error('DOI metadata missing for ' + pmid)
            if (row.active !== true) throw new Error('source inactive for ' + pmid)
          }
          console.log(review.summary)
          NODE

      - name: Run focused pipeline regressions
        run: |
          node --test scripts/enrichment-governor/__tests__/source-candidate-identity.test.mjs
          node scripts/validate-source-registry.mjs
          node scripts/enrichment-governor/validate-state.mjs

      - name: Commit governed source admission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/source-candidates.json public/data/source-registry.json ops/targets/cobalamin-closure.json
          git diff --cached --quiet && { echo "No governed source delta produced"; exit 1; }
          git commit -m "data(enrichment): admit cobalamin closure sources"
          git push origin HEAD:manual/cobalamin-closure-20260926
