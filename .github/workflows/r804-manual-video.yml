name: R8.04 manual video build

on:
  pull_request:
    paths:
      - 'scripts/manual-video/r804_more_supplements.py'
      - '.github/workflows/r804-manual-video.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install local production runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install kokoro-onnx soundfile pillow numpy

      - name: Download open Kokoro model assets
        run: |
          curl -L --fail --retry 3             -o kokoro-v1.0.fp16.onnx             https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx
          curl -L --fail --retry 3             -o voices-v1.0.bin             https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          sha256sum kokoro-v1.0.fp16.onnx voices-v1.0.bin

      - name: Render R8.04 candidates
        run: |
          python scripts/manual-video/r804_more_supplements.py             --out artifacts/r804-more-supplements             --model kokoro-v1.0.fp16.onnx             --voices voices-v1.0.bin

      - name: Inspect rendered MP4s
        run: |
          for f in artifacts/r804-more-supplements/*.mp4; do
            echo "=== $f ==="
            ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,sample_rate,channels -of json "$f"
          done

      - name: Upload finished production candidates
        uses: actions/upload-artifact@v4
        with:
          name: r804-more-supplements
          path: artifacts/r804-more-supplements/
          if-no-files-found: error
          retention-days: 7
