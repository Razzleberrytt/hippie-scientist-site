name: Finalize retyped runtime roots

on:
  push:
    branches:
      - fix/retype-five-compounds-v2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Snapshot committed roots
        run: |
          cp public/data/herbs.json /tmp/herbs-before.json
          cp public/data/compounds.json /tmp/compounds-before.json
      - name: Generate authoritative workbook runtime
        run: node scripts/data/build-runtime-from-workbook.mjs --out public/data
      - name: Isolate only the five taxonomy moves
        run: |
          cp public/data/herbs.json /tmp/herbs-generated.json
          cp public/data/compounds.json /tmp/compounds-generated.json
          git restore public/data
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const targets = ['citicoline','phosphatidylserine','quercetin','resveratrol','tyrosine']
          const targetSet = new Set(targets)
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'))
          const slug = r => String(r?.slug || '').trim().toLowerCase()
          const beforeHerbs = read('/tmp/herbs-before.json')
          const beforeCompounds = read('/tmp/compounds-before.json')
          const generatedHerbs = read('/tmp/herbs-generated.json')
          const generatedCompounds = read('/tmp/compounds-generated.json')
          const beforeHerbMap = new Map(beforeHerbs.map(r => [slug(r), r]))
          const beforeCompoundMap = new Map(beforeCompounds.map(r => [slug(r), r]))
          const generatedCompoundMap = new Map(generatedCompounds.map(r => [slug(r), r]))
          const eq = (a,b) => JSON.stringify(a) === JSON.stringify(b)

          const expectedHerbOrder = beforeHerbs.map(slug).filter(s => !targetSet.has(s))
          const generatedHerbOrder = generatedHerbs.map(slug)
          if (!eq(expectedHerbOrder, generatedHerbOrder)) {
            throw new Error('Generator changed herb membership/order beyond the five scoped retypes')
          }
          const generatedCommonCompoundOrder = generatedCompounds.map(slug).filter(s => !targetSet.has(s))
          const beforeCompoundOrder = beforeCompounds.map(slug)
          if (!eq(beforeCompoundOrder, generatedCommonCompoundOrder)) {
            throw new Error('Generator changed compound membership/order beyond the five scoped retypes')
          }
          for (const target of targets) {
            if (!beforeHerbMap.has(target)) throw new Error(`Expected ${target} in committed herb root`)
            if (beforeCompoundMap.has(target)) throw new Error(`Unexpected pre-existing compound root record: ${target}`)
            if (!generatedCompoundMap.has(target)) throw new Error(`Generator did not emit compound record: ${target}`)
          }

          const scopedHerbs = beforeHerbs.filter(r => !targetSet.has(slug(r)))
          const scopedCompounds = generatedCompounds.map(r => beforeCompoundMap.get(slug(r)) ?? r)
          fs.writeFileSync('public/data/herbs.json', JSON.stringify(scopedHerbs, null, 2) + '\n')
          fs.writeFileSync('public/data/compounds.json', JSON.stringify(scopedCompounds, null, 2) + '\n')

          const changedCommonHerbs = scopedHerbs.filter(r => JSON.stringify(r) !== JSON.stringify(beforeHerbMap.get(slug(r))))
          const changedCommonCompounds = scopedCompounds.filter(r => beforeCompoundMap.has(slug(r)) && JSON.stringify(r) !== JSON.stringify(beforeCompoundMap.get(slug(r))))
          if (changedCommonHerbs.length || changedCommonCompounds.length) {
            throw new Error(`Scoped sync altered common records: herbs=${changedCommonHerbs.length} compounds=${changedCommonCompounds.length}`)
          }
          console.log(`Scoped runtime roots: herbs ${beforeHerbs.length} -> ${scopedHerbs.length}; compounds ${beforeCompounds.length} -> ${scopedCompounds.length}`)
          console.log(`Generator-derived compound records added: ${targets.join(', ')}`)
          NODE
      - name: Prove workbook/runtime source-of-truth contract
        run: npm run -s guard:source-of-truth
      - name: Run focused regression suite
        run: npx vitest run tests/runtime-enrichment.test.ts scripts/tests/workbook-reader-parity.test.mjs src/lib/__tests__/retyped-compound-canonicals.test.ts app/__tests__/redirect-override-chain-flattening.test.ts
      - name: Publish scoped roots and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-retyped-runtime-roots.yml
          git rm -f docs/enrichment/runtime-root-measurement-4185.json
          git add public/data/herbs.json public/data/compounds.json
          echo 'Final staged files:'
          git diff --cached --name-only
          git commit -m 'data: synchronize five retyped runtime records'
          git push
