# Validates workbook patch records and applied values against the canonical workbook.
name: Workbook Patch Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data-sources/workbook-patches/**'
      - 'data-sources/entity-row-proposals/**'
      - 'data-sources/runtime-enrichment/**'
      - 'data-sources/herb_monograph_master.xlsx'
      - 'scripts/data/apply-workbook-patch.mjs'
      - 'scripts/data/edit-entity-master-cell.mjs'
      - 'scripts/data/workbook-parser.mjs'
      - 'scripts/ci/validate-workbook-patches.mjs'
      - 'scripts/ci/validate-workbook-schema.mjs'
      - 'scripts/ci/validate-workbook-append-row.mjs'
      - 'scripts/ci/prepare-entity-row-review.mjs'
      - 'scripts/utils/read-workbook-exceljs.mjs'
      - 'tests/runtime-enrichment.test.ts'
      - '.github/workflows/workbook-patch-check.yml'
  workflow_dispatch:

concurrency:
  group: workbook-patch-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate workbook patches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect proposal-runtime scope
        id: proposal_scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            data-sources/entity-row-proposals \
            data-sources/herb_monograph_master.xlsx \
            public/data/compounds.json \
            scripts/ci/prepare-entity-row-review.mjs \
            scripts/ci/sync-proposed-compound-runtime.mjs \
            scripts/data/build-runtime-from-workbook.mjs \
            scripts/data/edit-entity-master-cell.mjs \
            | grep -q .; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --silent

      - name: Verify Node engine
        run: npm run check:node --silent

      - name: Validate workbook schema
        run: npm run validate:workbook-schema --silent

      - name: Validate surgical Entity_Master append path
        run: node scripts/ci/validate-workbook-append-row.mjs

      - name: Prepare fail-closed entity review workbook
        run: node scripts/ci/prepare-entity-row-review.mjs

      - name: Upload fail-closed entity review workbook
        uses: actions/upload-artifact@v7
        with:
          name: entity-row-review-workbook
          path: |
            reports/entity-row-review/herb_monograph_master.review.xlsx
            reports/entity-row-review/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload exact proposed compound runtime preview
        uses: actions/upload-artifact@v7
        with:
          name: proposed-compound-runtime-preview
          path: reports/entity-row-review/compounds.preview.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Materialize reviewed proposal artifacts on trusted manual branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'manual/')
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          remote_head="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | awk '{print $1}')"
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo "Branch advanced from $EXPECTED_HEAD to $remote_head; leaving materialization to the newer run."
            exit 0
          fi

          cp reports/entity-row-review/herb_monograph_master.review.xlsx data-sources/herb_monograph_master.xlsx
          cp reports/entity-row-review/compounds.preview.json public/data/compounds.json

          if git diff --quiet -- data-sources/herb_monograph_master.xlsx public/data/compounds.json; then
            echo "Reviewed workbook/runtime already materialized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-sources/herb_monograph_master.xlsx public/data/compounds.json
          git commit -m "data(runtime): materialize reviewed proposal artifacts"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Validate manifest-backed runtime enrichment
        env:
          HERB_XLSX_PATH: reports/entity-row-review/herb_monograph_master.review.xlsx
          ALLOW_EXTERNAL_WORKBOOK_PATH: 'true'
        run: npx vitest run tests/runtime-enrichment.test.ts

      - name: Validate proposed compound runtime parity
        if: github.event_name == 'workflow_dispatch' || steps.proposal_scope.outputs.required == 'true'
        run: node scripts/ci/sync-proposed-compound-runtime.mjs

      - name: Guard workbook source of truth
        run: npm run guard:source-of-truth --silent

      - name: Validate patch proposals against current workbook
        id: patch_check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/ci/validate-workbook-patches.mjs > workbook-patch-report.txt 2>&1
          status=$?
          cat workbook-patch-report.txt
          exit "$status"

      - name: Upload workbook patch report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbook-patch-report
          path: workbook-patch-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload workbook for approved application
        if: steps.patch_check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: workbook-source-for-application
          path: data-sources/herb_monograph_master.xlsx
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce workbook patch result
        if: steps.patch_check.outcome != 'success'
        run: exit 1
