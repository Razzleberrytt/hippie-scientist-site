# Validates workbook patch records and applied values against the canonical workbook.
name: Workbook Patch Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data-sources/workbook-patches/**'
      - 'data-sources/entity-row-proposals/**'
      - 'data-sources/runtime-enrichment/**'
      - 'data-sources/herb_monograph_master.xlsx'
      - 'scripts/data/apply-workbook-patch.mjs'
      - 'scripts/data/edit-entity-master-cell.mjs'
      - 'scripts/data/workbook-parser.mjs'
      - 'scripts/ci/validate-workbook-patches.mjs'
      - 'scripts/ci/validate-workbook-schema.mjs'
      - 'scripts/ci/validate-workbook-append-row.mjs'
      - 'scripts/ci/prepare-entity-row-review.mjs'
      - 'scripts/utils/read-workbook-exceljs.mjs'
      - 'tests/runtime-enrichment.test.ts'
      - '.github/workflows/workbook-patch-check.yml'
  workflow_dispatch:

concurrency:
  group: workbook-patch-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate workbook patches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --silent

      - name: Verify Node engine
        run: npm run check:node --silent

      - name: Validate workbook schema
        run: npm run validate:workbook-schema --silent

      - name: Validate manifest-backed runtime enrichment
        run: npx vitest run tests/runtime-enrichment.test.ts

      - name: Validate surgical Entity_Master append path
        run: node scripts/ci/validate-workbook-append-row.mjs

      - name: Prepare fail-closed entity review workbook
        run: node scripts/ci/prepare-entity-row-review.mjs

      - name: Upload fail-closed entity review workbook
        uses: actions/upload-artifact@v7
        with:
          name: entity-row-review-workbook
          path: |
            reports/entity-row-review/herb_monograph_master.review.xlsx
            reports/entity-row-review/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Regenerate canonical runtime output for this PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'manual/sertraline-fluoxetine-canonical-2026-09-24' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          rm -rf /tmp/generated-runtime
          node scripts/data/build-runtime-from-workbook.mjs --out /tmp/generated-runtime

          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const currentPath = 'public/data/compounds.json'
          const generatedPath = '/tmp/generated-runtime/compounds.json'
          const targets = ['fluoxetine', 'sertraline']

          const current = JSON.parse(fs.readFileSync(currentPath, 'utf8'))
          const generated = JSON.parse(fs.readFileSync(generatedPath, 'utf8'))
          const freshBySlug = new Map(generated.map((record) => [record.slug, record]))
          const generatedOrder = new Map(generated.map((record, index) => [record.slug, index]))
          const output = [...current]

          for (const target of targets) {
            const record = freshBySlug.get(target)
            if (!record) throw new Error(`Generated runtime is missing ${target}`)
            if (output.some((item) => item.slug === target)) continue

            const targetOrder = generatedOrder.get(target)
            const insertAt = output.findIndex((item) => {
              const itemOrder = generatedOrder.get(item.slug)
              return Number.isFinite(itemOrder) && itemOrder > targetOrder
            })

            if (insertAt === -1) output.push(record)
            else output.splice(insertAt, 0, record)
          }

          fs.writeFileSync(currentPath, `${JSON.stringify(output, null, 2)}\n`)
          NODE

          npm run guard:source-of-truth

          changed_count="$(git diff --name-only -- public/data | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "Surgical generated-data changed files: ${changed_count}"
          git diff --stat -- public/data/compounds.json

          if [ "${changed_count}" -eq 0 ]; then
            echo "Canonical medication records are already present in committed runtime."
            exit 0
          fi

          if [ "${changed_count}" -ne 1 ] || ! git diff --name-only -- public/data | grep -qx 'public/data/compounds.json'; then
            echo "::error::Refusing to auto-commit anything except the surgical compounds.json sync."
            git diff --name-only -- public/data
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/compounds.json
          git commit -m "data: sync sertraline and fluoxetine runtime records"
          git push origin "HEAD:${HEAD_REF}"
          echo "Surgical runtime sync committed; fresh PR checks will validate the new head."
          exit 0

      - name: Validate patch proposals against current workbook
        id: patch_check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/ci/validate-workbook-patches.mjs > workbook-patch-report.txt 2>&1
          status=$?
          cat workbook-patch-report.txt
          exit "$status"

      - name: Upload workbook patch report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbook-patch-report
          path: workbook-patch-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload workbook for approved application
        if: steps.patch_check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: workbook-source-for-application
          path: data-sources/herb_monograph_master.xlsx
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce workbook patch result
        if: steps.patch_check.outcome != 'success'
        run: exit 1
