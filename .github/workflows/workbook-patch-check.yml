# Validates workbook patch records and applied values against the canonical workbook.
name: Workbook Patch Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data-sources/workbook-patches/**'
      - 'data-sources/entity-row-proposals/**'
      - 'data-sources/runtime-enrichment/**'
      - 'data-sources/herb_monograph_master.xlsx'
      - 'scripts/data/apply-workbook-patch.mjs'
      - 'scripts/data/edit-entity-master-cell.mjs'
      - 'scripts/data/workbook-parser.mjs'
      - 'scripts/ci/validate-workbook-patches.mjs'
      - 'scripts/ci/validate-workbook-schema.mjs'
      - 'scripts/ci/validate-workbook-append-row.mjs'
      - 'scripts/ci/prepare-entity-row-review.mjs'
      - 'scripts/utils/read-workbook-exceljs.mjs'
      - 'tests/runtime-enrichment.test.ts'
      - '.github/workflows/workbook-patch-check.yml'
  workflow_dispatch:

concurrency:
  group: workbook-patch-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate workbook patches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --silent

      - name: Verify Node engine
        run: npm run check:node --silent

      - name: Validate workbook schema
        run: npm run validate:workbook-schema --silent

      - name: Validate surgical Entity_Master append path
        run: node scripts/ci/validate-workbook-append-row.mjs

      # TEMPORARY PR-branch bootstrap: materialize source-backed safety cells
      # into the binary workbook, regenerate proposal runtime, and push only
      # those generator-owned artifacts. Removed before final validation.
      - name: Materialize reviewed antidepressant safety
        env:
          ESCITALOPRAM_SAFETY: >-
            U.S. prescribing information carries a boxed warning about suicidal thoughts and behaviors in pediatric and young adult patients and includes serious warnings for serotonin syndrome, discontinuation symptoms, abnormal bleeding, hyponatremia, seizures, and activation of mania or hypomania. This summary is not exhaustive; consult current product-specific prescribing information.
          BUPROPION_SAFETY: >-
            U.S. prescribing information for bupropion XL carries a boxed warning about suicidal thoughts and behaviors in pediatric and young adult patients. Seizure risk is dose-related, and hypertension can occur. This summary is not exhaustive; consult current product-specific prescribing information.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/data/edit-entity-master-cell.mjs --slug escitalopram --column safety_notes --value "$ESCITALOPRAM_SAFETY" --in-place
          node scripts/data/edit-entity-master-cell.mjs --slug bupropion --column safety_notes --value "$BUPROPION_SAFETY" --in-place
          node scripts/ci/sync-proposed-compound-runtime.mjs --write
          git config user.name "ths-data-review-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-sources/herb_monograph_master.xlsx public/data/compounds.json
          if git diff --cached --quiet; then
            echo "Reviewed medication safety already materialized."
          else
            git commit -m "fix(data): materialize reviewed antidepressant safety"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Prepare fail-closed entity review workbook
        run: node scripts/ci/prepare-entity-row-review.mjs

      - name: Validate manifest-backed runtime enrichment
        env:
          HERB_XLSX_PATH: reports/entity-row-review/herb_monograph_master.review.xlsx
          ALLOW_EXTERNAL_WORKBOOK_PATH: 'true'
        run: npx vitest run tests/runtime-enrichment.test.ts

      - name: Upload fail-closed entity review workbook
        uses: actions/upload-artifact@v7
        with:
          name: entity-row-review-workbook
          path: |
            reports/entity-row-review/herb_monograph_master.review.xlsx
            reports/entity-row-review/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Validate proposed compound runtime parity
        run: node scripts/ci/sync-proposed-compound-runtime.mjs

      - name: Guard workbook source of truth
        run: npm run guard:source-of-truth --silent

      - name: Validate patch proposals against current workbook
        id: patch_check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/ci/validate-workbook-patches.mjs > workbook-patch-report.txt 2>&1
          status=$?
          cat workbook-patch-report.txt
          exit "$status"

      - name: Upload workbook patch report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workbook-patch-report
          path: workbook-patch-report.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload workbook for approved application
        if: steps.patch_check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: workbook-source-for-application
          path: data-sources/herb_monograph_master.xlsx
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce workbook patch result
        if: steps.patch_check.outcome != 'success'
        run: exit 1
