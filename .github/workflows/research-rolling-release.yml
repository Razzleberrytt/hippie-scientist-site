name: Research rolling release
on:
  workflow_run:
    workflows:
      - Research rolling gate
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: research-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release-to-merge-train:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["pull_request","workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Promote exact validated research PR from draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/commits/$EXPECTED_HEAD/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')"
          fi
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No open PR found for exact validated head $EXPECTED_HEAD; nothing to release."
            exit 0
          fi
          pr_json="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          actual_head="$(jq -r '.head.sha' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          if [ "$state" != "open" ] || [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "PR #$PR_NUMBER moved or closed after validation; leave fail-closed."
            exit 0
          fi
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if ! grep -Eq '^ops/enrichment-submissions/reconciliation/.+-final-manifest\.json$' <<<"$files"; then
            echo 'Validated PR is research infrastructure, not a frozen 500-record batch; leave its draft state unchanged.'
            exit 0
          fi
          if [ "$draft" != "true" ]; then
            echo "PR #$PR_NUMBER is already ready; autonomous merge controller owns the next step."
            exit 0
          fi
          gh pr ready "$PR_NUMBER" --repo "$REPO"
          echo "PR #$PR_NUMBER released to the existing autonomous merge controller at exact validated head $EXPECTED_HEAD."
