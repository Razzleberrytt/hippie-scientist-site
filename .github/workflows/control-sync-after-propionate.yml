name: Post-Propionate control sync

on:
  push:
    branches:
      - control/sync-after-propionate-5021

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile planning docs to exact post-Propionate state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const mainSha = '4461ac4c59aa48bafca85125f86e4a37e6ee4610'
          const sprintPath = 'docs/CURRENT_SPRINT.md'
          const backlogPath = 'docs/MASTER_BACKLOG.md'

          function replaceExactlyOne(text, regex, replacement, label) {
            const matches = [...text.matchAll(new RegExp(regex.source, regex.flags.includes('g') ? regex.flags : regex.flags + 'g'))]
            if (matches.length !== 1) throw new Error(`${label}: expected exactly one match, got ${matches.length}`)
            return text.replace(regex, replacement)
          }

          let sprint = fs.readFileSync(sprintPath, 'utf8')
          sprint = replaceExactlyOne(
            sprint,
            /^\*\*Current admission:\*\*.*$/m,
            `**Current admission:** Live GitHub reconciliation at \`${mainSha}\` on 2026-09-02 records 0/3 normal implementation workstreams occupied. #4992 / PR #5016 completed the governed Propionate closure, post-merge Session E bootstrap proved 4/4 terminal promoted findings with 0 pending, and PR #5020 released the verified lease. Authority/Content, Revenue/Conversion, and Discovery/SEO are free. #5021 is the first Ready-next Authority/Content candidate; canonical Vitamin B6 mutation still requires a narrow \`compound:vitamin-b6\` governor lease. Research-only enrichment PRs remain non-canonical staging and do not consume normal implementation WIP.`,
            'CURRENT_SPRINT current admission'
          )
          sprint = replaceExactlyOne(
            sprint,
            /^## Active \/ in review — observed implementation WIP \d+\/3$/m,
            '## Active / in review — observed implementation WIP 0/3',
            'CURRENT_SPRINT WIP heading'
          )
          sprint = replaceExactlyOne(
            sprint,
            /^\| Authority\/Content \| #4992 \/ PR #5016 \|[^\n]*\n/m,
            '',
            'CURRENT_SPRINT Propionate active row'
          )
          sprint = replaceExactlyOne(
            sprint,
            /^- \*\*Authority\/Content:\*\* occupied by #4992[^\n]*$/m,
            '- **Authority/Content:** free after #4992 / PR #5016 completed and verified lease-release PR #5020 merged. #5021 is Ready next for governed Vitamin B6 evidence/safety closure; implementation remains blocked until a narrow `compound:vitamin-b6` lease is acquired.',
            'CURRENT_SPRINT Authority bullet'
          )
          sprint = replaceExactlyOne(
            sprint,
            /(\| Order \| Candidate \| Workstream \| Admission state \| Proof required before implementation \|\n\|[^\n]+\|\n)/m,
            `$1| 1 | #5021 | Authority/Content | Ready next — governor lease required | Fresh Session F bootstrap; acquire narrow \`compound:vitamin-b6\` lease, verify/register journal sources, terminally govern all six staged findings, preserve neuropathy dose/duration boundaries and null/low-quality evidence, then prove post-merge Session F closure. |\n`,
            'CURRENT_SPRINT Ready-next table'
          )
          sprint = replaceExactlyOne(
            sprint,
            /(## Recently retired from this sprint\n\n)/m,
            `$1- **#4992 / PR #5016 / PR #5020:** Propionate closure merged as \`523ba9323dd3506e51f2d1aaab53b6d0a2e49aa5\`; post-merge Session E bootstrap proved 4 findings terminal/promoted with 0 pending, and verified state-only lease release merged as \`4461ac4c59aa48bafca85125f86e4a37e6ee4610\`. No generic efficacy, consumer-dose, or business outcome is inferred.\n`,
            'CURRENT_SPRINT retired insertion'
          )
          fs.writeFileSync(sprintPath, sprint)

          let backlog = fs.readFileSync(backlogPath, 'utf8')
          backlog = replaceExactlyOne(
            backlog,
            /^Live GitHub reconciliation at .* shows \*\*\d+\/3 normal implementation workstreams occupied\*\*:/m,
            `Live GitHub reconciliation at \`${mainSha}\` on 2026-09-02 shows **0/3 normal implementation workstreams occupied**:`,
            'MASTER_BACKLOG reconciliation line'
          )
          backlog = replaceExactlyOne(
            backlog,
            /^\| #4992 \/ PR #5016 \| Close staged Propionate evidence before MS follow-up \| A evidence \| Active under governed lease \|\n/m,
            '',
            'MASTER_BACKLOG Propionate active row'
          )
          backlog = replaceExactlyOne(
            backlog,
            /^- \*\*A — #4992 active:\*\*[^\n]*$/m,
            '- **A — free:** #4992 / PR #5016 completed the Propionate closure and PR #5020 released the verified lease. #5021 is Ready next for Vitamin B6 evidence/safety closure but requires a narrow `compound:vitamin-b6` governor lease before canonical mutation.',
            'MASTER_BACKLOG Authority bullet'
          )
          backlog = replaceExactlyOne(
            backlog,
            /(\| ID \| Title \| WS\/Lane \| Status \| Priority \| BI\/UV\/TP\/SL\/C\/E \| Score \| Dependencies \/ freshness \| Acceptance \/ proof boundary \|\n\|[^\n]+\|\n)/m,
            `$1| #5021 | Close staged Vitamin B6 evidence and neuropathy safety calibration | A evidence | Ready for governed implementation | P0 safety/integrity | — | — | Fresh A–H bootstrap run 33575183434; #4658 staging complete; acquire narrow \`compound:vitamin-b6\` governor lease before mutation | Six staged findings 6→0 pending; journal provenance + semantic attestations; no historical-dose consumer directive; generated grade/recommendation/safety state becomes source-consistent; post-merge Session F bootstrap terminal |\n`,
            'MASTER_BACKLOG Next table'
          )
          backlog = replaceExactlyOne(
            backlog,
            /(\| Item \| Verified disposition \|\n\|---\|---\|\n)/m,
            `$1| #4992 / PR #5016 / PR #5020 | Propionate closure merged as \`523ba9323dd3506e51f2d1aaab53b6d0a2e49aa5\`; post-merge Session E bootstrap proved all four staged findings terminal and promoted with 0 pending; verified lease release merged as \`4461ac4c59aa48bafca85125f86e4a37e6ee4610\`. No generic efficacy, consumer-dose, indexing, monetization, traffic, analytics, or business outcome is inferred. |\n`,
            'MASTER_BACKLOG retired insertion'
          )
          fs.writeFileSync(backlogPath, backlog)
          NODE
      - name: Remove temporary workflow and commit only control docs
        run: |
          rm .github/workflows/control-sync-after-propionate.yml
          git config user.name "Razzleberrytt"
          git config user.email "RazzleberryT@gmail.com"
          git add docs/CURRENT_SPRINT.md docs/MASTER_BACKLOG.md .github/workflows/control-sync-after-propionate.yml
          git diff --cached --check
          git commit -m "docs(control): retire Propionate and queue Vitamin B6"
          git push origin HEAD:control/sync-after-propionate-5021
