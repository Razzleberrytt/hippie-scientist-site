name: Site Health Check

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      recovery_pr_number:
        description: PR number for exact-head recovery validation
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Site Health Check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assert exact recovery PR head
        if: github.event_name == 'workflow_dispatch' && inputs.recovery_pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${{ github.repository }}/pulls/$RECOVERY_PR_NUMBER")"
          source_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          if [ "$GITHUB_SHA" != "$source_sha" ]; then
            echo "Recovery dispatch is stale: workflow head=$GITHUB_SHA PR head=$source_sha" >&2
            exit 1
          fi
          if [ "$base_ref" != "main" ]; then
            echo "Recovery dispatch requires base main; observed $base_ref" >&2
            exit 1
          fi

      - name: Classify release impact
        id: impact
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | node scripts/ci/classify-release-impact.mjs --github-output="$GITHUB_OUTPUT"

      - name: Use Node
        if: github.event_name != 'pull_request' || steps.impact.outputs.release_sensitive == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Next.js build cache
        if: github.event_name != 'pull_request' || steps.impact.outputs.release_sensitive == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install deps
        if: github.event_name != 'pull_request' || steps.impact.outputs.release_sensitive == 'true'
        run: npm ci

      - name: Verify Node engine
        if: github.event_name != 'pull_request' || steps.impact.outputs.release_sensitive == 'true'
        run: npm run check:node

      - name: Run full check
        if: github.event_name != 'pull_request' || steps.impact.outputs.release_sensitive == 'true'
        run: npm run check:full

      - name: Delegate non-structural PR validation to standard CI
        if: github.event_name == 'pull_request' && steps.impact.outputs.release_sensitive != 'true'
        run: echo 'No release-sensitive files changed; standard CI remains authoritative for this PR.'

      - name: Generate Botanical Activity Atlas coverage report
        if: always()
        run: node scripts/audit/botanical-atlas-coverage.mjs

      - name: Add atlas coverage summary
        if: always()
        run: cat reports/botanical-atlas/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload atlas coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botanical-atlas-coverage-${{ github.run_id }}
          path: reports/botanical-atlas/
          retention-days: 30
