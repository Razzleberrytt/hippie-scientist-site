name: Project control reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/CURRENT_SPRINT.md'
      - 'docs/MASTER_BACKLOG.md'
      - 'docs/ROADMAP.md'
      - 'scripts/ci/reconcile-project-control*'
      - 'scripts/ci/prioritization-contract.mjs'
      - 'scripts/ci/validate-prioritization-contract.mjs'
      - 'scripts/ci/fixtures/prioritization-contract.json'
      - '.github/workflows/project-control-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/CURRENT_SPRINT.md'
      - 'docs/MASTER_BACKLOG.md'
      - 'docs/ROADMAP.md'
      - 'scripts/ci/reconcile-project-control*'
      - 'scripts/ci/prioritization-contract.mjs'
      - 'scripts/ci/validate-prioritization-contract.mjs'
      - 'scripts/ci/fixtures/prioritization-contract.json'
      - '.github/workflows/project-control-reconciliation.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile:
    name: Reconcile authoritative project control
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check control module syntax
        run: |
          node --check scripts/ci/reconcile-project-control.mjs
          node --check scripts/ci/prioritization-contract.mjs
          node --check scripts/ci/validate-prioritization-contract.mjs
      - name: Validate prioritization contract
        run: node scripts/ci/validate-prioritization-contract.mjs
      - name: Reconcile exact-revision planning records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/ci/reconcile-project-control.mjs --github --revision "$CONTROL_REVISION" | tee project-control-report.json
      - name: Retain reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-control-${{ github.event.pull_request.head.sha || github.sha }}
          path: project-control-report.json
          if-no-files-found: error
          retention-days: 14
