name: EvidenceMotion editorial 2D CPU research
on:
  pull_request:
    paths:
      - 'research/evidencemotion-director/editorial_2d_cpu_research.py'
      - 'research/evidencemotion-director/test_editorial_2d_cpu_research.py'
      - 'research/evidencemotion-director/validated_7oh_chemistry.py'
      - 'research/evidencemotion-director/test_validated_7oh_chemistry.py'
      - '.github/workflows/evidencemotion-editorial-2d-cpu.yml'
permissions:
  contents: read
jobs:
  real-editorial-2d-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install no-GPU lightweight, reproducible tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install 'rdkit==2025.9.4' 'pillow==12.0.0'
      - name: Prove pinned source and local design/safety guardrails
        run: |
          python -m unittest discover -s research/evidencemotion-director -p test_validated_7oh_chemistry.py -v
          python -m unittest discover -s research/evidencemotion-director -p test_editorial_2d_cpu_research.py -v
          python -m py_compile research/evidencemotion-director/editorial_2d_cpu_research.py
      - name: Render actual 3-second editorial 2D short from original source
        shell: bash
        run: |
          set -euo pipefail
          python research/evidencemotion-director/editorial_2d_cpu_research.py --out /tmp/evidencemotion-editorial-2d
      - name: Decode actual 540x960 MP4, check distinct frames and no audio
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,subprocess
          p=Path('/tmp/evidencemotion-editorial-2d')
          video=p/'editorial_2d_source_locked_RESEARCH_ONLY_SILENT.mp4'
          receipt=json.loads((p/'editorial_2d_RESEARCH_ONLY_receipt.json').read_text())
          assert receipt['mayPublish'] is False and receipt['voice']=='NONE_SILENT_TEST_ONLY'
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',str(video)]))['streams']
          assert len(probe)==1 and probe[0]['codec_type']=='video'
          assert (probe[0]['width'],probe[0]['height'])==(540,960)
          count=int(subprocess.check_output(['ffprobe','-v','error','-count_frames','-select_streams','v:0','-show_entries','stream=nb_read_frames','-of','default=nk=1:nw=1',str(video)]))
          assert count==48,(count,'TRUNCATED_ENCODE')
          a=Image.open(p/'frame_0000.png').convert('RGB').crop((50,430,430,765))
          b=Image.open(p/'frame_0024.png').convert('RGB').crop((50,430,430,765))
          delta=ImageChops.difference(a,b)
          moved=sum(1 for px in delta.getdata() if max(px)>22)
          print('Actual source chemical diagram revealed pixels:',moved)
          assert moved>2000,'STATIC_POSTER_WITH_NO_ACTUAL_SUBJECT_TRANSITION'
          PY
      - name: Save actual movie, three representative frames and receipt for craft review
        uses: actions/upload-artifact@v4
        with:
          name: evidencemotion-source-locked-editorial-2d-research
          path: |
            /tmp/evidencemotion-editorial-2d/*.mp4
            /tmp/evidencemotion-editorial-2d/*receipt.json
            /tmp/evidencemotion-editorial-2d/frame_0000.png
            /tmp/evidencemotion-editorial-2d/frame_0024.png
            /tmp/evidencemotion-editorial-2d/frame_0047.png
          if-no-files-found: error
          retention-days: 5
      - name: State verification boundary
        if: always()
        run: |
          echo 'Actual 2D short is SILENT RESEARCH. Green technical job is NOT an artistic, voice, science, owner-phone, or native-full-HD review.' >> "$GITHUB_STEP_SUMMARY"
          echo '2D and Blender proofs run on different machines/resolutions/fps; no head-to-head speed or cost conclusion from raw wall time.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Owner choice: simplest repeatable premium finished video; no new production dependencies/credits/permission to publish or checklist credit.' >> "$GITHUB_STEP_SUMMARY"
