name: repair-enrichment-wave

on:
  push:
    branches:
      - research/integrate-enrichment-wave-2026-09-05

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize enrichment into canonical artifacts
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { execFileSync } = require('child_process')

          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'))
          const writeJson = (p, value) => fs.writeFileSync(p, JSON.stringify(value, null, 2) + '\n')
          const claim = (c, sourceIds) => ({
            claim: c.claim,
            evidenceClass: c.evidenceClass || 'human-clinical',
            sourceRefIds: Array.from(new Set(c.sourceRefIds || sourceIds || [])),
            ...(c.uncertaintyNote ? { uncertaintyNote: c.uncertaintyNote } : {}),
            ...(c.strengthNote ? { strengthNote: c.strengthNote } : {}),
          })

          const enrichmentPath = 'public/data/enrichment-governed.json'
          const enrichmentOverlayPath = 'public/data/enrichment-governed-overlay-2026-09-05.json'
          const sourcePath = 'public/data/source-registry.json'
          const sourceOverlayPath = 'public/data/source-registry-enrichment-overlay-2026-09-05.json'

          const canonicalEnrichment = readJson(enrichmentPath)
          const overlay = readJson(enrichmentOverlayPath)
          const bySlug = new Map(canonicalEnrichment.map(row => [`${row.entityType}:${row.entitySlug}`, row]))

          for (const row of overlay) {
            const e = row.researchEnrichment
            const sourceIds = e.sourceRegistryIds || []
            const positiveTopics = new Set(['blood_pressure','cardiometabolic_biomarkers','vascular_function','periodontal','sleep'])
            const negativeTopics = new Set(['mortality'])
            const topicJudgments = e.topicEvidenceJudgments || {}

            const supported = [...(e.supportedUses || [])]
            const unsupported = [...(e.unsupportedOrUnclearUses || [])]
            for (const [topic, judgment] of Object.entries(topicJudgments)) {
              const text = judgment.toneGuidance
                ? `${topic.replace(/_/g, ' ')}: ${judgment.toneGuidance}`
                : `${topic.replace(/_/g, ' ')} evidence remains context-specific.`
              const c = claim({
                claim: text,
                evidenceClass: 'human-clinical',
                sourceRefIds: sourceIds,
                uncertaintyNote: (judgment.uncertaintyNotes || []).join(' '),
              }, sourceIds)
              if (negativeTopics.has(topic)) unsupported.push(c)
              else if (positiveTopics.has(topic)) supported.push(c)
              else unsupported.push(c)
            }

            e.supportedUses = supported.map(c => claim(c, sourceIds))
            e.unsupportedOrUnclearUses = unsupported.map(c => claim(c, sourceIds))
            e.conflictNotes = (e.conflictNotes || []).map(c => typeof c === 'string'
              ? claim({ claim: c, sourceRefIds: sourceIds, strengthNote: 'limited' }, sourceIds)
              : claim(c, sourceIds))
            e.topicEvidenceJudgments = {}
            e.mechanisms = (e.mechanisms || []).map(m => ({
              ...m,
              ...(m.targetType === 'brain_function' ? { targetType: 'biological_process' } : {}),
            }))
            e.sourceRefs = sourceIds.map(sourceId => ({ sourceId, extractConfidence: 'high', reviewer: e.reviewedBy || 'enrichment-governor' }))

            const normalized = { ...row, researchEnrichment: e }
            bySlug.set(`${row.entityType}:${row.entitySlug}`, normalized)
          }

          writeJson(enrichmentPath, [...bySlug.values()])

          const canonicalSources = readJson(sourcePath)
          const sourceOverlay = readJson(sourceOverlayPath)
          const sourceById = new Map(canonicalSources.map(s => [s.sourceId, s]))
          for (const s of sourceOverlay) {
            const pmid = String(s.sourceId || '').match(/pubmed-(\d+)/)?.[1] || ''
            sourceById.set(s.sourceId, {
              sourceId: s.sourceId,
              title: s.title,
              shortTitle: s.title,
              sourceType: s.sourceType || 'systematic-review',
              sourceClass: 'systematic-review-meta-analysis',
              authors: Array.isArray(s.authors) ? s.authors : [],
              publicationYear: s.publicationYear,
              citationText: `${s.title}. PubMed ${pmid}.`,
              ...(pmid ? { pmid } : {}),
              canonicalUrl: s.canonicalUrl,
              language: 'en',
              evidenceClass: s.evidenceClass || 'human-clinical',
              studyDesign: 'systematic-review',
              publicationStatus: 'published',
              reliabilityTier: 'tier-a',
              reviewer: 'enrichment-governor',
              reviewedAt: '2026-09-05T00:00:00.000Z',
              notes: 'Canonicalized from the governed enrichment promotion wave after schema and provenance review.',
              active: true,
            })
          }
          writeJson(sourcePath, [...sourceById.values()])

          // Restore the governed loader to the canonical pipeline; the enrichment is now in its inputs.
          execFileSync('git', ['checkout', '394ae5933cdd1ba52515aea9fd84694bf7be28cf', '--', 'lib/governedResearch.ts'])
          fs.unlinkSync(enrichmentOverlayPath)
          fs.unlinkSync(sourceOverlayPath)
          fs.unlinkSync('.github/workflows/repair-enrichment-wave.yml')
          NODE

      - name: Validate JSON artifacts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/data/enrichment-governed.json','utf8')); JSON.parse(require('fs').readFileSync('public/data/source-registry.json','utf8'))"

      - name: Commit canonical repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/enrichment-governed.json public/data/source-registry.json lib/governedResearch.ts .github/workflows/repair-enrichment-wave.yml
          git commit -m 'fix: canonicalize enrichment wave and provenance'
          git push
