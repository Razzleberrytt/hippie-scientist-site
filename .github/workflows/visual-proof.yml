name: P0 Visual Proof

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'config/**'
      - 'public/**'
      - 'styles/**'
      - 'types/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'next.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'scripts/dev/visual-sweep.mjs'
      - 'scripts/ci/validate-direct-dependencies.mjs'
      - '.github/workflows/visual-proof.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'config/**'
      - 'public/**'
      - 'styles/**'
      - 'types/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'next.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'scripts/dev/visual-sweep.mjs'
      - 'scripts/ci/validate-direct-dependencies.mjs'
      - '.github/workflows/visual-proof.yml'
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: CI run containing the governed static export artifact
        required: false
        type: string
      producer_sha:
        description: Exact head SHA bound into the governed static export receipt
        required: false
        type: string
      producer_base_sha:
        description: Exact base SHA bound into the governed static export receipt
        required: false
        type: string
      producer_pr_number:
        description: PR number that produced the governed static export
        required: false
        type: string

concurrency:
  group: visual-proof-${{ github.event.pull_request.number || inputs.producer_pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  visual-proof:
    name: Representative mobile/theme sweep
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'))) && (inputs.producer_sha == '' || github.sha == inputs.producer_sha)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Reject stale producer dispatch
        if: inputs.producer_sha != ''
        env:
          PRODUCER_SHA: ${{ inputs.producer_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$PRODUCER_SHA" ]; then
            echo "Producer dispatch is stale: workflow head=$GITHUB_SHA producer=$PRODUCER_SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ inputs.producer_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Next.js build cache for self-built fallback
        if: inputs.producer_run_id == ''
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'lib/**/*', 'components/**/*', 'public/**/*', 'styles/**/*', 'config/**/*', 'scripts/**/*', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install repository dependencies
        run: npm ci --no-audit --fund=false

      - name: Install transient Playwright runtime
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          RUNTIME_DIR="$RUNNER_TEMP/visual-proof-playwright"
          mkdir -p "$RUNTIME_DIR"
          cd "$RUNTIME_DIR"
          npm init -y
          npm install --no-audit --fund=false playwright@1.63.0
          ln -s "$RUNTIME_DIR/node_modules/playwright" "$GITHUB_WORKSPACE/node_modules/playwright"
          ln -s "$RUNTIME_DIR/node_modules/playwright-core" "$GITHUB_WORKSPACE/node_modules/playwright-core"
          echo "PLAYWRIGHT_RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"

      - name: Install hosted Chromium
        run: |
          "$PLAYWRIGHT_RUNTIME_DIR/node_modules/.bin/playwright" install --with-deps chromium

      - name: Download governed static export
        id: governed-download
        if: inputs.producer_run_id != '' && inputs.producer_sha != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: governed-static-export-${{ inputs.producer_sha }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Verify governed static export receipt
        id: governed-verify
        if: steps.governed-download.outcome == 'success'
        continue-on-error: true
        run: >-
          node scripts/ci/governed-static-export.mjs verify
          --source-sha "${{ inputs.producer_sha }}"
          --base-sha "${{ inputs.producer_base_sha }}"

      - name: Build static export fallback
        if: steps.governed-verify.outcome != 'success'
        env:
          COMMIT_HASH: ${{ inputs.producer_sha || github.sha }}
        run: |
          rm -rf out .governed-static-export.json
          npm run build:deploy

      - name: Run representative visual proof
        run: |
          npx serve@14 out -p 3000 > /tmp/visual-proof-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done'
          node scripts/dev/visual-sweep.mjs hosted

      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-visual-proof-${{ inputs.producer_sha || github.sha }}
          path: .visual-sweep/hosted/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Summarize proof
        if: always()
        run: |
          echo "## P0 mobile/theme visual proof" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: `${{ inputs.producer_sha || github.sha }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governed CI export verified: ${{ steps.governed-verify.outcome == 'success' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact miss/mismatch fallback build: ${{ steps.governed-verify.outcome != 'success' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .visual-sweep/hosted/report.json ]; then
            node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs'
          const rows = JSON.parse(fs.readFileSync('.visual-sweep/hosted/report.json', 'utf8'))
          const failed = rows.filter((row) => row.status)
          const overflow = rows.filter((row) => row.overflow > 0)
          const themeMismatch = rows.filter((row) => !row.status && row.appliedTheme !== row.theme)
          const screenshots = rows.filter((row) => row.screenshot)
          console.log(`- Matrix states: ${rows.length}`)
          console.log(`- Screenshots retained: ${screenshots.length}`)
          console.log(`- Failed loads: ${failed.length}`)
          console.log(`- Horizontal overflow states: ${overflow.length}`)
          console.log(`- Theme mismatches: ${themeMismatch.length}`)
          NODE
          else
            echo "- report.json was not produced; inspect the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
