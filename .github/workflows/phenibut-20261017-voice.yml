name: THS Phenibut Original Kokoro Research
on:
  push:
    branches:
      - research/phenibut-20261017-video
    paths:
      - research/evidencemotion-director/phenibut-20261017/render_original_narrator.py
      - .github/workflows/phenibut-20261017-voice.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'kokoro-onnx==0.6.1' 'numpy<3'
      - name: Download original voice model from our own pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voice-assets
          gh release download ths-kokoro-onnx-am-michael-int8-v1 --repo Razzleberrytt/hippie-scientist-site --dir voice-assets -p 'kokoro-v1.0.int8.onnx' -p 'voices-v1.0.bin'
          echo 'ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c  voice-assets/kokoro-v1.0.int8.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voice-assets/voices-v1.0.bin' | sha256sum -c -
      - run: python research/evidencemotion-director/phenibut-20261017/render_original_narrator.py
      - uses: actions/upload-artifact@v4
        with:
          name: phenibut-original-kokoro-unreviewed-speech
          path: phenibut-original-voice/
          if-no-files-found: error
          retention-days: 7
