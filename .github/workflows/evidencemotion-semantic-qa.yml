name: EvidenceMotion semantic negative visual QA (research)
on:
  pull_request:
    paths:
      - 'research/evidencemotion-director/semantic_negative_visual_audit.py'
      - 'research/evidencemotion-director/test_semantic_negative_visual_audit.py'
      - '.github/workflows/evidencemotion-semantic-qa.yml'
  push:
    branches: [main]
    paths:
      - 'research/evidencemotion-director/semantic_negative_visual_audit.py'
      - 'research/evidencemotion-director/test_semantic_negative_visual_audit.py'
      - '.github/workflows/evidencemotion-semantic-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject-known-visual-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight synthetic-frame test dependencies
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Syntax and ten adversarial semantic cases
        run: |
          python -m py_compile research/evidencemotion-director/semantic_negative_visual_audit.py
          python -m py_compile research/evidencemotion-director/test_semantic_negative_visual_audit.py
          python -m unittest discover -s research/evidencemotion-director -p 'test_semantic_negative_visual_audit.py' -v
      - name: Read-only research scope reminder
        run: |
          echo 'Tests reject known visual failures but do not inspect unpublished video files in CI.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual film replay requires the source-bound external media bundle, RDKit, VTK and FFmpeg.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No qualified science review, craft signoff, owner phone playback, or publication authorization is granted.' >> "$GITHUB_STEP_SUMMARY"
