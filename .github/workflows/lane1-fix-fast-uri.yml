name: Lane 1 fast-uri security remediation

on:
  push:
    branches:
      - lane1/fix-fast-uri-security

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: lane1/fix-fast-uri-security
          fetch-depth: 0

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate dependency metadata canonically
        run: |
          set -euo pipefail
          npm pkg set overrides.fast-uri=3.1.6
          npm install --package-lock-only --ignore-scripts --fund=false --audit=false
          node -e "const p=require('./package-lock.json'); const e=p.packages['node_modules/fast-uri']; if (!e || e.version !== '3.1.6') throw new Error('fast-uri did not resolve to 3.1.6')"
          npm audit --audit-level=high

      - name: Remove one-shot workflow and commit remediation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane1-fix-fast-uri.yml
          git add package.json package-lock.json
          git commit -m "fix(security): upgrade fast-uri beyond vulnerable range"
          git push origin HEAD:lane1/fix-fast-uri-security
