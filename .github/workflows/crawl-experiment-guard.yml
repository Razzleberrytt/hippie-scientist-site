name: Crawl experiment guard

on:
  pull_request:
    paths:
      - 'experiments/crawl-request-indexing/**'
      - 'data-sources/herb_monograph_master.xlsx'
      - 'public/data/herbs.json'
      - 'public/data/herbs-summary.json'
      - 'public/data/summary-indexes/herbs-summary.json'
      - 'public/data/herbs-detail/**'
      - 'public/_redirects'
      - 'src/lib/index-allowlist.ts'
      - 'src/lib/seo.ts'
      - 'lib/sitemap-route-visibility.ts'
      - 'app/herbs/**'
      - 'app/sitemap.ts'
      - 'functions/herbs/_middleware.ts'
      - 'functions/_shared/googlebot-verification.ts'
      - 'scripts/ci/validate-crawl-experiment.mjs'
      - 'scripts/seo/build-crawl-experiment-manifest.mjs'
      - 'scripts/seo/crawl-experiment-build-snapshot.mjs'
      - 'scripts/seo/record-crawl-experiment-treatment.mjs'
      - 'scripts/seo/record-crawl-experiment-contamination.mjs'
      - 'scripts/seo/complete-crawl-experiment.mjs'
      - '.github/workflows/crawl-experiment-guard.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/crawl-request-indexing/**'
      - 'data-sources/herb_monograph_master.xlsx'
      - 'public/data/herbs.json'
      - 'public/data/herbs-summary.json'
      - 'public/data/summary-indexes/herbs-summary.json'
      - 'public/data/herbs-detail/**'
      - 'public/_redirects'
      - 'src/lib/index-allowlist.ts'
      - 'src/lib/seo.ts'
      - 'lib/sitemap-route-visibility.ts'
      - 'app/herbs/**'
      - 'app/sitemap.ts'
      - 'functions/herbs/_middleware.ts'
      - 'functions/_shared/googlebot-verification.ts'
      - 'scripts/ci/validate-crawl-experiment.mjs'
      - 'scripts/seo/build-crawl-experiment-manifest.mjs'
      - 'scripts/seo/crawl-experiment-build-snapshot.mjs'
      - 'scripts/seo/record-crawl-experiment-treatment.mjs'
      - 'scripts/seo/record-crawl-experiment-contamination.mjs'
      - 'scripts/seo/complete-crawl-experiment.mjs'
      - '.github/workflows/crawl-experiment-guard.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Syntax-check experiment scripts
        run: |
          node --check scripts/seo/build-crawl-experiment-manifest.mjs
          node --check scripts/seo/crawl-experiment-build-snapshot.mjs
          node --check scripts/seo/record-crawl-experiment-treatment.mjs
          node --check scripts/seo/record-crawl-experiment-contamination.mjs
          node --check scripts/seo/complete-crawl-experiment.mjs
          node --check scripts/ci/validate-crawl-experiment.mjs

      - name: Validate experiment structure and lifecycle
        run: node scripts/ci/validate-crawl-experiment.mjs --structural-only

      - name: Detect whether rendered freeze verification is required
        id: experiment
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const manifest = require('./experiments/crawl-request-indexing/manifest.json')
          const freezeEnd = Date.parse(manifest.freeze?.ends_at ?? '')
          const freezeExpired = manifest.status === 'active' && Number.isFinite(freezeEnd) && Date.now() >= freezeEnd
          const requiresBuild = ['prepared', 'activating', 'active'].includes(manifest.status) && !freezeExpired
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `requires_build=${String(requiresBuild)}\n`)
          NODE

      - name: Install dependencies for rendered-output verification
        if: steps.experiment.outputs.requires_build == 'true'
        run: npm ci

      - name: Build static export for rendered-output verification
        if: steps.experiment.outputs.requires_build == 'true'
        env:
          COMMIT_HASH: ${{ github.sha }}
        run: npm run build:deploy

      - name: Validate randomized-page content, canonical, indexability, and sitemap lastmod freeze
        if: steps.experiment.outputs.requires_build == 'true'
        run: node scripts/ci/validate-crawl-experiment.mjs --build-dir=out
