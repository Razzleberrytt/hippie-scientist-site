name: Metricool Connector Publication (Frozen)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject legacy Metricool connector publication
        run: |
          echo "Metricool connector publication is frozen. Use THS Publisher; provider IDs are receipts only." >&2
          exit 1
