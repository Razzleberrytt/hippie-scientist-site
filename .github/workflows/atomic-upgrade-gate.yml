name: Atomic upgrade gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      recovery_pr_number:
        description: PR number for exact-head recovery validation
        required: true
        type: string
      recovery_base_ref:
        description: Exact target base branch name
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  atomic-contract:
    # Retain the historical required-check name for branch protection compatibility;
    # the former mandatory issue-link/PR-template/metrics fields are no longer gates.
    name: Atomic issue and measurement contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR identity without imposing description fields
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
        run: |
          pr_number="${EVENT_PR_NUMBER:-$RECOVERY_PR_NUMBER}"
          [[ "$pr_number" =~ ^[0-9]+$ ]]
          resolved_number="$(gh api "repos/${{ github.repository }}/pulls/$pr_number" --jq '.number')"
          test "$resolved_number" = "$pr_number"
          echo 'Pull request identity verified. Issue links, headings, metrics and summaries are optional.'

  generator-release-quality:
    name: Full release suite for generator changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify release impact
        id: impact
        env:
          BASE_REF: ${{ github.base_ref || inputs.recovery_base_ref }}
        run: |
          test -n "$BASE_REF"
          git fetch origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | node scripts/ci/classify-release-impact.mjs --github-output="$GITHUB_OUTPUT"

      - name: Delegate release-quality suite to authoritative CI
        if: steps.impact.outputs.release_sensitive == 'true' && steps.impact.outputs.leaf_page_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: echo 'Release-sensitive generator change; authoritative CI runs lint, typecheck, tests, the governed production build/output suite, and all supplemental release-quality validators on this exact head.'

      - name: Validation-only fast path
        if: steps.impact.outputs.validation_only == 'true'
        run: echo 'Build-output-neutral control/security change; standard CI focused control validation and fail-closed security audit remain authoritative.'

      - name: Leaf page fast path
        if: steps.impact.outputs.leaf_page_only == 'true' && steps.impact.outputs.validation_only != 'true'
        run: echo 'Leaf-page-only change; skip duplicate full release suite. Standard CI still runs lint, typecheck, tests, production build/output/SEO, and scoped page governance.'

      - name: No release-sensitive change
        if: steps.impact.outputs.release_sensitive != 'true' && steps.impact.outputs.validation_only != 'true'
        run: echo 'No release-sensitive/structural files changed; standard CI remains authoritative.'
