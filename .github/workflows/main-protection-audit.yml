name: Main Protection Audit

on:
  pull_request:
    paths:
      - 'scripts/ci/main-protection-audit.mjs'
      - 'scripts/ci/main-protection-audit.test.mjs'
      - '.github/workflows/main-protection-audit.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: main-protection-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Main protection audit contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run protection audit regressions
        run: npx vitest run scripts/ci/main-protection-audit.test.mjs

  live-main-protection:
    name: Live main protection
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Fail closed when main is unprotected
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/main-protection-audit.mjs
