name: Technical SEO Monitor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/_redirects'
      - 'public/redirect-overrides/**'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'scripts/ci/audit-technical-seo-contract.mjs'
      - 'scripts/monitor/production-seo-health*.mjs'
      - '.github/workflows/technical-seo-monitor.yml'
  push:
    branches: [main]
    paths:
      - 'public/_redirects'
      - 'public/redirect-overrides/**'
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'lib/seo.ts'
      - 'lib/site.ts'
      - 'scripts/ci/audit-technical-seo-contract.mjs'
      - 'scripts/monitor/production-seo-health*.mjs'
      - '.github/workflows/technical-seo-monitor.yml'
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: CI run containing the governed static export artifact
        required: false
        type: string
      producer_sha:
        description: Exact PR head SHA bound into the governed static export receipt
        required: false
        type: string
      producer_base_sha:
        description: Exact PR base SHA bound into the governed static export receipt
        required: false
        type: string
      producer_pr_number:
        description: PR number that produced the governed static export
        required: false
        type: string

concurrency:
  group: technical-seo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  static-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject stale producer dispatch
        if: inputs.producer_sha != ''
        env:
          PRODUCER_SHA: ${{ inputs.producer_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$PRODUCER_SHA" ]; then
            echo "Producer dispatch is stale: workflow head=$GITHUB_SHA producer=$PRODUCER_SHA"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.producer_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Download governed static export
        id: governed-download
        if: inputs.producer_run_id != '' && inputs.producer_sha != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: governed-static-export-${{ inputs.producer_sha }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run_id }}

      - name: Verify governed static export receipt
        id: governed-verify
        if: steps.governed-download.outcome == 'success'
        continue-on-error: true
        run: >-
          node scripts/ci/governed-static-export.mjs verify
          --source-sha "${{ inputs.producer_sha }}"
          --base-sha "${{ inputs.producer_base_sha }}"

      - name: Build static export fallback
        if: steps.governed-verify.outcome != 'success'
        env:
          COMMIT_HASH: ${{ inputs.producer_sha || github.sha }}
        run: |
          rm -rf out .governed-static-export.json
          npm run build:deploy

      - name: Use deployment redirect contract
        run: cp out/_redirects public/_redirects

      - name: Audit canonical, redirect, 404, and sitemap contract
        run: node scripts/ci/audit-technical-seo-contract.mjs

      - name: Upload technical SEO report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: technical-seo-contract-${{ github.run_number }}
          path: reports/technical-seo-contract.json
          retention-days: 30

      - name: Report governed export reuse
        if: always()
        run: |
          echo '## Technical SEO static contract' >> "$GITHUB_STEP_SUMMARY"
          echo "- Producer SHA: ${{ inputs.producer_sha || 'none (self-built fallback)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governed receipt verified: ${{ steps.governed-verify.outcome == 'success' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Same-repository PRs audit the exact CI export instead of rebuilding it.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Missing/stale/tampered artifacts fail closed to a complete build.' >> "$GITHUB_STEP_SUMMARY"

      - name: Wake trusted merge controller
        if: always() && github.event_name == 'workflow_dispatch' && inputs.producer_pr_number != '' && inputs.producer_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_PR_NUMBER: ${{ inputs.producer_pr_number }}
          PRODUCER_SHA: ${{ inputs.producer_sha }}
        run: |
          set -euo pipefail
          gh workflow run autonomous-merge-controller.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "pr_number=$PRODUCER_PR_NUMBER" \
            -f "expected_head_sha=$PRODUCER_SHA"

  live-production:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.producer_run_id == '')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Verify production hostname, protocol, slash, status, and sitemap health
        run: node scripts/monitor/production-seo-health.mjs --sample=50
