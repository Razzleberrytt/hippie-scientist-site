name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recovery_pr_number:
        description: PR number for exact-head recovery validation
        required: false
        type: string

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: read

jobs:
  validation:
    name: Validation, tests, and data
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact-tree main validation reuse
        id: merge-proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_AUTH_ATTEMPTS: '1'
          DEPLOY_AUTH_INTERVAL_MS: '0'
        run: node scripts/ci/verify-deploy-authorization.mjs

      - name: Exact-tree main validation fast path
        if: steps.merge-proof.outputs.skip_redundant_validation == 'true'
        run: echo "Exact controller-validated PR base/tree preserved by the main merge; reuse terminal-green PR validation and keep the exact merge-SHA production build authoritative."

      - name: Classify validation impact
        id: impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | node scripts/ci/classify-release-impact.mjs --github-output="$GITHUB_OUTPUT"

      - name: Docs-only validation fast path
        if: steps.impact.outputs.docs_only == 'true'
        run: echo "Docs-only PR; exhaustive app/data validation is delegated to the dedicated control/path-scoped workflows."

      - name: Validation-only control fast path
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.validation_only == 'true'
        run: echo "Build-output-neutral control/security change; run lint, focused control tests, and the fail-closed security audit without app/data/build suites."

      - name: Setup Node from .nvmrc
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show Node version
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true'
        run: node --version

      - name: Show npm version
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true'
        run: npm --version

      - name: Install dependencies
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true'
        run: npm ci --no-audit --fund=false

      - name: Verify package metadata is unchanged after install
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true'
        run: git diff --exit-code package-lock.json package.json

      - name: Verify Node engine
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true'
        run: npm run check:node

      - name: Validate workbook source
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run validate:workbook-source

      - name: Validate static export compatibility
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run validate:static-export

      - name: Generate route inventory
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run routes:inventory

      - name: Run lint
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true'
        run: npm run lint

      - name: Run focused control-plane tests
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.validation_only == 'true'
        run: >-
          npx vitest run
          scripts/ci/reconcile-project-control.test.mjs
          scripts/ci/validate-project-control-admission.test.mjs
          scripts/ci/classify-release-impact.test.mjs
          scripts/ci/build-performance-contract.test.mjs
          scripts/ci/autonomous-merge-refresh-safety.test.mjs
          scripts/ci/autonomous-merge-authorization.test.mjs
          scripts/ci/verify-deploy-authorization.test.mjs
          tests/autonomous-merge-controller-contract.test.ts
          tests/deployment-handoff-contract.test.ts
      - name: Validate governor state on validation-only changes
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.validation_only == 'true'
        run: |
          node --test scripts/enrichment-governor/__tests__/*.test.mjs
          node scripts/enrichment-governor/validate-state.mjs

      - name: Run typecheck
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run typecheck

      - name: Run related tests for leaf pages (vitest + explicit a11y gate)
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true' && steps.impact.outputs.leaf_page_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" HEAD)
          {
            npx vitest related "${changed_files[@]}" --run --passWithNoTests
            npx vitest run app/__tests__/a11y.test.tsx
          } 2>&1 | tee vitest.log

      - name: Run full tests (vitest + a11y gate)
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true' && steps.impact.outputs.leaf_page_only != 'true'
        run: |
          set -o pipefail
          npm run test 2>&1 | tee vitest.log

      # `npm run test` is vitest only, and vitest.config.ts excludes every
      # node:test suite because Vite bundles the prefix-only builtin instead of
      # handing the file to the intended runner. Until this step existed, those
      # suites ran only in a handful of path-filtered workflows, so a guard could
      # be added, excluded from vitest, referenced by no workflow, and be green
      # everywhere while asserting nothing — which is how a broken governor test
      # reached main. Discovery is by content, so new suites are covered here
      # automatically.
      - name: Run native node:test suites
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run test:node

      - name: Upload Vitest log
        if: always() && steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true' && hashFiles('vitest.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: vitest-log-${{ github.event.pull_request.head.sha || github.sha }}
          path: vitest.log
          retention-days: 7

      - name: Validate canonical data system (schema, SQLite, graph, freshness)
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run data:ci

      - name: Generate Related Botanicals quality audit
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npx tsx scripts/audit-related-botanicals.ts

      - name: Add Related Botanicals audit summary
        if: always() && steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true' && hashFiles('reports/related-botanicals/related-botanicals-audit.md') != ''
        run: cat reports/related-botanicals/related-botanicals-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Related Botanicals audit
        if: always() && steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true' && hashFiles('reports/related-botanicals/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: related-botanicals-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/related-botanicals/
          retention-days: 30

      - name: Guard workbook source of truth
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run guard:source-of-truth

      - name: Audit cluster-member runtime trust
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run audit:cluster-member-trust:strict

      - name: Run security audit gate
        if: steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true'
        run: npm run audit:high

      - name: Generate raw npm audit JSON
        if: ${{ always() && !cancelled() && steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' }}
        env:
          NPM_CONFIG_FETCH_TIMEOUT: '60000'
          NPM_CONFIG_FETCH_RETRIES: '1'
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 110s npm audit --json > npm-audit.after.json
          audit_status=$?
          set -e
          if [ "$audit_status" -eq 124 ] || [ "$audit_status" -eq 137 ]; then
            printf '%s\n' '{"error":"npm audit artifact timed out","timedOut":true}' > npm-audit.after.json
            echo "Raw npm audit artifact timed out after 110 seconds; security gate result is unaffected."
          elif [ "$audit_status" -ne 0 ]; then
            echo "Raw npm audit artifact exited with status $audit_status; security gate result is unaffected."
          fi
          exit 0

      - name: Upload audit artifact
        if: always() && steps.merge-proof.outputs.skip_redundant_validation != 'true' && steps.impact.outputs.docs_only != 'true' && hashFiles('npm-audit.after.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-after-${{ github.event.pull_request.head.sha || github.sha }}
          path: npm-audit.after.json

      - name: Add validation summary
        if: always()
        run: |
          echo "## CI validation/test lane" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runs independently of the production build lane to shorten the critical path." >> "$GITHUB_STEP_SUMMARY"
          echo "- Docs-only: ${{ steps.impact.outputs.docs_only || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validation-only: ${{ steps.impact.outputs.validation_only || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reused exact-tree main validation: ${{ steps.merge-proof.outputs.skip_redundant_validation || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.merge-proof.outputs.skip_redundant_validation }}" = "true" ]; then
            echo "- Fast path: exact controller-validated PR base/tree preserved by the main merge; duplicate validation/test/data work skipped while exact merge-SHA build/output remains mandatory." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.impact.outputs.docs_only }}" = "true" ]; then
            echo "- Fast path: exhaustive app/data validation skipped because every changed file is classified docs-only; dedicated path-scoped governance checks remain authoritative." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.impact.outputs.validation_only }}" = "true" ]; then
            echo "- Fast path: lint + focused control tests + security audit; app/data/full-test suites skipped because the exact path classifier proves the diff cannot alter public build output." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.impact.outputs.leaf_page_only }}" = "true" ]; then
            echo "- Fast path: lint + typecheck + dependency-related Vitest selection + explicit a11y + native node:test + canonical data/runtime/security gates; production build/output/SEO remains authoritative." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Coverage: lint, typecheck, full Vitest/a11y, canonical data, workbook parity, runtime trust, and security audit." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  build-verification:
    name: Production build, output, and SEO
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact producer context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            source_sha="$EVENT_HEAD_SHA"
            base_sha="$EVENT_BASE_SHA"
            head_ref="$EVENT_HEAD_REF"
            base_ref="$EVENT_BASE_REF"
            pr_number="$EVENT_PR_NUMBER"
          elif [ -n "$RECOVERY_PR_NUMBER" ]; then
            pr_json="$(gh api "repos/${{ github.repository }}/pulls/$RECOVERY_PR_NUMBER")"
            source_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
            head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            pr_number="$RECOVERY_PR_NUMBER"
            if [ "$GITHUB_SHA" != "$source_sha" ]; then
              echo "Recovery dispatch is stale: workflow head=$GITHUB_SHA PR head=$source_sha"
              exit 1
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE_SHA" ] && [ "$EVENT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            source_sha="$GITHUB_SHA"
            base_sha="$EVENT_BEFORE_SHA"
            head_ref="$GITHUB_REF_NAME"
            base_ref="$GITHUB_REF_NAME"
            pr_number=""
          else
            source_sha="$GITHUB_SHA"
            base_sha="$GITHUB_SHA"
            head_ref="$GITHUB_REF_NAME"
            base_ref="$GITHUB_REF_NAME"
            pr_number=""
          fi
          {
            echo "source_sha=$source_sha"
            echo "base_sha=$base_sha"
            echo "head_ref=$head_ref"
            echo "base_ref=$base_ref"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Classify release impact
        id: impact
        if: steps.context.outputs.pr_number != ''
        env:
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | node scripts/ci/classify-release-impact.mjs --github-output="$GITHUB_OUTPUT"

      - name: Validation-only production fast path
        if: steps.impact.outputs.validation_only == 'true'
        run: echo "Build-output-neutral validation/control change; production render/output consumers are intentionally not required."

      - name: Setup Node from .nvmrc
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Next.js build cache
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Restore deterministic build intermediates
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        uses: actions/cache@v6
        with:
          path: |
            .build-cache
            public/images/optimized
            lib/generated/optimized-images.json
            public/media/social/articles
          key: ${{ runner.os }}-build-deploy-intermediates-v1-${{ hashFiles('package-lock.json', 'scripts/cache/build-cache-manager.mjs', 'scripts/optimize-images.mjs', 'lib/cloudflare-image-loader.ts', 'scripts/media/build-article-social-images.mjs', 'lib/article-social.js', 'content/articles/**/*.md', 'content/articles/**/*.mdx', 'content/blog/**/*.md', 'content/blog/**/*.mdx', 'public/images/**/*.jpg', 'public/images/**/*.jpeg', 'public/images/**/*.png', 'public/images/**/*.gif', 'public/images/**/*.avif', 'public/images/**/*.tiff', 'public/images/**/*.webp') }}
          restore-keys: |
            ${{ runner.os }}-build-deploy-intermediates-v1-

      - name: Install dependencies
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm ci --no-audit --fund=false

      - name: Verify package metadata is unchanged after install
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: git diff --exit-code package-lock.json package.json

      - name: Verify Node engine
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run check:node

      - name: Validate workbook source
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run validate:workbook-source

      - name: Validate static export compatibility
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run validate:static-export

      - name: Build application
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        env:
          COMMIT_HASH: ${{ steps.context.outputs.source_sha }}
          AMAZON_AFFILIATE_TAG: ${{ vars.AMAZON_AFFILIATE_TAG }}
          SKIP_NEXT_BUILD_TYPECHECK: '1'
        run: npm run build:deploy

      - name: Verify build output
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run verify:output

      - name: Run supplemental release-quality validators
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: |
          node scripts/ci/validate-indexability-metadata.mjs
          npm run validate:evidence-language
          npm run validate:profile-verdicts
          npm run validate:claim-discipline
          npm run validate:safety-visibility
          npm run audit:cluster-member-trust:strict
          npm run audit:data-governance:strict

      - name: Write governed static export receipt
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: >-
          node scripts/ci/governed-static-export.mjs write
          --source-sha "${{ steps.context.outputs.source_sha }}"
          --base-sha "${{ steps.context.outputs.base_sha }}"
          --run-id "$GITHUB_RUN_ID"

      - name: Upload governed static export
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: governed-static-export-${{ steps.context.outputs.source_sha }}
          path: |
            out/
            .governed-static-export.json
          retention-days: 2
          if-no-files-found: error
          # Governed export fan-out is latency-sensitive. Level 1 keeps useful
          # text compression while favoring CPU/upload speed over archive size.
          compression-level: 1
          include-hidden-files: true

      - name: Generate SEO audit reports
        if: always() && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: |
          if ! find out -type f -name '*.html' -print -quit 2>/dev/null | grep -q .; then
            echo "No built HTML available; refreshing route manifest for fallback SEO audit."
            node scripts/data/build-route-manifest.mjs --data-dir=public/data
          fi
          npm run audit:seo-reports

      - name: Generate indexability candidate report
        if: always() && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run indexability:report

      - name: Audit internal links through redirects
        if: always() && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: node scripts/ci/audit-internal-redirect-links.mjs

      - name: Upload SEO audit reports
        if: always() && (hashFiles('public/data/reports/*.json') != '' || hashFiles('ops/reports/*.json') != '' || hashFiles('ops/indexability-review/*.json') != '')
        uses: actions/upload-artifact@v7
        with:
          name: seo-audit-reports-${{ steps.context.outputs.source_sha }}
          path: |
            public/data/reports/*.json
            ops/reports/*.json
            ops/indexability-review/*.json
          if-no-files-found: ignore

      - name: Validate route SEO coverage
        if: steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true'
        run: npm run validate:route-seo

      - name: Dispatch exact-head governed export consumers
        if: success() && (github.event_name == 'push' || steps.context.outputs.pr_number != '') && steps.impact.outputs.docs_only != 'true' && steps.impact.outputs.validation_only != 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -euo pipefail
          dispatch_epoch="$(date -u +%s)"
          payload="$(jq -nc \
            --arg ref "$HEAD_REF" \
            --arg run "$GITHUB_RUN_ID" \
            --arg source "$SOURCE_SHA" \
            --arg base "$BASE_SHA" \
            --arg pr "$PR_NUMBER" \
            '{ref:$ref,inputs:{producer_run_id:$run,producer_sha:$source,producer_base_sha:$base,producer_pr_number:$pr}}')"

          # The CI producer owns the only normal same-repository PR/main build.
          # Downstream output-dependent gates consume its hash-bound artifact.
          if [ -n "$PR_NUMBER" ]; then
            consumers=(build-check.yml lighthouse.yml production-content-lint.yml)
          else
            # Build Check has no direct main-push contract; preserve the historical
            # main surface while eliminating fallback rebuilds in the consumers
            # that already run after every relevant main push.
            consumers=(lighthouse.yml production-content-lint.yml)
          fi
          if [ "$BASE_SHA" != "$SOURCE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(data/|data-sources/|public/data/|content/|app/|components/|lib/|scripts/data/|scripts/lib/production-content-invariants\.mjs$|scripts/lib/runtime-source-registry-audit\.mjs$|scripts/ci/test-runtime-source-registry-audit\.mjs$|scripts/ci/[^/]*production[^/]*$|\.github/workflows/production-content-invariants\.yml$)'; then
            consumers+=(production-content-invariants.yml)
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(app/|components/|lib/|public/_redirects$|scripts/ci/audit-page-category-robots\.mjs$|scripts/ci/audit-profile-robots\.mjs$|scripts/ci/audit-static-crawl-surface\.mjs$|\.github/workflows/crawl-governance\.yml$)'; then
            consumers+=(crawl-governance.yml)
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(app/|components/|lib/|public/data/|data/evidence/|data/media/|scripts/ci/audit-schema-policy\.mjs$|scripts/ci/audit-structured-data\.mjs$|scripts/media/|\.github/workflows/schema-media-governance\.yml$)'; then
            consumers+=(schema-media-governance.yml)
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(app/|components/|lib/|public/_redirects$|public/redirect-overrides/|scripts/ci/audit-technical-seo-contract\.mjs$|scripts/monitor/production-seo-health[^/]*\.mjs$|\.github/workflows/technical-seo-monitor\.yml$)'; then
            consumers+=(technical-seo-monitor.yml)
          fi

          for workflow in "${consumers[@]}"; do
            if [ "$workflow" = "production-content-lint.yml" ]; then
              dispatch_payload="$(jq -c --arg pr "$PR_NUMBER" '.inputs.recovery_pr_number=$pr' <<<"$payload")"
            else
              dispatch_payload="$payload"
            fi
            printf '%s' "$dispatch_payload" | gh api --method POST "repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" --input -
            echo "Dispatched $workflow for exact head $SOURCE_SHA"
          done

          # Close the dispatch-registration race without holding this runner for
          # consumer completion. The autonomous merge controller observes both
          # pull_request and workflow_dispatch runs and waits for exact-head
          # consumers to become terminal before merging.
          for workflow in "${consumers[@]}"; do
            registered_run=""
            for attempt in $(seq 1 20); do
              runs_json="$(gh api --method GET "repos/${{ github.repository }}/actions/workflows/$workflow/runs" \
                -f event=workflow_dispatch \
                -f branch="$HEAD_REF" \
                -F per_page=20)"
              registered_run="$(jq -r \
                --arg sha "$SOURCE_SHA" \
                --argjson since "$dispatch_epoch" \
                '[.workflow_runs[]
                  | select(.event == "workflow_dispatch"
                    and .head_sha == $sha
                    and ((.created_at | fromdateiso8601) >= $since))]
                 | sort_by(.run_number, .run_attempt)
                 | last
                 | .id // empty' <<<"$runs_json")"
              if [ -n "$registered_run" ]; then
                echo "Registered $workflow run $registered_run for exact head $SOURCE_SHA"
                break
              fi
              sleep 2
            done
            if [ -z "$registered_run" ]; then
              echo "Consumer dispatch failed to register within 40 seconds: $workflow for $SOURCE_SHA"
              exit 1
            fi
          done

      - name: Add build summary
        if: always()
        run: |
          echo "## CI production-build lane" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coverage: deploy build, full verify:output contract, SEO reports, indexability, redirects, and route SEO." >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact source SHA: ${{ steps.context.outputs.source_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact base SHA: ${{ steps.context.outputs.base_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governed static export is hash-bound to source/base/lockfile/output and fans out only after this build succeeds on PRs and main." >> "$GITHUB_STEP_SUMMARY"
          echo "- Consumer dispatch registration is proven before CI can finish; the autonomous merge controller then waits for exact-head consumer completion." >> "$GITHUB_STEP_SUMMARY"
          echo "- PR Build Check plus Lighthouse, Production Content Lint, and every triggered build-dependent governance consumer reuse that artifact; artifact miss/mismatch falls back to a complete build." >> "$GITHUB_STEP_SUMMARY"
          echo "- Unprivileged fork/Dependabot PRs self-build consumer audits rather than attempting a forbidden workflow dispatch." >> "$GITHUB_STEP_SUMMARY"
          echo "- Docs-only: ${{ steps.impact.outputs.docs_only || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
