name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      recovery_pr_number:
        description: PR number for exact-head recovery validation
        required: false
        type: string

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Validation, tests, and data
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show Node version
        run: node --version

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Verify package metadata is unchanged after install
        run: git diff --exit-code package-lock.json package.json

      - name: Verify Node engine
        run: npm run check:node

      - name: Validate workbook source
        run: npm run validate:workbook-source

      - name: Validate static export compatibility
        run: npm run validate:static-export

      - name: Generate route inventory
        run: npm run routes:inventory

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests (vitest + a11y gate)
        run: |
          set -o pipefail
          npm run test 2>&1 | tee vitest.log

      - name: Upload Vitest log
        if: always() && hashFiles('vitest.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: vitest-log-${{ github.event.pull_request.head.sha || github.sha }}
          path: vitest.log
          retention-days: 7

      - name: Validate canonical data system (schema, SQLite, graph, freshness)
        run: npm run data:ci

      - name: Generate Related Botanicals quality audit
        run: npx tsx scripts/audit-related-botanicals.ts

      - name: Add Related Botanicals audit summary
        if: always() && hashFiles('reports/related-botanicals/related-botanicals-audit.md') != ''
        run: cat reports/related-botanicals/related-botanicals-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Related Botanicals audit
        if: always() && hashFiles('reports/related-botanicals/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: related-botanicals-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/related-botanicals/
          retention-days: 30

      - name: Guard workbook source of truth
        run: npm run guard:source-of-truth

      - name: Audit cluster-member runtime trust
        run: npm run audit:cluster-member-trust:strict

      - name: Run security audit gate
        run: npm run audit:high

      - name: Generate raw npm audit JSON
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 2
        env:
          NPM_CONFIG_FETCH_TIMEOUT: '60000'
          NPM_CONFIG_FETCH_RETRIES: '1'
        run: npm audit --json > npm-audit.after.json || true

      - name: Upload audit artifact
        if: always() && hashFiles('npm-audit.after.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-after-${{ github.event.pull_request.head.sha || github.sha }}
          path: npm-audit.after.json

      - name: Add validation summary
        if: always()
        run: |
          echo "## CI validation/test lane" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runs independently of the production build lane to shorten the critical path." >> "$GITHUB_STEP_SUMMARY"
          echo "- Coverage: lint, typecheck, Vitest/a11y, canonical data, workbook parity, runtime trust, and security audit." >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  build-verification:
    name: Production build, output, and SEO
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact producer context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            source_sha="$EVENT_HEAD_SHA"
            base_sha="$EVENT_BASE_SHA"
            head_ref="$EVENT_HEAD_REF"
            base_ref="$EVENT_BASE_REF"
            pr_number="$EVENT_PR_NUMBER"
          elif [ -n "$RECOVERY_PR_NUMBER" ]; then
            pr_json="$(gh api "repos/${{ github.repository }}/pulls/$RECOVERY_PR_NUMBER")"
            source_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
            head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            pr_number="$RECOVERY_PR_NUMBER"
            if [ "$GITHUB_SHA" != "$source_sha" ]; then
              echo "Recovery dispatch is stale: workflow head=$GITHUB_SHA PR head=$source_sha"
              exit 1
            fi
          else
            source_sha="$GITHUB_SHA"
            base_sha="$GITHUB_SHA"
            head_ref="$GITHUB_REF_NAME"
            base_ref="$GITHUB_REF_NAME"
            pr_number=""
          fi
          {
            echo "source_sha=$source_sha"
            echo "base_sha=$base_sha"
            echo "head_ref=$head_ref"
            echo "base_ref=$base_ref"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Classify release impact
        id: impact
        if: steps.context.outputs.pr_number != ''
        env:
          BASE_REF: ${{ steps.context.outputs.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | node scripts/ci/classify-release-impact.mjs --github-output="$GITHUB_OUTPUT"

      - name: Setup Node from .nvmrc
        if: steps.impact.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Next.js build cache
        if: steps.impact.outputs.docs_only != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        if: steps.impact.outputs.docs_only != 'true'
        run: npm ci --no-audit --fund=false

      - name: Verify package metadata is unchanged after install
        if: steps.impact.outputs.docs_only != 'true'
        run: git diff --exit-code package-lock.json package.json

      - name: Verify Node engine
        if: steps.impact.outputs.docs_only != 'true'
        run: npm run check:node

      - name: Validate workbook source
        if: steps.impact.outputs.docs_only != 'true'
        run: npm run validate:workbook-source

      - name: Validate static export compatibility
        if: steps.impact.outputs.docs_only != 'true'
        run: npm run validate:static-export

      - name: Build application
        if: steps.impact.outputs.docs_only != 'true'
        env:
          COMMIT_HASH: ${{ steps.context.outputs.source_sha }}
        run: npm run build:deploy

      - name: Verify build output
        if: steps.impact.outputs.docs_only != 'true'
        run: npm run verify:output

      - name: Write governed static export receipt
        if: steps.impact.outputs.docs_only != 'true'
        run: >-
          node scripts/ci/governed-static-export.mjs write
          --source-sha "${{ steps.context.outputs.source_sha }}"
          --base-sha "${{ steps.context.outputs.base_sha }}"
          --run-id "$GITHUB_RUN_ID"

      - name: Upload governed static export
        if: steps.impact.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: governed-static-export-${{ steps.context.outputs.source_sha }}
          path: |
            out/
            .governed-static-export.json
          retention-days: 2
          if-no-files-found: error
          compression-level: 6
          include-hidden-files: true

      - name: Generate SEO audit reports
        if: always() && steps.impact.outputs.docs_only != 'true'
        run: |
          if ! find out -type f -name '*.html' -print -quit 2>/dev/null | grep -q .; then
            echo "No built HTML available; refreshing route manifest for fallback SEO audit."
            node scripts/data/build-route-manifest.mjs --data-dir=public/data
          fi
          npm run audit:seo-reports

      - name: Generate indexability candidate report
        if: always() && steps.impact.outputs.docs_only != 'true'
        run: npm run indexability:report

      - name: Audit internal links through redirects
        if: always() && steps.impact.outputs.docs_only != 'true'
        run: node scripts/ci/audit-internal-redirect-links.mjs

      - name: Upload SEO audit reports
        if: always() && (hashFiles('public/data/reports/*.json') != '' || hashFiles('ops/reports/*.json') != '' || hashFiles('ops/indexability-review/*.json') != '')
        uses: actions/upload-artifact@v7
        with:
          name: seo-audit-reports-${{ steps.context.outputs.source_sha }}
          path: |
            public/data/reports/*.json
            ops/reports/*.json
            ops/indexability-review/*.json
          if-no-files-found: ignore

      - name: Validate route SEO coverage
        if: steps.impact.outputs.docs_only != 'true'
        run: npm run validate:route-seo

      - name: Dispatch exact-head governed export consumers
        if: success() && steps.context.outputs.pr_number != '' && steps.impact.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
          BASE_SHA: ${{ steps.context.outputs.base_sha }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
        run: |
          set -euo pipefail
          dispatch_epoch="$(date -u +%s)"
          payload="$(jq -nc \
            --arg ref "$HEAD_REF" \
            --arg run "$GITHUB_RUN_ID" \
            --arg source "$SOURCE_SHA" \
            --arg base "$BASE_SHA" \
            --arg pr "$PR_NUMBER" \
            '{ref:$ref,inputs:{producer_run_id:$run,producer_sha:$source,producer_base_sha:$base,producer_pr_number:$pr}}')"
          consumers=(build-check.yml lighthouse.yml production-content-lint.yml)
          for workflow in build-check.yml lighthouse.yml; do
            printf '%s' "$payload" | gh api --method POST "repos/${{ github.repository }}/actions/workflows/$workflow/dispatches" --input -
            echo "Dispatched $workflow for exact head $SOURCE_SHA"
          done
          lint_payload="$(jq -c --arg pr "$PR_NUMBER" '.inputs.recovery_pr_number=$pr' <<<"$payload")"
          printf '%s' "$lint_payload" | gh api --method POST "repos/${{ github.repository }}/actions/workflows/production-content-lint.yml/dispatches" --input -
          echo "Dispatched production-content-lint.yml for exact head $SOURCE_SHA"

          # Close the dispatch-registration race without holding this runner for
          # consumer completion. The autonomous merge controller observes both
          # pull_request and workflow_dispatch runs and will wait for the newest
          # exact-head consumer runs to become terminal before merging.
          for workflow in "${consumers[@]}"; do
            registered_run=""
            for attempt in $(seq 1 20); do
              runs_json="$(gh api --method GET "repos/${{ github.repository }}/actions/workflows/$workflow/runs" \
                -f event=workflow_dispatch \
                -f branch="$HEAD_REF" \
                -F per_page=20)"
              registered_run="$(jq -r \
                --arg sha "$SOURCE_SHA" \
                --argjson since "$dispatch_epoch" \
                '[.workflow_runs[]
                  | select(.event == "workflow_dispatch"
                    and .head_sha == $sha
                    and ((.created_at | fromdateiso8601) >= $since))]
                 | sort_by(.run_number, .run_attempt)
                 | last
                 | .id // empty' <<<"$runs_json")"
              if [ -n "$registered_run" ]; then
                echo "Registered $workflow run $registered_run for exact head $SOURCE_SHA"
                break
              fi
              sleep 2
            done
            if [ -z "$registered_run" ]; then
              echo "Consumer dispatch failed to register within 40 seconds: $workflow for $SOURCE_SHA"
              exit 1
            fi
          done

      - name: Add build summary
        if: always()
        run: |
          echo "## CI production-build lane" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coverage: deploy build, full verify:output contract, SEO reports, indexability, redirects, and route SEO." >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact source SHA: ${{ steps.context.outputs.source_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact base SHA: ${{ steps.context.outputs.base_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Governed static export is hash-bound to source/base/lockfile/output and fans out only after this build succeeds." >> "$GITHUB_STEP_SUMMARY"
          echo "- Consumer dispatch registration is proven before CI can finish; the autonomous merge controller then waits for exact-head consumer completion." >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Check, Lighthouse, and Production Content Lint reuse that artifact; artifact miss/mismatch falls back to a complete build." >> "$GITHUB_STEP_SUMMARY"
          echo "- Unprivileged fork/Dependabot PRs self-build consumer audits rather than attempting a forbidden workflow dispatch." >> "$GITHUB_STEP_SUMMARY"
          echo "- Docs-only: ${{ steps.impact.outputs.docs_only || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
