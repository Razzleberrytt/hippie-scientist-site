name: 🚨 BROKEN!!!!! Swarm Sentinel

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: swarm-broken-sentinel
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ALERT_TITLE: '🚨 BROKEN!!!!! SITE SWARM NEEDS ATTENTION'
    steps:
      - name: Inspect swarm health
        id: health
        shell: bash
        run: |
          set -euo pipefail

          now_epoch=$(date -u +%s)
          heartbeat_cutoff=$((now_epoch - 45*60))
          failure_cutoff=$((now_epoch - 120*60))
          reasons=()
          controller_stale=false
          other_broken=false

          runs_json=$(gh api "repos/$REPO/actions/runs?per_page=100")

          latest_controller=$(printf '%s' "$runs_json" | jq -c '[.workflow_runs[] | select(
            .name == "Autonomous merge controller" and
            (
              .event == "schedule" or
              (.event == "workflow_dispatch" and .head_branch == "main" and .status == "completed" and .conclusion == "success")
            )
          )] | sort_by(.created_at) | last // empty')
          if [ -z "$latest_controller" ]; then
            controller_stale=true
            reasons+=("No scheduled or recovery-dispatched Autonomous merge controller run is visible.")
          else
            created_at=$(printf '%s' "$latest_controller" | jq -r '.created_at')
            created_epoch=$(date -u -d "$created_at" +%s)
            conclusion=$(printf '%s' "$latest_controller" | jq -r '.conclusion // "in_progress"')
            url=$(printf '%s' "$latest_controller" | jq -r '.html_url')
            if [ "$created_epoch" -lt "$heartbeat_cutoff" ]; then
              controller_stale=true
              reasons+=("Autonomous merge heartbeat is stale (>45 minutes): $url")
            fi
            case "$conclusion" in
              failure|timed_out|action_required|startup_failure)
                reasons+=("Latest Autonomous merge controller run is $conclusion: $url")
                ;;
            esac
          fi

          while IFS=$'\t' read -r name conclusion created_at url; do
            [ -z "${name:-}" ] && continue
            created_epoch=$(date -u -d "$created_at" +%s)
            [ "$created_epoch" -lt "$failure_cutoff" ] && continue
            case "$conclusion" in
              failure|timed_out|action_required|startup_failure)
                case "$name" in
                  *[Ss]warm*|*Enrichment*|*Citation*|*Search*Console*|*Deploy*Cloudflare*|*Autonomous*merge*)
                    reasons+=("Critical workflow failed: $name ($conclusion) — $url")
                    case "$name" in
                      *Autonomous*merge*) ;;
                      *) other_broken=true ;;
                    esac
                    ;;
                esac
                ;;
            esac
          # Keep the latest decisive result for each workflow/exact-head lineage.
          # Pending, skipped, or cancelled retries do not clear a prior failure; only a
          # completed same-head success can supersede it.
          done < <(printf '%s' "$runs_json" | jq -r '
            [.workflow_runs[]
              | select(.status == "completed")
              | select(.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")]
            | sort_by(.workflow_id, (.head_sha // .head_branch // ""), .created_at)
            | group_by(.workflow_id, (.head_sha // .head_branch // ""))
            | map(last)[]
            | [.name, .conclusion, .created_at, .html_url]
            | @tsv')

          echo "controller_stale=$controller_stale" >> "$GITHUB_OUTPUT"
          echo "other_broken=$other_broken" >> "$GITHUB_OUTPUT"

          if [ ${#reasons[@]} -eq 0 ]; then
            echo 'broken=false' >> "$GITHUB_OUTPUT"
            echo '## ✅ Swarm sentinel: healthy' >> "$GITHUB_STEP_SUMMARY"
            echo '- No intervention condition detected.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          printf '%s\n' "${reasons[@]}" > "$RUNNER_TEMP/swarm-broken-reasons.txt"
          echo 'broken=true' >> "$GITHUB_OUTPUT"
          {
            echo '## 🚨 BROKEN!!!!!'
            echo
            printf -- '- %s\n' "${reasons[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recover and verify stale Autonomous merge heartbeat
        id: recovery
        if: steps.health.outputs.controller_stale == 'true'
        shell: bash
        run: |
          set -euo pipefail

          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST "repos/$REPO/actions/workflows/autonomous-merge-controller.yml/dispatches" -f ref=main

          recovered=false
          recovery_url=''
          recovery_conclusion=''
          for _ in $(seq 1 24); do
            run_json="$(gh api "repos/$REPO/actions/runs?per_page=100" | jq -c --arg started "$dispatch_started_at" '
              [.workflow_runs[] | select(
                .name == "Autonomous merge controller" and
                .event == "workflow_dispatch" and
                .head_branch == "main" and
                .created_at >= $started
              )]
              | sort_by(.created_at)
              | last // empty
            ')"

            if [ -n "$run_json" ]; then
              recovery_url="$(printf '%s' "$run_json" | jq -r '.html_url')"
              status="$(printf '%s' "$run_json" | jq -r '.status')"
              recovery_conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // ""')"

              if [ "$status" = 'completed' ]; then
                if [ "$recovery_conclusion" = 'success' ]; then
                  recovered=true
                fi
                break
              fi
            fi

            sleep 5
          done

          echo "recovered=$recovered" >> "$GITHUB_OUTPUT"
          echo "recovery_url=$recovery_url" >> "$GITHUB_OUTPUT"

          if [ "$recovered" = 'true' ]; then
            {
              echo '## ✅ Controller heartbeat self-recovered'
              echo
              echo '- The scheduled fallback heartbeat was stale, so the sentinel dispatched the trusted controller on `main`.'
              echo "- Recovery completed successfully in the same sentinel run: $recovery_url"
              echo '- No BROKEN issue is needed for this transient scheduler miss.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## 🚨 Controller recovery did not become healthy'
              echo
              if [ -n "$recovery_url" ]; then
                echo "- Recovery run: $recovery_url"
                echo "- Conclusion: ${recovery_conclusion:-not completed before sentinel timeout}"
              else
                echo '- No recovery workflow run became visible before the sentinel timeout.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            {
              if [ -n "$recovery_url" ]; then
                echo "Autonomous merge heartbeat recovery did not complete successfully: $recovery_url"
              else
                echo 'Autonomous merge heartbeat recovery was dispatched but no recovery run became visible before timeout.'
              fi
            } >> "$RUNNER_TEMP/swarm-broken-reasons.txt"
          fi

      - name: Open or refresh BROKEN!!!!! issue
        if: always() && steps.health.outputs.broken == 'true' && (steps.health.outputs.other_broken == 'true' || steps.recovery.outputs.recovered != 'true')
        shell: bash
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/swarm-broken-body.md"
          {
            echo '# 🚨 BROKEN!!!!!'
            echo
            echo '**The site swarm needs human attention.**'
            echo
            echo 'Detected:'
            sed 's/^/- /' "$RUNNER_TEMP/swarm-broken-reasons.txt"
            echo
            echo "Sentinel run: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Do not spend time re-reading the whole swarm plan. Start with the failing workflow/run above, repair the deterministic blocker, then re-run the sentinel.'
          } > "$body_file"

          issue_number=$(gh issue list --repo "$REPO" --state open --search "in:title $ALERT_TITLE" --json number,title --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" | head -1)

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$REPO" --body-file "$body_file" --add-assignee "${GITHUB_REPOSITORY_OWNER}"
            gh issue comment "$issue_number" --repo "$REPO" --body "🚨 BROKEN!!!!! Sentinel still detects an intervention condition. See updated issue body and run: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue create --repo "$REPO" --title "$ALERT_TITLE" --body-file "$body_file" --assignee "${GITHUB_REPOSITORY_OWNER}"
          fi

      - name: Close BROKEN!!!!! issue on recovery
        if: always() && (steps.health.outputs.broken == 'false' || (steps.health.outputs.other_broken != 'true' && steps.recovery.outputs.recovered == 'true'))
        shell: bash
        run: |
          set -euo pipefail
          issue_number=$(gh issue list --repo "$REPO" --state open --search "in:title $ALERT_TITLE" --json number,title --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" | head -1)
          if [ -n "$issue_number" ]; then
            if [ "${{ steps.recovery.outputs.recovered }}" = 'true' ]; then
              recovery_url="${{ steps.recovery.outputs.recovery_url }}"
              gh issue comment "$issue_number" --repo "$REPO" --body "✅ RECOVERED — the sentinel verified a successful trusted controller recovery in this same run: ${recovery_url:-$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID}. Closing automatically."
            else
              gh issue comment "$issue_number" --repo "$REPO" --body "✅ RECOVERED — the swarm sentinel no longer detects the intervention condition. Closing automatically."
            fi
            gh issue close "$issue_number" --repo "$REPO" --reason completed
          fi
