name: Enrichment Governor Persistent Lease Transaction

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Persistent lease operation
        required: true
        type: choice
        options: [acquire, release]
      lease_id:
        description: Stable lease identifier
        required: true
        type: string
      owner:
        description: Exact lease owner identity
        required: true
        type: string
      purpose:
        description: Acquire purpose
        required: false
        default: enrichment
        type: string
      files:
        description: Comma-separated exact repository-relative file paths
        required: false
        type: string
      entities:
        description: Comma-separated typed entity keys
        required: false
        type: string
      disposition:
        description: Release disposition
        required: false
        default: completed
        type: string

concurrency:
  group: enrichment-governor-persistent-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  transact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Capture exact transaction base
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate governor and transaction request
        env:
          TRANSACTION_OPERATION: ${{ inputs.operation }}
          LEASE_ID: ${{ inputs.lease_id }}
          LEASE_OWNER: ${{ inputs.owner }}
          LEASE_PURPOSE: ${{ inputs.purpose }}
          LEASE_FILES: ${{ inputs.files }}
          LEASE_ENTITIES: ${{ inputs.entities }}
          LEASE_DISPOSITION: ${{ inputs.disposition }}
        run: |
          set -euo pipefail
          node --test scripts/enrichment-governor/__tests__/*.test.mjs
          node scripts/enrichment-governor/validate-state.mjs
          node scripts/enrichment-governor/reconcile-state.mjs
          node scripts/enrichment-governor/lease-transaction.mjs validate

      - name: Apply validated lease transaction
        env:
          TRANSACTION_OPERATION: ${{ inputs.operation }}
          LEASE_ID: ${{ inputs.lease_id }}
          LEASE_OWNER: ${{ inputs.owner }}
          LEASE_PURPOSE: ${{ inputs.purpose }}
          LEASE_FILES: ${{ inputs.files }}
          LEASE_ENTITIES: ${{ inputs.entities }}
          LEASE_DISPOSITION: ${{ inputs.disposition }}
        run: |
          set -euo pipefail
          node scripts/enrichment-governor/lease-transaction.mjs run | tee /tmp/governor-transaction.json
          RECEIPT_PATH="$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('/tmp/governor-transaction.json','utf8')); process.stdout.write(v.receiptPath)")"
          test -n "$RECEIPT_PATH"
          echo "RECEIPT_PATH=$RECEIPT_PATH" >> "$GITHUB_ENV"

      - name: Enforce state-only mutation boundary
        run: |
          set -euo pipefail
          changed="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          test -n "$changed"
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              ops/enrichment-governor/work-queue.json|ops/enrichment-governor/quarantine.json|ops/enrichment-governor/ledger.jsonl|"$RECEIPT_PATH") ;;
              *) echo "Unexpected persistent transaction mutation: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Revalidate persistent state
        run: node scripts/enrichment-governor/validate-state.mjs

      - name: Fail closed if main moved before commit
        run: |
          set -euo pipefail
          git fetch origin main
          ACTUAL_BASE_SHA="$(git rev-parse origin/main)"
          EXPECTED_BASE_SHA="$BASE_SHA" ACTUAL_BASE_SHA="$ACTUAL_BASE_SHA" node scripts/enrichment-governor/lease-transaction.mjs assert-fresh

      - name: Commit atomic persistent transaction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/enrichment-governor/work-queue.json ops/enrichment-governor/quarantine.json ops/enrichment-governor/ledger.jsonl "$RECEIPT_PATH"
          git commit -m "chore(governor): persist lease transaction"
          TX_COMMIT_SHA="$(git rev-parse HEAD)"
          echo "TX_COMMIT_SHA=$TX_COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Finalize durable receipt
        run: |
          set -euo pipefail
          TRANSACTION_COMMIT_SHA="$TX_COMMIT_SHA" node scripts/enrichment-governor/lease-transaction.mjs finalize
          git add "$RECEIPT_PATH"
          git commit -m "chore(governor): finalize lease receipt"

      - name: Fail closed if main moved before publication
        run: |
          set -euo pipefail
          git fetch origin main
          ACTUAL_BASE_SHA="$(git rev-parse origin/main)"
          EXPECTED_BASE_SHA="$BASE_SHA" ACTUAL_BASE_SHA="$ACTUAL_BASE_SHA" node scripts/enrichment-governor/lease-transaction.mjs assert-fresh

      - name: Publish transaction branch
        run: |
          set -euo pipefail
          BRANCH="governor/lease-transaction-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "TX_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Create transaction audit issue and protected PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUDIT_URL="$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "governor: admit ${{ inputs.operation }} transaction for ${{ inputs.lease_id }}" \
            --body "Canonical state-only governor transaction generated by workflow run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}. Exact base: \`$BASE_SHA\`. Lease: \`${{ inputs.lease_id }}\`. Owner: \`${{ inputs.owner }}\`. This audit ticket exists only to admit the generated queue/ledger/receipt transaction through protected PR governance; it does not authorize scientific mutation by itself.")"
          AUDIT_NUMBER="${AUDIT_URL##*/}"
          cat > /tmp/governor-pr-body.md <<EOF
          Closes #${AUDIT_NUMBER}

          ## Summary
          - admits the canonical persistent governor transaction generated by workflow run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}
          - operation: \`${{ inputs.operation }}\`
          - lease: \`${{ inputs.lease_id }}\`
          - owner: \`${{ inputs.owner }}\`
          - exact transaction base: \`$BASE_SHA\`
          - state-only; no scientific/public content mutation

          ## Relevant URLs
          - Audit issue: #${AUDIT_NUMBER}
          - Transaction workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Receipt: \`$RECEIPT_PATH\`

          ## Acceptance criteria
          - [x] canonical governor writer produced the queue/ledger/receipt mutation
          - [x] mutation boundary is state-only
          - [x] transaction was validated on exact current main before branch publication
          - [ ] exact-head repository checks pass
          - [ ] merge occurs only through protected PR governance

          ## Validation commands
          - \`node --test scripts/enrichment-governor/__tests__/*.test.mjs\`
          - \`node scripts/enrichment-governor/validate-state.mjs\`
          - exact-head CI, Site Health, Atomic Upgrade Gate, and Build Quality Regression

          ## Before → after metrics
          - Direct pushes to protected main for this transaction: 0
          - State-only generated transaction PRs: 0 → 1
          - Scientific/public mutations: 0 → 0

          ## Generator/source-of-truth decision
          \`enrichment-governor-transaction.yml\` → \`lease-transaction.mjs\` → \`control.mjs\` remains the sole persistent governor writer. This PR only admits its generated state through repository protection.

          ## Regression contract
          Never hand-edit or hand-rebase generated governor state. If main changes before this exact-base transaction can merge safely, abandon it and rerun the canonical transaction. Scientific, provenance, safety, publication, and CI gates remain unchanged.
          EOF
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$TX_BRANCH" \
            --title "chore(governor): ${{ inputs.operation }} ${{ inputs.lease_id }}" \
            --body-file /tmp/governor-pr-body.md)"
          PR_NUMBER="${PR_URL##*/}"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "AUDIT_NUMBER=$AUDIT_NUMBER" >> "$GITHUB_ENV"

      - name: Dispatch exact-head recovery validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TX_BRANCH" -f "recovery_pr_number=$PR_NUMBER"
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$TX_BRANCH" -f "recovery_pr_number=$PR_NUMBER"
          gh workflow run atomic-upgrade-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$TX_BRANCH" -f "recovery_pr_number=$PR_NUMBER" -f "recovery_base_ref=main"
          gh workflow run build-quality-regression.yml --repo "$GITHUB_REPOSITORY" --ref "$TX_BRANCH" -f "recovery_pr_number=$PR_NUMBER" -f "recovery_base_ref=main"

      - name: Summary
        run: |
          {
            echo "## Persistent governor transaction staged through protected PR governance"
            echo "- Operation: \`${{ inputs.operation }}\`"
            echo "- Lease: \`${{ inputs.lease_id }}\`"
            echo "- Owner: \`${{ inputs.owner }}\`"
            echo "- Base: \`$BASE_SHA\`"
            echo "- Receipt: \`$RECEIPT_PATH\`"
            echo "- Branch: \`$TX_BRANCH\`"
            echo "- PR: #$PR_NUMBER"
            echo "- Audit issue: #$AUDIT_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"
