name: Metricool Publication

on:
  workflow_dispatch:
    inputs:
      publication_at:
        description: 'Future offset-aware ISO time, e.g. 2026-08-31T14:00:00-04:00'
        required: true
        type: string
      networks:
        description: 'Comma-separated networks authorized by the deployed governed media manifest'
        required: true
        default: 'facebook,tiktok'
        type: string
      auto_publish:
        description: 'Allow Metricool to auto-publish at the scheduled time'
        required: true
        default: true
        type: boolean
      youtube_title:
        description: 'Explicit YouTube Short title; required when youtube is requested'
        required: false
        default: ''
        type: string
      youtube_privacy:
        description: 'Explicit YouTube privacy: public or private; required when youtube is requested'
        required: false
        default: ''
        type: string
      youtube_made_for_kids:
        description: 'Explicit true/false audience declaration; required when youtube is requested'
        required: false
        default: ''
        type: string
      youtube_ai_generated_content:
        description: 'Explicit true/false AI-content declaration; required when youtube is requested'
        required: false
        default: ''
        type: string

concurrency:
  group: metricool-publication
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate Metricool provider boundary
        run: npx vitest run scripts/distribution/__tests__/metricool-provider.test.mjs scripts/distribution/__tests__/metricool-youtube-metadata.test.mjs scripts/distribution/__tests__/distribution-lifecycle.test.mjs

      - name: Regenerate current governed pilot
        run: |
          node scripts/distribution/build-research-distribution.mjs
          node scripts/distribution/build-opportunity-selection.mjs
          node scripts/distribution/build-bounded-pilot.mjs

      - name: Require Metricool server credential
        env:
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${METRICOOL_USER_TOKEN:-}" ]; then
            echo 'Missing production secret METRICOOL_USER_TOKEN. Refusing live scheduling.'
            exit 1
          fi

      - name: Validate deployed governed publication boundary
        env:
          METRICOOL_PUBLICATION_AT: ${{ inputs.publication_at }}
          METRICOOL_NETWORKS: ${{ inputs.networks }}
          METRICOOL_AUTO_PUBLISH: ${{ inputs.auto_publish }}
          METRICOOL_YOUTUBE_TITLE: ${{ inputs.youtube_title }}
          METRICOOL_YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}
          METRICOOL_YOUTUBE_MADE_FOR_KIDS: ${{ inputs.youtube_made_for_kids }}
          METRICOOL_YOUTUBE_AI_GENERATED_CONTENT: ${{ inputs.youtube_ai_generated_content }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { buildMetricoolSchedulerRequest } from './scripts/distribution/metricool-provider.mjs'

          const clean = (value) => String(value ?? '').trim()
          const parseBoolean = (value, label) => {
            const normalized = clean(value).toLowerCase()
            if (!normalized) return undefined
            if (normalized === 'true') return true
            if (normalized === 'false') return false
            throw new Error(`${label} must be explicitly true or false`)
          }
          const networks = [...new Set(clean(process.env.METRICOOL_NETWORKS).split(',').map((item) => item.trim().toLowerCase()).filter(Boolean))]
          const selection = JSON.parse(fs.readFileSync('artifacts/distribution/opportunity-selection.json', 'utf8'))
          const objectId = clean(selection?.selected?.id)
          if (!objectId) throw new Error('missing governed opportunity selection')
          const pilot = JSON.parse(fs.readFileSync(path.join('artifacts/distribution/pilots', objectId, 'bounded-pilot.json'), 'utf8'))
          const manifestUrl = 'https://thehippiescientist.net/media/distribution/metricool/latest.json'
          const response = await fetch(manifestUrl, { headers: { Accept: 'application/json' } })
          if (!response.ok) throw new Error(`deployed Metricool manifest is unreachable (${response.status})`)
          const manifest = await response.json()
          if (manifest?.schemaVersion !== 'metricool-publication-media-v1' || manifest?.status !== 'ready-for-provider') {
            throw new Error('deployed Metricool manifest is invalid or not provider-ready')
          }
          if (manifest.identityFingerprint !== pilot?.lifecycle?.identity?.fingerprint || manifest.lifecycleId !== pilot?.lifecycle?.lifecycleId || manifest.researchObjectId !== objectId) {
            throw new Error('deployed Metricool manifest is stale relative to the dispatch SHA')
          }
          const allowed = new Set(Array.isArray(manifest.allowedNetworks) ? manifest.allowedNetworks.map((item) => clean(item).toLowerCase()) : [])
          const disallowed = networks.filter((network) => !allowed.has(network))
          if (disallowed.length) throw new Error(`deployed governed media is not authorized for network(s): ${disallowed.join(', ')}`)
          const youtube = networks.includes('youtube')
          buildMetricoolSchedulerRequest({
            format: manifest.format,
            networks,
            text: manifest.text,
            mediaUrls: manifest.media.map((item) => item.url),
            publicationAt: process.env.METRICOOL_PUBLICATION_AT,
            timezone: 'America/New_York',
            title: youtube ? clean(process.env.METRICOOL_YOUTUBE_TITLE) : manifest.title,
            autoPublish: process.env.METRICOOL_AUTO_PUBLISH !== 'false',
            youtubePrivacy: youtube ? clean(process.env.METRICOOL_YOUTUBE_PRIVACY) : undefined,
            youtubeMadeForKids: youtube ? parseBoolean(process.env.METRICOOL_YOUTUBE_MADE_FOR_KIDS, 'YouTube made-for-kids setting') : undefined,
            youtubeAiGeneratedContent: youtube ? parseBoolean(process.env.METRICOOL_YOUTUBE_AI_GENERATED_CONTENT, 'YouTube AI-content declaration') : undefined,
            availableNetworks: ['facebook', 'tiktok', 'youtube'],
          })
          NODE

      - name: Check durable dispatch reservation
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PILOT_FILE="$(find artifacts/distribution/pilots -name bounded-pilot.json -type f -print -quit)"
          if [ -z "${PILOT_FILE:-}" ]; then
            echo 'No bounded pilot found; refusing live scheduling.'
            exit 1
          fi
          IDEMPOTENCY_KEY="$(jq -r '.lifecycle.identity.idempotencyKey // empty' "$PILOT_FILE")"
          if [ -z "${IDEMPOTENCY_KEY:-}" ]; then
            echo 'Governed pilot is missing lifecycle idempotencyKey; refusing live scheduling.'
            exit 1
          fi
          ARTIFACT_NAME="metricool-dispatch-reservation-${IDEMPOTENCY_KEY}"
          EXISTING="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            --get --data-urlencode "name=${ARTIFACT_NAME}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts")"
          ACTIVE_COUNT="$(printf '%s' "$EXISTING" | jq '[.artifacts[] | select(.expired == false)] | length')"
          if [ "$ACTIVE_COUNT" -gt 0 ]; then
            echo "A durable Metricool dispatch reservation already exists for ${IDEMPOTENCY_KEY}. Refusing a duplicate provider POST."
            exit 1
          fi
          mkdir -p artifacts/distribution/metricool-reservation
          jq -n \
            --arg schemaVersion 'metricool-dispatch-reservation-v1' \
            --arg idempotencyKey "$IDEMPOTENCY_KEY" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg publicationAt '${{ inputs.publication_at }}' \
            --arg networks '${{ inputs.networks }}' \
            '{schemaVersion:$schemaVersion,idempotencyKey:$idempotencyKey,workflowRunId:$workflowRunId,publicationAt:$publicationAt,networks:$networks}' \
            > artifacts/distribution/metricool-reservation/reservation.json
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Reserve exact governed identity before provider dispatch
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.reservation.outputs.artifact_name }}
          path: artifacts/distribution/metricool-reservation/reservation.json
          if-no-files-found: error
          retention-days: 90

      - name: Schedule governed publication in Metricool
        id: metricool_schedule
        env:
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: '5228072'
          METRICOOL_BLOG_ID: '6794242'
          METRICOOL_PUBLICATION_AT: ${{ inputs.publication_at }}
          METRICOOL_NETWORKS: ${{ inputs.networks }}
          METRICOOL_AUTO_PUBLISH: ${{ inputs.auto_publish }}
          METRICOOL_YOUTUBE_TITLE: ${{ inputs.youtube_title }}
          METRICOOL_YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy }}
          METRICOOL_YOUTUBE_MADE_FOR_KIDS: ${{ inputs.youtube_made_for_kids }}
          METRICOOL_YOUTUBE_AI_GENERATED_CONTENT: ${{ inputs.youtube_ai_generated_content }}
        run: node scripts/distribution/schedule-metricool-publication.mjs

      - name: Release reservation after confirmed provider failure
        if: ${{ failure() && steps.metricool_schedule.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.reservation.outputs.artifact_name }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACT_NAME:-}" ]; then
            echo 'Reservation artifact name is unavailable; retaining fail-closed state.'
            exit 1
          fi
          EXISTING="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            --get --data-urlencode "name=${ARTIFACT_NAME}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts")"
          mapfile -t ARTIFACT_IDS < <(printf '%s' "$EXISTING" | jq -r --argjson runId "$GITHUB_RUN_ID" '.artifacts[] | select(.expired == false and .workflow_run.id == $runId) | .id')
          if [ "${#ARTIFACT_IDS[@]}" -eq 0 ]; then
            echo 'No current-run reservation artifact found; nothing to release.'
            exit 0
          fi
          for artifact_id in "${ARTIFACT_IDS[@]}"; do
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
          echo "Released failed-dispatch reservation ${ARTIFACT_NAME}; a later governed retry may proceed."

      - name: Upload sanitized scheduling receipt
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: metricool-schedule-receipt-${{ github.run_number }}
          path: artifacts/distribution/metricool/*.scheduled.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize
        if: always()
        run: |
          echo '## Metricool publication' >> "$GITHUB_STEP_SUMMARY"
          echo "- Dispatch SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested networks: ${{ inputs.networks }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested publication time: ${{ inputs.publication_at }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auto-publish requested: ${{ inputs.auto_publish }}" >> "$GITHUB_STEP_SUMMARY"
          if ls artifacts/distribution/metricool/*.scheduled.json >/dev/null 2>&1; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs')
          const path = require('path')
          const dir = 'artifacts/distribution/metricool'
          const file = fs.readdirSync(dir).find((name) => name.endsWith('.scheduled.json'))
          const receipt = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'))
          console.log(`- Metricool provider confirmation: ${receipt.externalId}`)
          console.log(`- Format/media: ${receipt.format}/${receipt.mediaType}`)
          console.log(`- Lifecycle state: ${receipt.lifecycle.state}; dry-run: ${receipt.lifecycle.dryRun}`)
          NODE
          else
            echo '- No live scheduling receipt was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
