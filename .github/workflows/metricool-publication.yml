name: Metricool Publication (Frozen)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject legacy Metricool publication
        run: |
          echo "Metricool canonical publication is frozen. Use THS Publisher and a canonical publication_id." >&2
          exit 1
