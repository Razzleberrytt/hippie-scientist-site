name: EvidenceMotion autonomous signal audio screening
on:
  pull_request:
    paths:
      - 'research/evidencemotion-director/autonomous_voice_signal_audit.py'
      - 'research/evidencemotion-director/test_autonomous_voice_signal_audit.py'
      - 'research/evidencemotion-director/AUTONOMOUS-AUDIO-REVIEW-2026-10-13.md'
      - '.github/workflows/evidencemotion-autonomous-audio-screen.yml'
permissions:
  contents: read
jobs:
  exact-audio-decode-negative-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free CPU-only audio signal tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install 'numpy==2.3.3'
      - name: Test genuine PCM/AAC audio tracking and actual damaged audio refusals
        run: |
          python -m unittest discover -s research/evidencemotion-director -p 'test_autonomous_voice_signal_audit.py' -v
          python -m py_compile research/evidencemotion-director/autonomous_voice_signal_audit.py
      - name: Preserve research and speech-recognition boundaries
        if: always()
        run: |
          echo 'Actual AAC bytes decoded; measured signal/source integrity only. Synthetic speech-like samples are not real voices or real pronunciation judgements.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No ASR, specialist phoneme judge, naturalness proof, expert scientific review, or publication approvals were provided.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production freeze/24-of-46 checklist remain unchanged; no owner laptop or paid model required.' >> "$GITHUB_STEP_SUMMARY"
