name: Temporary Governed Enrichment Refresh

on:
  push:
    branches:
      - fix/enrichment-provenance-review-hardening-2026-08-25

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'Razzleberrytt/hippie-scientist-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enrichment-provenance-review-hardening-2026-08-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate governed enrichment artifact
        run: node scripts/enrichment/generate-governed-enrichment.mjs
      - name: Commit exact generated artifact when stale
        run: |
          if git diff --quiet -- public/data/enrichment-governed.json; then
            echo 'Governed enrichment artifact already fresh.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/enrichment-governed.json
          git commit -m 'chore(enrichment): refresh governed artifact'
          git push origin HEAD:fix/enrichment-provenance-review-hardening-2026-08-25
