name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'app/**'
      - 'components/**'
      - 'src/**'
      - 'lib/**'
      - 'public/**'
      - 'data/**'
      - 'content/**'
      - 'scripts/**'
      - 'styles/**'
      - 'types/**'
      - 'tests/**'
      - '**/__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'next.config.*'
      - 'next-env.d.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.lighthouserc*.json'
      - '**/*.xlsx'
      - '.github/workflows/lighthouse.yml'
  schedule:
    - cron: '41 10 * * 2'
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-lhci-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-lhci-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-lhci-

      - name: Install dependencies
        run: npm ci

      - name: Validate accessibility primitives
        run: |
          node scripts/ci/validate-accessibility-baseline.mjs
          npm run test:a11y

      - name: Audit client runtime and style surface
        run: |
          node scripts/ci/audit-client-runtime-size.mjs
          node scripts/ci/audit-css-component-surface.mjs

      - name: Build static export
        env:
          COMMIT_HASH: ${{ github.sha }}
        run: npm run build:deploy

      - name: Enforce bundle and data budgets
        run: node scripts/report-performance-budget.mjs

      - name: Audit third-party scripts and image stability
        run: node scripts/ci/audit-third-party-performance.mjs

      - name: Run Lighthouse performance and accessibility audits
        run: |
          npx serve@14 out -p 3000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done'

          PERF_STATUS=0
          A11Y_STATUS=0

          npx @lhci/cli@0.14 collect --config=.lighthouserc.json
          rm -rf .lighthouseci-performance
          cp -R .lighthouseci .lighthouseci-performance
          npx @lhci/cli@0.14 assert --config=.lighthouserc.json || PERF_STATUS=$?
          rm -rf .lighthouseci

          npx @lhci/cli@0.14 collect --config=.lighthouserc.a11y.json
          rm -rf .lighthouseci-accessibility
          cp -R .lighthouseci .lighthouseci-accessibility
          npx @lhci/cli@0.14 assert --config=.lighthouserc.a11y.json || A11Y_STATUS=$?
          rm -rf .lighthouseci

          # Accessibility is a gate; performance is a trend.
          #
          # The performance budgets are deliberately unchanged, but they are
          # asserted as warnings rather than errors. Measured on a shared
          # runner, they are not a reliable pass/fail signal: two runs of the
          # same commit reported total-blocking-time of 1992ms and 467ms on
          # `/`, a 4.3x spread. A check that red-lights on noise gets ignored,
          # and an ignored check hides the regressions it exists to catch.
          #
          # Accessibility is deterministic, currently passing, and stays a hard
          # failure -- as do the build-correctness assertions in the perf config
          # (unminified JS/CSS, unsized images), which cannot flake.
          if [ "$PERF_STATUS" -ne 0 ]; then
            echo "::notice title=Lighthouse performance::Budgets exceeded on this run. Reported as a trend, not a gate -- see the job summary and the uploaded report."
          fi

          if [ "$A11Y_STATUS" -ne 0 ]; then
            echo "Lighthouse accessibility assertions failed. Diagnostics were preserved for artifact upload."
            exit 1
          fi

      - name: Report Lighthouse trend
        if: always()
        run: node scripts/ci/report-lighthouse-trend.mjs --dir=.lighthouseci-performance

      - name: Monitor production cache behavior
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/monitor/production-cache-health.mjs

      - name: Upload performance and accessibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-results-${{ github.run_number }}
          path: |
            .lighthouseci-performance/
            .lighthouseci-accessibility/
            reports/third-party-performance.json
            reports/client-runtime-size.json
            reports/css-component-surface.json
            docs/performance/budgets-log.md
          retention-days: 30
          include-hidden-files: true

      - name: Add workflow summary
        if: always()
        run: |
          echo "## Performance & Accessibility Governance" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lighthouse performance target: ≥ 82 (tracked, not gated)" >> "$GITHUB_STEP_SUMMARY"
          echo "- CWV budgets, reported as a trend: LCP ≤ 2.5s, CLS ≤ 0.10, TBT ≤ 300ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hard accessibility gate: ≥ 90" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hard build-correctness gates: unminified JS/CSS, unsized images" >> "$GITHUB_STEP_SUMMARY"
          echo "- Client-boundary source budget: warn at 18KB, fail at 45KB" >> "$GITHUB_STEP_SUMMARY"
          echo "- Global CSS and likely-unused component surface is reported on every run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Weekly production cache monitor verifies explicit cache policy and immutable Next static assets" >> "$GITHUB_STEP_SUMMARY"
          echo "- Performance URLs: /, /herbs/ashwagandha/, /compounds/l-theanine/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Accessibility URLs: /, /goals/, /herbs/ashwagandha/, /compounds/l-theanine/, /guides/compare/, /safety-checker/, /evidence/evidence-checker/, /tools/botanical-activity-atlas/, /evidence/evidence-report/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
