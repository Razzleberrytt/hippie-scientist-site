name: EvidenceMotion decoded mobile UI research audit
on:
  pull_request:
    paths:
      - 'research/evidencemotion-director/phone_ui_audit.py'
      - 'research/evidencemotion-director/test_phone_ui_audit.py'
      - 'research/evidencemotion-director/PHONE-UI-AUDIT-2026-10-14.md'
      - '.github/workflows/evidencemotion-phone-ui-research.yml'
  push:
    branches: [main]
    paths:
      - 'research/evidencemotion-director/phone_ui_audit.py'
      - 'research/evidencemotion-director/test_phone_ui_audit.py'
      - 'research/evidencemotion-director/PHONE-UI-AUDIT-2026-10-14.md'
      - '.github/workflows/evidencemotion-phone-ui-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-decoded-frame-negative-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free FFmpeg tools and verify availability
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          command -v ffprobe
          command -v ffmpeg
          ffprobe -version | head -1
          ffmpeg -version | head -1
      - name: Run decoded-film and fail-closed research tests
        run: |
          python -m unittest discover -s research/evidencemotion-director -p test_phone_ui_audit.py -v
          python -m py_compile research/evidencemotion-director/phone_ui_audit.py
      - name: Document remaining limits
        if: always()
        run: |
          echo 'Research-only: synthetic actual 1080p 30fps decoded movie plus adversarial geometry tests.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Does not test original 7-OH video, real handset, muted comprehension, native source assets, science, phonetics, cinematic excellence or publication.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No checklist credit from test passing.' >> "$GITHUB_STEP_SUMMARY"
