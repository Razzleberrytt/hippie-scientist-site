name: Temporary validate BPC-157 application exact tree

on:
  push:
    branches:
      - fix/bpc157-human-evidence-apply

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR tree
        uses: actions/checkout@v7
        with:
          ref: 936e868824abd6a935ddd223fdfb307bdaf256b2
          fetch-depth: 1
      - name: Assert exact commit
        run: test "$(git rev-parse HEAD)" = "936e868824abd6a935ddd223fdfb307bdaf256b2"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --silent
      - name: Validate applied workbook patch
        run: node scripts/ci/validate-workbook-patches.mjs
      - name: Workbook roundtrip
        run: npm run workbook:roundtrip-test --silent
      - name: Fast repository contract
        run: npm run check:fast
      - name: Test suite
        run: npm test
      - name: Canonical data validation
        run: npm run data:validate
      - name: Source-of-truth guard
        run: npm run guard:source-of-truth
      - name: Evidence language validation
        run: npm run validate:evidence-language
      - name: Verify regenerated BPC-157 outputs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const expectedSummary = "BPC-157 is a synthetic 15-amino-acid peptide studied mainly in animal models for tissue repair and inflammation. FDA identified five small human clinical studies in its 2026 review, but the evidence is short-duration, heterogeneous, and insufficient to establish clinical efficacy or long-term safety; BPC-157 is not FDA-approved."
          const expectedDescription = "BPC-157 (Body Protection Compound-157) is a synthetic peptide derived from a partial sequence found in human gastric juice and widely discussed for tendon, ligament, gut-lining, and recovery claims. Preclinical rodent and in vitro studies dominate the evidence base. FDA's 2026 review identified five human clinical studies, including two older rectal-enema studies and three very small modern reports; these data document human exposure but do not establish replicated clinical efficacy, an approved dosing strategy, or long-term safety. BPC-157 is not FDA-approved as a finished drug product."
          const detail = JSON.parse(fs.readFileSync('public/data/compounds-detail/bpc-157.json','utf8'))
          if (detail.summary !== expectedSummary) throw new Error('Regenerated detail summary mismatch')
          if (detail.description !== expectedDescription) throw new Error('Regenerated detail description mismatch')
          const stale = ['human clinical trial data is essentially absent','almost no controlled human trial data exists','pending a July 2026 PCAC review']
          const detailText = JSON.stringify(detail)
          for (const phrase of stale) if (detailText.includes(phrase)) throw new Error(`Stale detail phrase remains: ${phrase}`)
          const aiPath = 'public/data/ai-entities/compound/bpc-157.json'
          if (fs.existsSync(aiPath)) {
            const aiText = fs.readFileSync(aiPath,'utf8')
            for (const phrase of stale) if (aiText.includes(phrase)) throw new Error(`Stale AI-entity phrase remains after regeneration: ${phrase}`)
          }
          console.log('BPC-157 regenerated output contract PASS')
          NODE
      - name: Build deploy artifact
        run: npm run build:deploy
