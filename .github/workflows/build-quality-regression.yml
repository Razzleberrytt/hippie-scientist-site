name: Build quality regression

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      recovery_pr_number:
        description: PR number for exact-head recovery validation
        required: true
        type: string
      recovery_base_ref:
        description: Exact target base branch name
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  compare-generated-quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Compare generated quality with base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_REF: ${{ github.base_ref || inputs.recovery_base_ref }}
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch without losing merge history
        run: |
          test -n "$BASE_REF"
          git fetch origin "$BASE_REF"
          git merge-base "origin/$BASE_REF" HEAD >/dev/null

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies once
        run: npm ci

      - name: Resolve PR body
        id: pr-context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          RECOVERY_PR_NUMBER: ${{ inputs.recovery_pr_number }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            body="$(gh api "repos/${{ github.repository }}/pulls/$RECOVERY_PR_NUMBER" --jq '.body // ""')"
          else
            body="$EVENT_BODY"
          fi
          {
            echo 'body<<EOF'
            printf '%s\n' "$body"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Extract major automated change explanation
        id: explanation
        env:
          PR_BODY: ${{ steps.pr-context.outputs.body }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const body = process.env.PR_BODY || ''
          const headingPattern = /^##\s+Major automated change explanation\s*$/im
          const match = headingPattern.exec(body)
          let reason = ''
          if (match) {
            const remainder = body.slice(match.index + match[0].length)
            const nextHeading = remainder.search(/^##\s+/m)
            reason = (nextHeading >= 0 ? remainder.slice(0, nextHeading) : remainder).trim()
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `reason<<EOF\n${reason}\nEOF\n`)
          NODE

      - name: Compare build-quality signals
        env:
          QUALITY_CHANGE_REASON: ${{ steps.explanation.outputs.reason }}
        run: node scripts/ci/compare-build-quality.mjs --base="origin/$BASE_REF" --require-base

      - name: Regenerate and compare internal-link graphs
        run: node scripts/ci/compare-internal-link-quality.mjs --base="origin/$BASE_REF" --strict

      - name: Upload human-readable quality diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-quality-diff-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            public/data/reports/build-quality-diff.md
            public/data/reports/build-quality-diff.json
            public/data/reports/internal-link-quality-diff.md
            public/data/reports/internal-link-quality-diff.json
