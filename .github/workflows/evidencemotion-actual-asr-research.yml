name: EvidenceMotion actual 7-OH word-ASR research
on:
  pull_request:
    paths:
      - 'research/evidencemotion-director/autonomous_script_asr_research.py'
      - 'research/evidencemotion-director/test_autonomous_script_asr_research.py'
      - 'research/evidencemotion-director/mfa_acoustic_alignment.py'
      - 'research/evidencemotion-director/test_mfa_acoustic_alignment.py'
      - 'research/evidencemotion-director/exact_wav_alignment.py'
      - 'research/evidencemotion-director/narration_locked_treatments.py'
      - 'research/evidencemotion-director/test_narration_locked_treatments.py'
      - 'research/evidencemotion-director/verified_molecular_comparison.py'
      - 'research/evidencemotion-director/test_verified_molecular_comparison.py'
      - 'research/evidencemotion-director/editorial_2d_cpu_research.py'
      - 'research/evidencemotion-director/validated_7oh_chemistry.py'
      - 'research/evidencemotion-director/phone_ui_audit.py'
      - 'research/evidencemotion-director/native_master_audit.py'
      - 'research/evidencemotion-director/native_autocritic.py'
      - 'research/evidencemotion-director/test_native_autocritic.py'
      - 'research/evidencemotion-director/narrated_claim_screen.py'
      - 'research/evidencemotion-director/muted_review_research.py'
      - 'research/evidencemotion-director/test_muted_review_research.py'
      - 'research/evidencemotion-director/objective_muted_score.py'
      - 'research/evidencemotion-director/test_objective_muted_score.py'
      - 'research/evidencemotion-director/test_narrated_claim_screen.py'
      - 'research/evidencemotion-director/ASR-SOURCE-LOCK-2026-10-13.md'
      - 'research/evidencemotion-director/COMPLETION-CHECKLIST.md'
      - '.github/workflows/evidencemotion-actual-asr-research.yml'
permissions:
  contents: read
  actions: read
jobs:
  actual-original-wav-acoustic-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ths-mfa-cpu
          create-args: >-
            python=3.11 montreal-forced-aligner=3.3.8
            kaldi=*=cpu* pytorch=*=cpu*
          cache-environment: true
      - name: Restore original WAV, brief and immutable official MFA model bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ths-mfa/source" "$RUNNER_TEMP/ths-mfa/models"
          gh run download 38417454106 --repo "$GITHUB_REPOSITORY" --name ths-kokoro-narration --dir "$RUNNER_TEMP/ths-mfa/source"
          cd "$RUNNER_TEMP/ths-mfa/models"
          curl --fail --location --retry 2 -o english_us_arpa.dict https://github.com/MontrealCorpusTools/mfa-models/releases/download/dictionary-english_us_arpa-v3.0.0/english_us_arpa.dict
          curl --fail --location --retry 2 -o acoustic.zip https://github.com/MontrealCorpusTools/mfa-models/releases/download/acoustic-english_us_arpa-v3.0.0/english_us_arpa.zip
          curl --fail --location --retry 2 -o g2p.zip https://github.com/MontrealCorpusTools/mfa-models/releases/download/g2p-english_us_arpa-v2.0.0/english_us_arpa.zip
      - name: Execute actual CPU acoustic alignment and preserve all 73 original words
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          WAV=$(find "$RUNNER_TEMP/ths-mfa/source" -name narration.wav -type f)
          BRIEF=$(find "$RUNNER_TEMP/ths-mfa/source" -name r805-creative-brief.json -type f)
          python research/evidencemotion-director/mfa_acoustic_alignment.py \
            --wav "$WAV" --brief "$BRIEF" \
            --dictionary "$RUNNER_TEMP/ths-mfa/models/english_us_arpa.dict" \
            --acoustic-model "$RUNNER_TEMP/ths-mfa/models/acoustic.zip" \
            --g2p-model "$RUNNER_TEMP/ths-mfa/models/g2p.zip" \
            --out "$RUNNER_TEMP/ths-mfa/result"
      - name: Render two previews and repaired native research candidate on CPU
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install 'rdkit==2025.9.4' 'pillow==12.0.0'
          python -m unittest discover -s research/evidencemotion-director -p test_narration_locked_treatments.py -v
          python -m unittest discover -s research/evidencemotion-director -p test_native_autocritic.py -v
          python -m unittest discover -s research/evidencemotion-director -p test_narrated_claim_screen.py -v
          python -m unittest discover -s research/evidencemotion-director -p test_muted_review_research.py -v
          python -m unittest discover -s research/evidencemotion-director -p test_objective_muted_score.py -v
          for treatment in atlas specimen; do
            python research/evidencemotion-director/narration_locked_treatments.py \
              --alignment-root "$RUNNER_TEMP/ths-mfa/result" \
              --font-dir /usr/share/fonts/truetype/dejavu --treatment "$treatment" \
              --out "$RUNNER_TEMP/ths-mfa/$treatment"
          done
          python research/evidencemotion-director/narration_locked_treatments.py \
            --alignment-root "$RUNNER_TEMP/ths-mfa/result" \
            --font-dir /usr/share/fonts/truetype/dejavu --treatment specimen --native \
            --out "$RUNNER_TEMP/ths-mfa/specimen-native"
      - name: Screen actual native movie against frozen spoken script and emitted scientific text
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python research/evidencemotion-director/narrated_claim_screen.py \
            --movie "$RUNNER_TEMP/ths-mfa/specimen-native/specimen_NEW_RESEARCH_CANDIDATE.mp4" \
            --wav "$RUNNER_TEMP/ths-mfa/result/original.wav" \
            --receipt "$RUNNER_TEMP/ths-mfa/specimen-native/render-receipt.json" \
            --phone-plan "$RUNNER_TEMP/ths-mfa/specimen-native/phone-ui-plan.json" \
            --out "$RUNNER_TEMP/ths-mfa/specimen-native/claim-screen.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ths-mfa/specimen-native/claim-screen.json'
          result=json.loads(p.read_text())
          assert result['status']=='MECHANICAL_SOURCE_CAPTION_SCREEN_PASS_INDEPENDENT_REVIEW_REQUIRED'
          assert result['narratedScenesInspected']==7
          assert result['emittedShotIntervalsInspected']>=8
          assert len(result['reviewRows'])==7
          assert not result['independentScientificReviewApproved']
          assert not result['emittedWordsProvenAudible']
          assert not result['mayPublish']
          print('Emitted text/source identities checked on exact native media; independent reviews remain HOLD')
          PY
      - name: Fully decode previews and native candidate, verify narration integrity
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys,json,subprocess
          from pathlib import Path
          sys.path.insert(0,'research/evidencemotion-director')
          from native_master_audit import verify,audio_hash
          from autonomous_voice_signal_audit import analyze
          from narration_locked_treatments import AUDIO_FILTER,sha,WAV_SHA
          from native_autocritic import analyze_video
          root=Path(os.environ['RUNNER_TEMP'])/'ths-mfa'
          reference=root/'reference.m4a'
          subprocess.run(['ffmpeg','-v','error','-i',str(root/'result/original.wav'),'-af',AUDIO_FILTER,'-c:a','aac','-b:a','192k',str(reference)],check=True)
          expected_audio=audio_hash(reference)
          for treatment in ('atlas','specimen','specimen-native'):
              target=root/treatment
              receipt=json.loads((target/'render-receipt.json').read_text())
              video=target/(receipt['treatment']+'_NEW_RESEARCH_CANDIDATE.mp4')
              digest=sha(video)
              width,height=receipt['resolution']
              technical=verify(video,reference,digest,expected_audio,1031,width=width,height=height)
              signal=analyze(root/'result/original.wav',video,WAV_SHA,digest)
              (target/'decoded-technical.json').write_text(json.dumps(technical,indent=2)+'\n')
              (target/'decoded-signal.json').write_text(json.dumps(signal,indent=2)+'\n')
              assert technical['technical']=='PASS',technical
              assert not signal['issues'],signal
              assert signal['bestRelativeLagMs']==0,signal
              assert signal['masteredClippedSampleFraction']==0,signal
              if treatment=='specimen-native':
                  critic=analyze_video(video,digest)
                  (target/'negative-critic.json').write_text(json.dumps(critic,indent=2)+'\n')
                  assert critic['actualVideoSha256']==digest and critic['samples']>=4,critic
                  assert critic['schemaVersion']=='ths-autonomous-film-critic-research-v1',critic
                  expected='AUTO_REVISE' if critic['issues'] else 'AWAIT_MULTIMODAL_SCIENCE_VOICE_CRAFT_EVIDENCE'
                  assert critic['decision']==expected,critic
                  assert critic['mayPublish'] is False and critic['automaticallyApprovedPremiumCraft'] is False
                  print('Actual native negative screening:',critic['decision'],critic['issues'])
              print(treatment,'1031 decoded frames, fixed timestamps, unchanged AAC reference, original voice retained')
          PY
      - name: Generate actual muted teaching review packet without inventing audience scores
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python research/evidencemotion-director/muted_review_research.py \
            --movie "$RUNNER_TEMP/ths-mfa/specimen-native/specimen_NEW_RESEARCH_CANDIDATE.mp4" \
            --manifest "$RUNNER_TEMP/ths-mfa/specimen-native/phone-ui-plan.json" \
            --receipt "$RUNNER_TEMP/ths-mfa/specimen-native/render-receipt.json" \
            --claim "$RUNNER_TEMP/ths-mfa/specimen-native/claim-screen.json" \
            --out "$RUNNER_TEMP/ths-mfa/specimen-native/muted-review"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ths-mfa/specimen-native/muted-review/packet-receipt.json'
          r=json.loads(p.read_text())
          assert r['result']=='REVIEW_PACK_GENERATED_NO_AUDIENCE_COMPREHENSION_PASS'
          assert r['imageBitstreamUnchangedByMuting'] is True
          assert r['soundOffHasZeroAudioTracks'] is True
          assert r['questions']==5
          assert len(r['actualMuteFrames'])==12
          assert r['actualAudienceResponsesReceived']==0
          assert r['independentlyCalibratedViewerComprehensionVerified'] is False
          assert r['mayPublish'] is False
          print('Review packet made from exact muted actual MP4; audience test remains HOLD.')
          PY
      - name: Independently score exact sound-off teaching evidence with a fail-closed cap
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python research/evidencemotion-director/objective_muted_score.py \
            --movie "$RUNNER_TEMP/ths-mfa/specimen-native/specimen_NEW_RESEARCH_CANDIDATE.mp4" \
            --manifest "$RUNNER_TEMP/ths-mfa/specimen-native/phone-ui-plan.json" \
            --receipt "$RUNNER_TEMP/ths-mfa/specimen-native/render-receipt.json" \
            --claim "$RUNNER_TEMP/ths-mfa/specimen-native/claim-screen.json" \
            --silent-movie "$RUNNER_TEMP/ths-mfa/specimen-native/muted-review/film-sound-off.mp4" \
            --out "$RUNNER_TEMP/ths-mfa/specimen-native/muted-review/objective-score.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ths-mfa/specimen-native/muted-review/objective-score.json'
          v=json.loads(p.read_text())
          assert v['overallChecklistCompleted']==26
          assert v['baseEvidencePercent']==80
          assert 80 <= v['currentStepObjectiveProgressPercent'] <= 90
          assert v['microChecksTotal']==10
          assert v['automaticScoreCeilingPercent']==90
          assert not v['actualUnfamiliarViewerComprehensionVerified']
          assert v['humanAudienceResponsesObserved']==0
          assert not v['mayPublish']
          print('Evidence-scored working milestone:',
                v['currentStepObjectiveProgressPercent'],'percent,',
                v['microChecksPassed'],'of 10 objective mute proxies; no audience result claimed')
          PY
      - name: Preserve actual timing evidence without source audio or model copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencemotion-original-wav-mfa-acoustic-candidate
          path: |
            ${{ runner.temp }}/ths-mfa/result/aligned.TextGrid
            ${{ runner.temp }}/ths-mfa/result/alignment*.json
            ${{ runner.temp }}/ths-mfa/result/alignment.dict
            ${{ runner.temp }}/ths-mfa/result/script.txt
            ${{ runner.temp }}/ths-mfa/result/mfa-run-receipt.json
            ${{ runner.temp }}/ths-mfa/result/*.log
            ${{ runner.temp }}/ths-mfa/atlas/*
            ${{ runner.temp }}/ths-mfa/specimen/*
            ${{ runner.temp }}/ths-mfa/specimen-native/**
          retention-days: 14
          if-no-files-found: error
      - name: Keep acoustic execution separate from pronunciation and quality approval
        if: always()
        run: |
          echo 'MFA aligns the pinned original WAV on CPU. G2P chemical-term phones are unverified candidates.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No calibrated pronunciation, scientific/craft/device or publication approval follows from this job.' >> "$GITHUB_STEP_SUMMARY"
  strict-script-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail closed on changed source claims and scripted aliases
        run: |
          python -m unittest discover -s research/evidencemotion-director -p 'test_autonomous_script_asr_research.py' -v
          python -m py_compile research/evidencemotion-director/autonomous_script_asr_research.py
  actual-original-audio-asr-cpu:
    needs: strict-script-compare
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact original narration from successful same-repo GitHub run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ths-7oh-asr/voice"
          gh run download 38417454106 --repo "$GITHUB_REPOSITORY" \
            --name ths-kokoro-narration \
            --dir "$RUNNER_TEMP/ths-7oh-asr/voice"
          find "$RUNNER_TEMP/ths-7oh-asr/voice" -type f -maxdepth 3 -print
          WAV="$(find "$RUNNER_TEMP/ths-7oh-asr/voice" -type f -name '*.wav' | head -n 1)"
          test -n "$WAV"
          test "$(sha256sum "$WAV" | cut -d' ' -f1)" = '9dca049ee2d4c827b1283e4816fd6047187f39449de0441fea420b036f959435'
          cp "$WAV" "$RUNNER_TEMP/ths-7oh-asr/original.wav"
      - name: Install CPU-only pinned open-source ASR runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install 'faster-whisper==1.2.1' 'huggingface_hub==0.34.4'
          ffmpeg -hide_banner -version | head -1
      - name: Transcribe exact original WAV, record immutable model commit and word timestamps
        shell: bash
        run: |
          set -euo pipefail
          python research/evidencemotion-director/autonomous_script_asr_research.py \
            --wav "$RUNNER_TEMP/ths-7oh-asr/original.wav" \
            --out "$RUNNER_TEMP/ths-7oh-asr/asr-research-receipt.json"
          python - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'ths-7oh-asr','asr-research-receipt.json')
          r=json.load(open(p))
          assert r['origin']=='ACTUAL_PINNED_WAV_DECODED_ASR_CPU'
          assert r['sourceWavSha256']=='9dca049ee2d4c827b1283e4816fd6047187f39449de0441fea420b036f959435'
          assert r['speechRecognizer']['revisionSha'] and len(r['speechRecognizer']['revisionSha'])==40
          assert r['speechRecognizer']['modelBinarySha256']
          assert r['phoneticPronunciationVerified'] is False and r['mayPublish'] is False
          print('ACTUAL_RESEARCH_ASR_EXECUTED, script decision:',r['decision'])
          PY
      - name: Preserve audit-only receipt (not source audio)
        uses: actions/upload-artifact@v4
        with:
          name: evidencemotion-source-locked-7oh-asr-word-intervals
          path: ${{ runner.temp }}/ths-7oh-asr/asr-research-receipt.json
          retention-days: 5
          if-no-files-found: error
      - name: Explain scientific and quality limits
        if: always()
        run: |
          echo 'The actual original 7-OH WAV was pinned by SHA; no user laptop or paid inference service used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Recognized words and timestamps are an ASR estimate, NOT a verified phoneme/stress/naturalness rating.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A script-match candidate cannot grant clinical, craft or publishing approval, and no 46-point checklist tick is automatic.' >> "$GITHUB_STEP_SUMMARY"
