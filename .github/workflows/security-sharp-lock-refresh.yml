name: One-shot Sharp security lock refresh

on:
  push:
    branches:
      - secondary/security-audit-high-fixes

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: secondary/security-audit-high-fixes
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the direct safe Sharp version everywhere
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.overrides = { ...(pkg.overrides || {}) }
          delete pkg.overrides.next
          pkg.overrides.sharp = '$sharp'
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Record audit result
        run: npm audit --json > npm-audit.after.json || true

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/security-sharp-lock-refresh.yml
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deduplicate Next onto patched Sharp"
          git push origin HEAD:secondary/security-audit-high-fixes
