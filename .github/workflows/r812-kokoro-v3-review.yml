name: EvidenceMotion natural-length Kokoro radio edit
on:
  pull_request:
    paths:
      - '.github/workflows/r812-kokoro-v3-review.yml'
      - 'scripts/distribution/r812-mitragynine-review-voice.py'
      - 'scripts/distribution/r812-owner-locked-mfa-candidate.py'
      - 'scripts/distribution/test_r812_owner_locked_mfa_candidate.py'
      - 'scripts/distribution/r812-pronunciation-probe.py'
      - 'scripts/distribution/voice-pronunciations.json'
      - 'scripts/distribution/voice_pronunciation.py'
      - 'scripts/distribution/voice-vault.py'
      - 'scripts/distribution/requirements-local-voice.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-original-house-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      THS_VOICE_VAULT: ${{ github.workspace }}/.cache/ths-original-voice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore and independently verify immutable original Kokoro assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$THS_VOICE_VAULT"
          gh release download ths-kokoro-onnx-am-michael-int8-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$THS_VOICE_VAULT"
          python scripts/distribution/voice-vault.py verify "$THS_VOICE_VAULT"
      - name: Install exact local Kokoro runtime (no hosted speech services)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python -m pip install -r scripts/distribution/requirements-local-voice.txt
          python -m pip install 'numpy<3' 'scipy<2' 'soundfile==0.14.0'
          python -m pip check
          python - <<'PY'
          import onnxruntime as ort
          assert ort.__version__ == '1.31.0', f'Unverified narrator CPU backend: {ort.__version__}'
          print('Original pinned narrator ONNX Runtime backend:', ort.__version__)
          PY
      - name: Lock naturally timed V3 radio edit with authentic am_michael
        run: python scripts/distribution/r812-mitragynine-review-voice.py artifacts/r812
      - name: Render native-versus-continuous pronunciation audition clips
        run: python scripts/distribution/r812-pronunciation-probe.py artifacts/r812/mitragynine-probe
      - name: Check actual WAV duration, immutable voice and no fixed-picture timing
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration:stream=codec_name,sample_rate \
            -of json artifacts/r812/r812-mitragynine-authentic-voice-REVIEW.wav
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('artifacts/r812')
          rec=json.loads((root/'r812-mitragynine-authentic-voice-REVIEW.receipt.json').read_text())
          wav=root/'r812-mitragynine-authentic-voice-REVIEW.wav'
          assert rec['narrationWavSha256']==hashlib.sha256(wav.read_bytes()).hexdigest()
          assert rec['modelSha256']=='ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c'
          assert rec['voicebankSha256']=='bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d'
          assert rec['voice']=='am_michael' and rec['wordLevelAlignmentCertified'] is False
          assert rec['humanAuditoryReview']=='pending'
          assert rec['sceneTiming']=='natural-voice-locked-radio-edit; picture must be recut'
          assert rec['timeStretchApplied'] is False and rec['originalDurationPreserved'] is True
          assert all(c['timeStretchApplied'] is False for c in rec['clips'])
          from wave import open as open_wav
          with open_wav(str(wav),'rb') as f:
              audio_duration=f.getnframes()/f.getframerate()
          assert abs(audio_duration-rec['durationSeconds']) < .001
          assert rec['releaseAuthority']=='draft-only-not-for-publication'
          print(f'AUDIO FIRST: locked natural {audio_duration:.2f}s WAV. Old 43s picture timing obsolete.')
          print('NOT phone-, craft-, science-, or final-video approval.')
          PY
      - name: Export human-review-only WAV and its exact provenance
        uses: actions/upload-artifact@v4
        with:
          name: r812-mitragynine-original-kokoro-review-wav
          if-no-files-found: error
          retention-days: 30
          path: artifacts/r812/*

  # Normal CI intentionally skips draft PRs. Run one exact-head static-export
  # proof for THIS narrator repair while it remains review-only; when the PR
  # becomes non-draft, regular CI owns full validation and this job skips.
  # This job cannot promote a video, lift human review HOLD or merge the PR.
  draft-exact-head-build-proof:
    name: Draft exact-head production build and output
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact PR head (never a stale merge ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Confirm exact source commit
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Node using repository version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked production dependencies
        run: npm ci --no-audit --fund=false
      - name: Verify Node engine
        run: npm run check:node
      - name: Build the real static production export
        env:
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
          AMAZON_AFFILIATE_TAG: ${{ vars.AMAZON_AFFILIATE_TAG }}
          SKIP_NEXT_BUILD_TYPECHECK: '1'
        run: npm run build:deploy
      - name: Validate built production output
        run: npm run verify:output
      - name: Explicitly retain publication hold
        run: |
          echo "Draft exact-head site build only. Human narration review, independent science/craft and final MP4 publication gates remain HOLD." >> "$GITHUB_STEP_SUMMARY"

  owner-locked-original-wav-mfa-research:
    name: Owner-approved original WAV offline MFA candidate (REVIEW ONLY)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_ROOT: ${{ runner.temp }}/em-r812-owner/source
      MODEL_ROOT: ${{ runner.temp }}/em-r812-owner/models
      OUT_ROOT: ${{ runner.temp }}/em-r812-owner/candidate
      THS_R812_SOURCE_DIR: ${{ runner.temp }}/em-r812-owner/source
    steps:
      - name: Checkout exact PR head, never a stale generated merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact head identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ths-r812-owner-mfa-cpu
          create-args: >-
            python=3.11 montreal-forced-aligner=3.3.8
            kaldi=*=cpu* pytorch=*=cpu*
          cache-environment: true
      - name: Restore ONLY owner-approved exact existing GitHub original WAV
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SOURCE_ROOT" "$MODEL_ROOT"
          if ! gh run download 39525077773 --repo "$GITHUB_REPOSITORY" \
             --name r812-mitragynine-original-kokoro-review-wav --dir "$SOURCE_ROOT" \
             >"$RUNNER_TEMP/r812-source-download.log" 2>&1; then
            echo "::error::Pinned original source artifact unavailable. Remain REVIEW HOLD; no substitute narration."
            rm -f "$RUNNER_TEMP/r812-source-download.log"
            exit 2
          fi
          rm -f "$RUNNER_TEMP/r812-source-download.log"
          test "$(sha256sum "$SOURCE_ROOT/r812-mitragynine-authentic-voice-REVIEW.wav" | cut -d' ' -f1)" = \
            '82e94ea07dd28cd16ab86e0bd6b14c57dade0391583d31f03f36578813c7f6a1'
      - name: Fetch and verify official pinned MFA CPU model files
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -o "$MODEL_ROOT/english_us_arpa.dict" \
            https://github.com/MontrealCorpusTools/mfa-models/releases/download/dictionary-english_us_arpa-v3.0.0/english_us_arpa.dict
          curl -fsSL --retry 2 -o "$MODEL_ROOT/acoustic.zip" \
            https://github.com/MontrealCorpusTools/mfa-models/releases/download/acoustic-english_us_arpa-v3.0.0/english_us_arpa.zip
          curl -fsSL --retry 2 -o "$MODEL_ROOT/g2p.zip" \
            https://github.com/MontrealCorpusTools/mfa-models/releases/download/g2p-english_us_arpa-v2.0.0/english_us_arpa.zip
          echo 'e8c6c7b036ae2b7c78d2768b8dc6b1f9359175b842956d00b48c53c9c332e6b0  '"$MODEL_ROOT/english_us_arpa.dict" | sha256sum --check --status
          echo 'd35ce271ded357d833d2f4b8d1041dc3748b9538567ba13f2c697f4e4126711b  '"$MODEL_ROOT/acoustic.zip" | sha256sum --check --status
          echo 'f079ae88f792458fa7c123b256e5b86cc55c29ac2ffc457c673e6c60c36cd143  '"$MODEL_ROOT/g2p.zip" | sha256sum --check --status
      - name: Run exact-WAV negative tests against the authentic source
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/distribution -p 'test_r812_owner_locked_mfa_candidate.py' -v
          python -m unittest discover -s research/evidencemotion-director -p 'test_exact_wav_alignment.py' -v
      - name: Execute actual pinned CPU MFA, preserve owner-selected SHA
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          python scripts/distribution/r812-owner-locked-mfa-candidate.py \
            --source-dir "$SOURCE_ROOT" \
            --dictionary "$MODEL_ROOT/english_us_arpa.dict" \
            --acoustic-model "$MODEL_ROOT/acoustic.zip" \
            --g2p-model "$MODEL_ROOT/g2p.zip" \
            --out "$OUT_ROOT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['OUT_ROOT'])/'owner-locked-word-candidate.json').read_text())
          assert r['originalWavSha256']=='82e94ea07dd28cd16ab86e0bd6b14c57dade0391583d31f03f36578813c7f6a1'
          assert r['originalWavFrames']==938368 and r['sceneCount']==10 and r['alignedWordCount']>30
          assert r['mfaActuallyExecuted'] is True and r['mayPublish'] is False
          assert r['wordTimingCalibrated'] is False and r['humanWordTimingReviewed'] is False
          print('ACTUAL_PINNED_OWNER_WAV_MFA_CANDIDATE_REVIEW_HOLD',r['alignedWordCount'])
          PY
      - name: Preserve word-review evidence only, not source WAV or release authority
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r812-owner-locked-acoustic-word-candidates-REVIEW-ONLY
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/em-r812-owner/candidate/owner-locked-word-candidate.json
            ${{ runner.temp }}/em-r812-owner/candidate/*-candidate.json
            ${{ runner.temp }}/em-r812-owner/candidate/stage/*.TextGrid
      - name: Explicitly prohibit promotion from MFA candidate to video approval
        if: always()
        run: |
          echo 'Owner approved original WAV only. MFA word hypotheses are still uncalibrated; independent science/craft/phone, video and publication remain HOLD.' >> "$GITHUB_STEP_SUMMARY"
