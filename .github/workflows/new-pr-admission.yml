name: New PR admission

# Trusted main-branch controller code only. Never checkout or execute PR head.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  pre-pr-admission:
    name: pre-pr-admission
    # Grandfather the existing 2026-10-23 backlog; apply to new PRs only.
    if: ${{ github.event.pull_request.number > 6956 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted main policy, not PR changes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reject duplicate or competing implementation PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          node .agents/skills/pr-admission-preflight.mjs --repo "$GITHUB_REPOSITORY" --from-pr "$PR_NUMBER"

      - name: Admission check is not publication approval
        if: always()
        run: echo "Admission governs PR concurrency only; normal source, security, CI, independent review, serialized merge and production proof remain mandatory."
