name: Cobalamin Closure Bootstrap

on:
  push:
    branches:
      - 'manual/cobalamin-closure-5703-2026-09-25'
    paths:
      - '.github/workflows/cobalamin-closure-bootstrap.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove staged-owner clean-checkout regression
        run: npx vitest run scripts/enrichment-pipeline/__tests__/enrichment-full-clean-checkout.test.mjs

      - name: Regenerate canonical prerequisite reports
        run: |
          set -euo pipefail
          npx tsx scripts/report-enrichment-health.ts
          npx tsx scripts/report-enrichment-backlog.ts
          npx tsx scripts/report-enrichment-review-cycle.ts
          npx tsx scripts/report-enrichment-workpacks.ts
          npx tsx scripts/report-source-gaps.ts
          npx tsx scripts/report-source-intake-queue.ts

      - name: Baseline source-candidate review
        run: |
          npx tsx scripts/report-source-candidate-review.ts
          node -e "const r=require('./ops/reports/source-candidate-review.json'); console.log(JSON.stringify(r.summary))"

      - name: Assert cobalamin candidate preview
        run: |
          node <<'NODE'
          const r = require('./ops/reports/source-candidate-review.json')
          const ids = new Set([
            'cand_cobalamin-33809274',
            'cand_cobalamin-22221769',
            'cand_cobalamin-37046885',
            'cand_cobalamin-42227307',
            'cand_cobalamin-39655146',
          ])
          const assessments = (r.assessments || []).filter(row => ids.has(row.candidateSourceId))
          const insertions = (r.promotionPreview?.registryInsertions || []).filter(row =>
            ['33809274','22221769','37046885','42227307','39655146'].includes(row.pmid)
          )
          console.log('=== COBALAMIN_CANDIDATE_PREVIEW ===')
          console.log(JSON.stringify({ assessments, insertions }, null, 2))
          if (assessments.length !== 5) throw new Error(`Expected 5 cobalamin candidate assessments, found ${assessments.length}`)
          if (insertions.length !== 5) throw new Error(`Expected 5 cobalamin preview insertions, found ${insertions.length}`)
          for (const row of insertions) {
            if (row.sourceId !== `src_pubmed-${row.pmid}`) {
              throw new Error(`Non-canonical cobalamin PubMed source identity: ${row.sourceId}`)
            }
          }
          NODE

      - name: Dry-run governed cobalamin source wave
        run: |
          set -euo pipefail
          before_candidates="$(sha256sum ops/source-candidates.json | cut -d' ' -f1)"
          before_registry="$(sha256sum public/data/source-registry.json | cut -d' ' -f1)"
          node scripts/run-enrichment-wave.mjs \
            --wave-id cobalamin-closure \
            --targets ops/targets/cobalamin-closure-5703.json \
            --mode source-review \
            --dry-run
          after_candidates="$(sha256sum ops/source-candidates.json | cut -d' ' -f1)"
          after_registry="$(sha256sum public/data/source-registry.json | cut -d' ' -f1)"
          test "$before_candidates" = "$after_candidates"
          test "$before_registry" = "$after_registry"
          node <<'NODE'
          const r = require('./ops/reports/enrichment-wave-runner-cobalamin-closure-summary.json')
          console.log('=== COBALAMIN_WAVE_DRY_RUN ===')
          console.log(JSON.stringify(r.execution, null, 2))
          if (r.execution?.stagedInputs?.selectedTargetCount !== 1) {
            throw new Error('Expected exactly one cobalamin target in dry-run.')
          }
          if (r.execution?.stagedInputs?.stagedCandidateCount !== 5) {
            throw new Error(`Expected exactly five cobalamin source candidates, found ${r.execution?.stagedInputs?.stagedCandidateCount}`)
          }
          NODE

      - name: Print compact cobalamin intake and gap context
        run: |
          node <<'NODE'
          const fs = require('fs')
          const health = JSON.parse(fs.readFileSync('ops/reports/enrichment-health.json', 'utf8'))
          const workpacks = JSON.parse(fs.readFileSync('ops/reports/enrichment-workpacks.json', 'utf8'))
          const gaps = JSON.parse(fs.readFileSync('ops/reports/source-gaps.json', 'utf8'))
          const intake = JSON.parse(fs.readFileSync('ops/reports/source-intake-queue.json', 'utf8'))

          const entity = (health.entities || []).find(row =>
            row.entityType === 'compound' && row.entitySlug === 'cobalamin'
          )
          const workpack = (workpacks.workpacks || []).find(row => row.workpackId === 'wp_compound_cobalamin')
          const cobalaminGaps = (gaps.gapItems || []).filter(row =>
            row.entitySlug === 'cobalamin' ||
            (row.relatedWorkpackIds || []).includes('wp_compound_cobalamin')
          )
          const cobalaminTasks = (intake.tasks || []).filter(row =>
            row.entitySlug === 'cobalamin' ||
            (row.relatedWorkpackIds || []).includes('wp_compound_cobalamin')
          )

          console.log('=== COBALAMIN_COMPACT ===')
          console.log(JSON.stringify({
            totalHealthEntities: (health.entities || []).length,
            totalWorkpacks: (workpacks.workpacks || []).length,
            totalIntakeTasks: (intake.tasks || []).length,
            entity,
            workpack,
            gaps: cobalaminGaps,
            tasks: cobalaminTasks,
          }, null, 2))

          if (!entity || !workpack || cobalaminTasks.length === 0) {
            throw new Error('Cobalamin did not reach the governed source-intake queue.')
          }
          NODE

      - name: Validate generated intake report exists
        run: test -s ops/reports/source-intake-queue.json
