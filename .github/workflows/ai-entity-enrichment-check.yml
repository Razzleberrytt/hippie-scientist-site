name: AI search quality check

on:
  pull_request:
    paths:
      - 'app/articles/**'
      - 'app/learn/rhabdomyolysis/page.tsx'
      - 'app/guides/other/prebiotics/page.tsx'
      - 'app/guides/other/greens-powders/page.tsx'
      - 'app/guides/other/bovine-colostrum/page.tsx'
      - 'app/guides/other/electrolyte-supplements/page.tsx'
      - 'app/guides/other/collagen-supplements/page.tsx'
      - 'components/articles/GoalClusterArticlePage.tsx'
      - 'components/articles/MentalHealthArticlePage.tsx'
      - 'components/LegacyGuideQuickAnswer.tsx'
      - 'components/LegacyGuideReference.tsx'
      - 'components/References.tsx'
      - 'components/seo/**'
      - 'components/StructuredData.tsx'
      - 'components/compare/CompareSchema.tsx'
      - 'components/editorial/ProfileDecisionPanel.tsx'
      - 'components/editorial/ScientificVerdictCard.tsx'
      - 'components/ui/EvidenceScoreBadge.tsx'
      - 'components/ui/SafetyGaugeMeter.tsx'
      - 'src/components/editorial/LastUpdatedBadge.tsx'
      - 'src/components/evidence/WhatEvidenceShows.tsx'
      - 'src/lib/article-citation-metadata.ts'
      - 'src/lib/__tests__/article-citation-metadata.test.ts'
      - 'src/lib/schema-identities.ts'
      - 'src/lib/schema-injector.ts'
      - 'src/lib/__tests__/schema-injector.test.ts'
      - 'lib/structured-data.ts'
      - 'app/info/content-licensing/**'
      - 'public/llms.txt'
      - 'app/robots.ts'
      - 'lib/ai-citation-readiness.ts'
      - 'lib/research-quality-analysis.ts'
      - 'scripts/ci/audit-ai-*.mjs'
      - 'scripts/ci/audit-ai-*.ts'
      - 'scripts/data/ai-entity-artifacts.mjs'
      - 'scripts/data/ai-entity-enrichment-lib.mjs'
      - 'scripts/data/ai-entity-enrichment-smoke.mjs'
      - 'scripts/data/build-runtime-summary-indexes.mjs'
      - 'docs/ai-search-*.md'
      - 'docs/ai-citation-readiness-topology.md'
      - '.github/workflows/ai-entity-enrichment-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Run entity generator smoke test
        id: smoke
        continue-on-error: true
        shell: bash
        run: node scripts/data/ai-entity-enrichment-smoke.mjs > smoke-test.log 2>&1

      - name: Upload smoke test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-entity-smoke-log
          path: smoke-test.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after smoke test failure
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Guard legacy guide reference consolidation
        shell: bash
        run: |
          files=(
            app/guides/other/prebiotics/page.tsx
            app/guides/other/greens-powders/page.tsx
            app/guides/other/bovine-colostrum/page.tsx
            app/guides/other/electrolyte-supplements/page.tsx
            app/guides/other/collagen-supplements/page.tsx
          )
          for file in "${files[@]}"; do
            grep -Fq "import Ref from '@/components/LegacyGuideReference'" "$file" || {
              echo "$file must reuse LegacyGuideReference" >&2
              exit 1
            }
            if grep -Eq '^type RefProps|^function Ref\(' "$file"; then
              echo "$file reintroduced a local legacy reference renderer" >&2
              exit 1
            fi
          done

      - name: Run schema, article citation, discovery, and provenance tests
        run: >-
          npx vitest run
          src/lib/__tests__/article-citation-metadata.test.ts
          src/lib/__tests__/schema-injector.test.ts
          components/seo/__tests__/SchemaGraphScript.test.ts
          components/seo/__tests__/SchemaGraphScript.provenance.test.ts

      - name: Run canonical AI-search quality audit
        run: npm run audit:ai-citations

      - name: Lint AI-search implementation files
        run: >-
          npx eslint
          app/articles/[slug]/page.tsx
          app/learn/rhabdomyolysis/page.tsx
          components/articles/GoalClusterArticlePage.tsx
          components/articles/MentalHealthArticlePage.tsx
          components/LegacyGuideQuickAnswer.tsx
          components/LegacyGuideReference.tsx
          components/References.tsx
          components/StructuredData.tsx
          components/compare/CompareSchema.tsx
          components/seo/SchemaGraphScript.tsx
          components/seo/CitationReadySummary.tsx
          components/seo/AnswerEngineTable.tsx
          components/seo/AuthorityJsonLd.tsx
          components/seo/__tests__/SchemaGraphScript.test.ts
          components/seo/__tests__/SchemaGraphScript.provenance.test.ts
          components/editorial/ProfileDecisionPanel.tsx
          components/editorial/ScientificVerdictCard.tsx
          components/ui/EvidenceScoreBadge.tsx
          components/ui/SafetyGaugeMeter.tsx
          src/components/editorial/LastUpdatedBadge.tsx
          src/components/evidence/WhatEvidenceShows.tsx
          src/lib/article-citation-metadata.ts
          src/lib/__tests__/article-citation-metadata.test.ts
          src/lib/schema-identities.ts
          src/lib/schema-injector.ts
          src/lib/__tests__/schema-injector.test.ts
          lib/structured-data.ts
          scripts/data/ai-entity-artifacts.mjs
          scripts/data/ai-entity-enrichment-lib.mjs
          scripts/data/ai-entity-enrichment-smoke.mjs
          scripts/data/build-runtime-summary-indexes.mjs
          scripts/ci/audit-ai-entity-completeness.mjs
          scripts/ci/audit-ai-citation-readiness.mjs
          scripts/ci/audit-ai-answer-engine-readiness.mjs
          scripts/ci/audit-ai-claim-integrity.mjs
          scripts/ci/audit-ai-citation-topology.ts
          --max-warnings=0

      - name: Typecheck
        run: npm run typecheck
