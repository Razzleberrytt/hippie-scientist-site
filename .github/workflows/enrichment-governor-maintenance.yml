name: Enrichment Governor Maintenance

on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:

concurrency:
  group: enrichment-governor-persistent-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconcile governor state
        run: |
          set -euo pipefail
          node --test scripts/enrichment-governor/__tests__/*.test.mjs
          node scripts/enrichment-governor/validate-state.mjs
          node scripts/enrichment-governor/reconcile-state.mjs
          node scripts/enrichment-governor/validate-state.mjs
      - name: Persist reconciliation when needed
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/enrichment-governor/work-queue.json ops/enrichment-governor/quarantine.json ops/enrichment-governor/ledger.jsonl
          git commit -m 'chore(governor): reconcile coordination state'
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then exit 0; fi
          git push origin HEAD:main
