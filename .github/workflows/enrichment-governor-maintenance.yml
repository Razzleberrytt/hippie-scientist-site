name: Enrichment Governor Maintenance

on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:

concurrency:
  group: enrichment-governor-persistent-writer
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reconcile governor state
        run: |
          set -euo pipefail
          node --test scripts/enrichment-governor/__tests__/*.test.mjs
          node scripts/enrichment-governor/validate-state.mjs
          node scripts/enrichment-governor/reconcile-state.mjs
          node scripts/enrichment-governor/validate-state.mjs
      - name: Persist reconciliation through protected PR governance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/enrichment-governor/work-queue.json ops/enrichment-governor/quarantine.json ops/enrichment-governor/ledger.jsonl
          git commit -m 'chore(governor): reconcile coordination state'
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then exit 0; fi

          BASE_SHA="$(git rev-parse HEAD^)"
          BRANCH="governor/maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git push origin "HEAD:$BRANCH"

          AUDIT_URL="$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "governor: admit scheduled state reconciliation" \
            --body "Canonical state-only reconciliation generated by workflow run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT} on exact base \`$BASE_SHA\`. This audit ticket exists only to admit generated coordination state through protected PR governance.")"
          AUDIT_NUMBER="${AUDIT_URL##*/}"

          cat > /tmp/governor-maintenance-pr.md <<EOF
          Closes #${AUDIT_NUMBER}

          ## Summary
          - admits canonical scheduled governor reconciliation through a protected PR
          - state-only; no scientific or public-content mutation

          ## Relevant URLs
          - Audit issue: #${AUDIT_NUMBER}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## Acceptance criteria
          - [x] reconciliation was generated and validated by the canonical governor
          - [x] exact-current-main check passed before publication
          - [x] mutation is restricted to governor coordination state
          - [ ] exact-head repository checks pass
          - [ ] merge occurs only through protected PR governance

          ## Validation commands
          - \`node --test scripts/enrichment-governor/__tests__/*.test.mjs\`
          - \`node scripts/enrichment-governor/validate-state.mjs\`
          - exact-head CI, Site Health, Atomic Upgrade Gate, and Build Quality Regression

          ## Before → after metrics
          - direct pushes to protected main: 0
          - generated reconciliation PRs: 0 → 1
          - scientific/public-content mutations: 0

          ## Generator/source-of-truth decision
          \`enrichment-governor-maintenance.yml\` → \`reconcile-state.mjs\` remains the sole scheduled reconciliation path. This PR only admits its generated state.

          ## Regression contract
          Never bypass branch protection or hand-edit generated state. If main changes before safe merge, close this exact-base transaction and rerun the canonical maintenance workflow.
          EOF

          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(governor): reconcile coordination state" \
            --body-file /tmp/governor-maintenance-pr.md)"
          PR_NUMBER="${PR_URL##*/}"

          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f "recovery_pr_number=$PR_NUMBER"
          gh workflow run check.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f "recovery_pr_number=$PR_NUMBER"
          gh workflow run atomic-upgrade-gate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f "recovery_pr_number=$PR_NUMBER" -f "recovery_base_ref=main"
          gh workflow run build-quality-regression.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f "recovery_pr_number=$PR_NUMBER" -f "recovery_base_ref=main"
