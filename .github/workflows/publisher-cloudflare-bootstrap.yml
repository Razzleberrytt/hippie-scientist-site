name: Publisher Cloudflare bootstrap

on:
  push:
    branches:
      - probe/publisher-production-readiness-2026-10-06
    paths:
      - .github/workflows/publisher-cloudflare-bootstrap.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: Validate bootstrap authority
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT REPO_ADMIN_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required bootstrap secret: $key" >&2
              exit 1
            fi
          done

      - name: Provision D1 and KV
        id: resources
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          d1_name="ths-publisher-prod"
          curl -fsS "${auth[@]}" "$api/d1/database?name=$d1_name&per_page=100" > d1-list.json
          d1_id="$(jq -r --arg n "$d1_name" '.result[]? | select(.name==$n) | .uuid' d1-list.json | head -n1)"
          if [ -z "$d1_id" ]; then
            curl -fsS "${auth[@]}" -X POST "$api/d1/database"               --data "$(jq -nc --arg name "$d1_name" '{name:$name,jurisdiction:"us"}')" > d1-create.json
            jq -e '.success == true and (.result.uuid | length > 0)' d1-create.json >/dev/null
            d1_id="$(jq -r '.result.uuid' d1-create.json)"
            echo "Created D1 database $d1_name"
          else
            echo "Reusing D1 database $d1_name"
          fi

          kv_title="ths-tiktok-token-kv-prod"
          curl -fsS "${auth[@]}" "$api/storage/kv/namespaces?per_page=100" > kv-list.json
          kv_id="$(jq -r --arg n "$kv_title" '.result[]? | select(.title==$n) | .id' kv-list.json | head -n1)"
          if [ -z "$kv_id" ]; then
            curl -fsS "${auth[@]}" -X POST "$api/storage/kv/namespaces"               --data "$(jq -nc --arg title "$kv_title" '{title:$title,jurisdiction:"us"}')" > kv-create.json
            jq -e '.success == true and (.result.id | length > 0)' kv-create.json >/dev/null
            kv_id="$(jq -r '.result.id' kv-create.json)"
            echo "Created KV namespace $kv_title"
          else
            echo "Reusing KV namespace $kv_title"
          fi

          echo "d1_id=$d1_id" >> "$GITHUB_OUTPUT"
          echo "kv_id=$kv_id" >> "$GITHUB_OUTPUT"

      - name: Apply Publisher D1 schema
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler d1 execute ths-publisher-prod             --remote             --file migrations/0001_ths_publisher.sql             --yes

      - name: Bind D1 and KV to Pages production
        env:
          D1_ID: ${{ steps.resources.outputs.d1_id }}
          KV_ID: ${{ steps.resources.outputs.kv_id }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base" > project-before.json
          jq -e '.success == true' project-before.json >/dev/null

          current_d1="$(jq -c '.result.deployment_configs.production.d1_databases // {}' project-before.json)"
          current_kv="$(jq -c '.result.deployment_configs.production.kv_namespaces // {}' project-before.json)"
          jq -nc             --arg d1 "$D1_ID"             --arg kv "$KV_ID"             --argjson currentD1 "$current_d1"             --argjson currentKV "$current_kv"             '{deployment_configs:{production:{
              d1_databases:($currentD1 + {THS_PUBLISHER_DB:{id:$d1}}),
              kv_namespaces:($currentKV + {TIKTOK_TOKEN_KV:{namespace_id:$kv}})
            }}}' > pages-patch.json

          curl -fsS -X PATCH             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data @pages-patch.json             "$base" > project-after.json

          jq -e --arg d1 "$D1_ID" --arg kv "$KV_ID" '
            .success == true and
            .result.deployment_configs.production.d1_databases.THS_PUBLISHER_DB.id == $d1 and
            .result.deployment_configs.production.kv_namespaces.TIKTOK_TOKEN_KV.namespace_id == $kv
          ' project-after.json >/dev/null
          echo "Cloudflare Pages production bindings verified."

      - name: Generate and synchronize admin secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          pub_token="$(openssl rand -hex 32)"
          tiktok_token="$(openssl rand -hex 32)"
          echo "::add-mask::$pub_token"
          echo "::add-mask::$tiktok_token"

          printf '%s' "$pub_token" | gh secret set THS_PUBLISHER_ADMIN_TOKEN --repo "$GITHUB_REPOSITORY"
          printf '%s' "$tiktok_token" | gh secret set TIKTOK_PUBLISHER_ADMIN_TOKEN --repo "$GITHUB_REPOSITORY"

          jq -nc             --arg pub "$pub_token"             --arg tik "$tiktok_token"             '{
              THS_PUBLISHER_ADMIN_TOKEN:$pub,
              TIKTOK_PUBLISHER_ADMIN_TOKEN:$tik,
              TIKTOK_REDIRECT_URI:"https://thehippiescientist.net/api/tiktok/callback"
            }' > pages-secrets.json
          trap 'rm -f pages-secrets.json' EXIT

          npx --no-install wrangler pages secret bulk pages-secrets.json             --project-name "$CLOUDFLARE_PAGES_PROJECT"
          echo "Dedicated Publisher/TikTok admin secrets synchronized without exposing values."

      - name: Verify resource bindings and secret names
        shell: bash
        env:
          D1_ID: ${{ steps.resources.outputs.d1_id }}
          KV_ID: ${{ steps.resources.outputs.kv_id }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base" > project-verify.json
          jq -e --arg d1 "$D1_ID" --arg kv "$KV_ID" '
            .result.deployment_configs.production.d1_databases.THS_PUBLISHER_DB.id == $d1 and
            .result.deployment_configs.production.kv_namespaces.TIKTOK_TOKEN_KV.namespace_id == $kv
          ' project-verify.json >/dev/null

          npx --no-install wrangler pages secret list             --project-name "$CLOUDFLARE_PAGES_PROJECT" > pages-secret-list.txt
          grep -q 'THS_PUBLISHER_ADMIN_TOKEN' pages-secret-list.txt
          grep -q 'TIKTOK_PUBLISHER_ADMIN_TOKEN' pages-secret-list.txt
          grep -q 'TIKTOK_REDIRECT_URI' pages-secret-list.txt
          echo "Publisher production infrastructure bootstrap verified."

      - name: Trigger production redeploy
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
