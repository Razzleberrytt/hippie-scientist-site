name: Publisher Cloudflare bootstrap

on:
  push:
    branches:
      - probe/publisher-production-readiness-2026-10-06
    paths:
      - scripts/ops/bootstrap-publisher-cloudflare-resources.mjs
      - .github/workflows/publisher-cloudflare-bootstrap.yml

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe/publisher-production-readiness-2026-10-06

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap Publisher Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: node scripts/ops/bootstrap-publisher-cloudflare-resources.mjs
