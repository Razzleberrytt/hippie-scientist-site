name: Experience backlog contract

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'styles/**'
      - 'scripts/ci/validate-experience-backlog.mjs'
      - '.github/workflows/experience-backlog-contract.yml'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'styles/**'
      - 'scripts/ci/validate-experience-backlog.mjs'
      - '.github/workflows/experience-backlog-contract.yml'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  experience-contract:
    name: THS-001–015 structural acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate experience backlog invariants
        run: node scripts/ci/validate-experience-backlog.mjs
