name: Maintenance cadence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1' # Weekly: Monday 09:17 UTC
    - cron: '37 10 1 * *' # Monthly: first day 10:37 UTC

permissions:
  contents: read
  actions: read

concurrency:
  group: maintenance-cadence
  cancel-in-progress: false

jobs:
  weekly-quality:
    name: Weekly quality and opportunity checks
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore prior AI telemetry history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_run=$(gh run list \
            --workflow=maintenance-cadence.yml \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then
            mkdir -p .prior-weekly
            gh run download "$previous_run" --pattern 'weekly-maintenance-*' --dir .prior-weekly || true
            mkdir -p ops/ai-citations
            prior_history=$(find .prior-weekly -type d -path '*/ops/ai-citations' -print -quit)
            if [ -n "$prior_history" ]; then
              cp -R "$prior_history"/. ops/ai-citations/
              echo "Restored prior AI telemetry from workflow run $previous_run"
            else
              echo "Prior workflow artifact had no AI telemetry history"
            fi
          else
            echo "No prior successful maintenance run found; starting telemetry history"
          fi

      - name: Broken-link check
        run: npm run audit:links

      - name: Content-integrity check
        run: |
          npm run audit:content
          npm run gate:content-quality

      - name: Sitemap checks
        run: |
          npm run audit:sitemap
          npm run seo:audit-sitemap

      - name: Citation-health check
        run: npm run evidence:check

      - name: Search Console opportunity report
        run: npm run seo:opportunities

      - name: AI citation-readiness topology
        run: npx tsx scripts/ci/audit-ai-citation-topology.ts

      - name: AI citation telemetry
        run: node scripts/seo/ai-citation-tracker.mjs --label=$(date -u +%F)

      - name: AI source-gap and competitor citation audit
        run: node scripts/seo/ai-source-gap-audit.mjs --label=$(date -u +%F)

      - name: AI SEO action priority
        run: node scripts/seo/ai-opportunity-priority.mjs

      - name: Upload weekly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-maintenance-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            ops/reports/**
            ops/ai-citations/**
            reports/**
            artifacts/**

  monthly-decay:
    name: Monthly content-decay report
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '37 10 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Search Console opportunity inputs
        run: npm run seo:opportunities

      - name: Generate content-decay report
        run: node scripts/ops/content-decay-report.mjs

      - name: Upload content-decay report
        uses: actions/upload-artifact@v4
        with:
          name: monthly-content-decay-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: ops/reports/content-decay.json
