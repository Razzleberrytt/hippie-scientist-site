name: Temporary profile jump-nav codemod

on:
  push:
    branches:
      - perf/remove-hidden-profile-jump-nav-2026-08-24
    paths:
      - .github/workflows/temp-profile-jump-nav-codemod.yml

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove hidden duplicate profile navigation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('app/herbs/[slug]/page.tsx'),
              Path('app/compounds/[slug]/page.tsx'),
          ]

          nav_pattern = re.compile(
              r'\n(?P<indent>[ \t]*)(?:\{/\*[^\n]*Jump navigation[\s\S]*?\*/\}\n[ \t]*)?'
              r'<nav aria-label="Jump to profile sections"[\s\S]*?</nav>\n',
              re.MULTILINE,
          )

          for path in targets:
              text = path.read_text()
              before = text.count('aria-label="Jump to profile sections"')
              if before != 1:
                  raise SystemExit(f'{path}: expected exactly one legacy jump nav, found {before}')
              if 'ProfileTOC' not in text:
                  raise SystemExit(f'{path}: ProfileTOC contract missing before edit')

              updated, count = nav_pattern.subn('\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: guarded nav block did not match exactly once')
              if 'aria-label="Jump to profile sections"' in updated:
                  raise SystemExit(f'{path}: legacy jump nav remained after edit')
              if 'ProfileTOC' not in updated:
                  raise SystemExit(f'{path}: ProfileTOC was removed unexpectedly')

              path.write_text(updated)
              print(f'{path}: removed one hidden duplicate navigation block')
          PY
          git diff --check
          git diff -- app/herbs/'[slug]'/page.tsx app/compounds/'[slug]'/page.tsx
      - name: Commit codemod result
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes produced; refusing empty codemod commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/herbs/'[slug]'/page.tsx app/compounds/'[slug]'/page.tsx
          git commit -m 'perf: remove hidden profile jump nav markup'
          git push origin HEAD:${GITHUB_REF_NAME}
