name: Temporary regenerate governed enrichment 4245

on:
  push:
    branches:
      - enrichment/4245-clear-canary-debt
    paths:
      - '.github/workflows/tmp-regenerate-4245-governed-artifact.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: enrichment/4245-clear-canary-debt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate governed enrichment artifact
        run: node scripts/enrichment/generate-governed-enrichment.mjs
      - name: Commit exact generated artifact
        run: |
          git diff --check
          git status --short
          git add public/data/enrichment-governed.json
          if git diff --cached --quiet; then
            echo 'Governed artifact already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(enrichment): regenerate governed artifact'
          git push origin HEAD:enrichment/4245-clear-canary-debt
