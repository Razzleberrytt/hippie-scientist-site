name: One-shot guide table accessibility update

on:
  push:
    branches:
      - secondary/guidepage-accessible-dosage-table

permissions:
  contents: write

jobs:
  update-guide-table:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: secondary/guidepage-accessible-dosage-table
          fetch-depth: 0

      - name: Apply semantic responsive table pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guide_path = Path('components/guides/GuidePage.tsx')
          source = guide_path.read_text()

          replacements = [
              (
                  "import InternalLinks from './InternalLinks'\n",
                  "import InternalLinks from './InternalLinks'\nimport ResponsiveTable from '@/components/ui/ResponsiveTable'\n",
                  1,
              ),
              (
                  '''          <div className="overflow-hidden rounded-2xl border border-brand-900/10 bg-white/90 shadow-sm">\n            <table className="w-full text-sm">\n              <thead>''',
                  '''          <ResponsiveTable\n            label={`${guide.title} dosage and forms`}\n            className="overflow-hidden rounded-2xl border border-brand-900/10 bg-white/90 shadow-sm"\n          >\n            <table className="min-w-full border-collapse text-sm">\n              <caption className="sr-only">\n                Dosage forms, typical ranges, and notes for {guide.title}\n              </caption>\n              <thead>''',
                  1,
              ),
              (
                  '<th className="px-4 py-3 text-left text-xs font-bold uppercase tracking-[0.12em] text-brand-700">',
                  '<th scope="col" className="px-4 py-3 text-left text-xs font-bold uppercase tracking-[0.12em] text-brand-700">',
                  2,
              ),
              (
                  '<th className="hidden px-4 py-3 text-left text-xs font-bold uppercase tracking-[0.12em] text-brand-700 sm:table-cell">',
                  '<th scope="col" className="hidden px-4 py-3 text-left text-xs font-bold uppercase tracking-[0.12em] text-brand-700 sm:table-cell">',
                  1,
              ),
              (
                  '<td className="px-4 py-3 font-medium text-ink">{row.form}</td>',
                  '<th scope="row" className="px-4 py-3 text-left font-medium text-ink">{row.form}</th>',
                  1,
              ),
              (
                  '''            </table>\n          </div>\n          <p className="text-xs text-muted">''',
                  '''            </table>\n          </ResponsiveTable>\n          <p className="text-xs text-muted">''',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = source.count(old)
              if actual != expected:
                  raise SystemExit(f'GuidePage assertion failed: expected {expected} occurrence(s), found {actual}: {old[:100]!r}')
              source = source.replace(old, new)

          guide_path.write_text(source)

          audit_path = Path('docs/accessibility-wcag-22-audit.md')
          audit = audit_path.read_text()
          doc_replacements = [
              (
                  '- `components/compare/EvidenceMatrix.tsx`\n- `mdx-components.tsx`',
                  '- `components/compare/EvidenceMatrix.tsx`\n- `components/guides/GuidePage.tsx`\n- `mdx-components.tsx`',
              ),
              (
                  '- Data tables use `scope="col"` and `scope="row"`.\n- MDX tables receive a default screen-reader caption.',
                  '- Data tables use `scope="col"` and `scope="row"`.\n- Shared guide-template dosage tables use the same keyboard-reachable wrapper, captions, and semantic headers.\n- MDX tables receive a default screen-reader caption.',
              ),
              (
                  '''1. Convert older guide-template dosage tables in `components/guides/GuidePage.tsx` to `ResponsiveTable`.\n   - Add caption.\n   - Add `scope="col"` to column headers.\n   - Change first data cell to row header with `scope="row"`.\n   - Keep workbook/source content unchanged.\n2. Audit all remaining raw `<table>` occurrences and either:\n   - confirm table semantics are complete, or\n   - migrate to `ResponsiveTable`.\n3. Check all custom icon-only buttons for visible text or `aria-label`.\n4. Check dark-mode contrast on hardcoded utility colors.''',
                  '''1. Audit all remaining raw `<table>` occurrences and either:\n   - confirm table semantics are complete, or\n   - migrate to `ResponsiveTable`.\n2. Check all custom icon-only buttons for visible text or `aria-label`.\n3. Check dark-mode contrast on hardcoded utility colors.''',
              ),
          ]

          for old, new in doc_replacements:
              actual = audit.count(old)
              if actual != 1:
                  raise SystemExit(f'Accessibility audit assertion failed: expected 1 occurrence, found {actual}: {old[:100]!r}')
              audit = audit.replace(old, new)

          audit_path.write_text(audit)
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/guidepage-table-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/guides/GuidePage.tsx docs/accessibility-wcag-22-audit.md
          git commit -m "Make guide dosage tables accessible"
          git push origin HEAD:secondary/guidepage-accessible-dosage-table
