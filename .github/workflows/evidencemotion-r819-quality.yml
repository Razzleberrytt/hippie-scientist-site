name: EvidenceMotion R8.19 art and brutal-bar regressions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/distribution/r819-*'
      - 'scripts/distribution/author-r819-layers-cli.mjs'
      - 'scripts/distribution/render-vertical-video-mp4.mjs'
      - 'scripts/distribution/__tests__/r819-*'
      - 'scripts/distribution/assets/r819/**'
      - 'styles/ths-cellular-brand.css'
      - 'docs/evidencemotion-r819-*'
      - '.github/workflows/evidencemotion-r819-quality.yml'
permissions:
  contents: read
jobs:
  deterministic-art-and-craft-veto:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail if art and release-gate sources are malformed
        run: |
          node --check scripts/distribution/r819-brutal-bar.mjs
          node --check scripts/distribution/r819-art-verifier.mjs
          node --check scripts/distribution/r819-acoustic-cue-binding.mjs
          node --check scripts/distribution/r819-canonical-handoff.mjs
          node --check scripts/distribution/r819-native-layer-compositor.mjs
          node --check scripts/distribution/r819-layer-inventory-writer.mjs
          node --check scripts/distribution/author-r819-layers-cli.mjs
          node --check scripts/distribution/render-vertical-video-mp4.mjs
      - name: Preserve R8.18 scientific object telemetry and test R8.19 visual vetoes
        run: npx vitest run scripts/distribution/__tests__/r819-brutal-bar.test.mjs scripts/distribution/__tests__/r819-art-verifier.test.mjs scripts/distribution/__tests__/r819-acoustic-cue-binding.test.mjs scripts/distribution/__tests__/r819-native-layer-compositor.test.mjs scripts/distribution/__tests__/r818-telemetry-qa.test.mjs
