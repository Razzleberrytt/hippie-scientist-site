name: Owner Control Plane Bridge

on:
  pull_request:
    paths:
      - '.github/workflows/owner-control-plane-bridge.yml'
      - '.github/workflows/check.yml'
      - 'scripts/ci/owner-control-plane-bridge.mjs'
      - 'scripts/ci/owner-control-plane-bridge.contract.mjs'
      - 'scripts/ci/promotion-admission.mjs'
      - 'scripts/ci/promotion-admission.test.mjs'
      - 'scripts/enrichment-governor/lease-transaction.mjs'
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed, labeled, unlabeled]
  schedule:
    - cron: '55 * * * *'
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: owner-control-plane-bridge-global
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate owner control-plane bridge contract
        run: |
          node --test scripts/ci/owner-control-plane-bridge.contract.mjs
          node --test scripts/ci/promotion-admission.test.mjs

  promotion_admission:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Plan globally serialized promotion
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/promotion-admission.mjs admit-next

      - name: Return held or duplicate ready PRs to staging
        if: steps.plan.outputs.stage_numbers != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_NUMBERS: ${{ steps.plan.outputs.stage_numbers }}
        run: |
          set -euo pipefail
          IFS=',' read -ra numbers <<<"$STAGE_NUMBERS"
          for number in "${numbers[@]}"; do
            test -n "$number" || continue
            gh pr ready "$number" --undo --repo "$GITHUB_REPOSITORY"
            echo "Returned PR #$number to draft staging."
          done

      - name: Admit next exact-main draft
        if: steps.plan.outputs.candidate_pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.plan.outputs.candidate_pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.plan.outputs.candidate_head_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.plan.outputs.main_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          current_draft="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.draft')"
          if [ "$current_main" != "$EXPECTED_MAIN_SHA" ] || \
             [ "$current_head" != "$EXPECTED_HEAD_SHA" ] || \
             [ "$current_draft" != "true" ]; then
            echo "Promotion candidate changed before admission; leaving it staged for the next reconciliation." >&2
            exit 0
          fi

          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

          actual_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          actual_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          actual_draft="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.draft')"
          actual_state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')"
          if [ "$actual_main" != "$EXPECTED_MAIN_SHA" ] || \
             [ "$actual_head" != "$EXPECTED_HEAD_SHA" ] || \
             [ "$actual_draft" != "false" ] || \
             [ "$actual_state" != "open" ]; then
            if [ "$actual_state" = "open" ] && [ "$actual_draft" = "false" ]; then
              gh pr ready "$PR_NUMBER" --undo --repo "$GITHUB_REPOSITORY" || true
            fi
            echo "Promotion admission became stale; restored draft state when possible." >&2
            exit 1
          fi
          echo "Admitted PR #$PR_NUMBER as the single exact-main promotion candidate."

  governor:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/governor ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse and validate governor command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node scripts/ci/owner-control-plane-bridge.mjs parse-governor

      - name: Dispatch canonical persistent governor transaction
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ steps.parse.outputs.operation }}
          LEASE_ID: ${{ steps.parse.outputs.lease_id }}
          LEASE_OWNER: ${{ steps.parse.outputs.owner }}
          LEASE_PURPOSE: ${{ steps.parse.outputs.purpose }}
          LEASE_FILES: ${{ steps.parse.outputs.files }}
          LEASE_ENTITIES: ${{ steps.parse.outputs.entities }}
          LEASE_DISPOSITION: ${{ steps.parse.outputs.disposition }}
        run: |
          set -euo pipefail
          gh workflow run enrichment-governor-transaction.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "operation=$OPERATION" \
            -f "lease_id=$LEASE_ID" \
            -f "owner=$LEASE_OWNER" \
            -f "purpose=$LEASE_PURPOSE" \
            -f "files=$LEASE_FILES" \
            -f "entities=$LEASE_ENTITIES" \
            -f "disposition=$LEASE_DISPOSITION"

  metricool_publish:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/publish-metricool ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse and validate Metricool publish command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node scripts/ci/owner-control-plane-bridge.mjs parse-metricool

      - name: Dispatch governed Metricool connector preparation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_AT: ${{ steps.parse.outputs.publication_at }}
          NETWORKS: ${{ steps.parse.outputs.networks }}
        run: |
          set -euo pipefail
          gh workflow run metricool-connector-publication.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "publication_at=$PUBLICATION_AT" \
            -f "networks=$NETWORKS" \
            -f "auto_publish=true"

  ready:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/ready'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assert global promotion token is free
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/promotion-admission.mjs assert-token-free

      - name: Validate exact PR readiness transition
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/ci/owner-control-plane-bridge.mjs validate-ready

      - name: Use GitHub native draft-to-ready transition
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Verify transition preserved exact head and current main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.validate.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.validate.outputs.main_sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          actual_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          actual_state="$(jq -r '.state' <<<"$pr_json")"
          actual_draft="$(jq -r '.draft' <<<"$pr_json")"
          actual_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ] || \
             [ "$actual_main_sha" != "$EXPECTED_MAIN_SHA" ] || \
             [ "$actual_state" != "open" ] || \
             [ "$actual_draft" != "false" ]; then
            if [ "$actual_state" = "open" ] && [ "$actual_draft" = "false" ]; then
              gh pr ready "$PR_NUMBER" --undo --repo "$GITHUB_REPOSITORY" || true
            fi
            echo "Ready transition became stale or invalid; restored draft state when possible." >&2
            exit 1
          fi

      - name: Native ready event owns exact-head validation
        run: |
          echo "The ready_for_review event is the single validation trigger."
          echo "No duplicate workflow_dispatch fan-out is emitted by the owner bridge."
