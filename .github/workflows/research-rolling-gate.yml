name: Research rolling gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/research/rolling-*.mjs'
      - '.github/workflows/research-rolling-gate.yml'
      - 'ops/enrichment-submissions/**'
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: research-rolling-global
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test scripts/research/rolling-coordinator.test.mjs scripts/research/rolling-gate.test.mjs
      - name: Safety boundary
        run: |
          echo "Read-only validation only. No merge, publish or cross-lane reservations are performed."
