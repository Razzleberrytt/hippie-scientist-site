name: Research rolling gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/research/**'
      - 'scripts/ci/validate-research-source-register.mjs'
      - 'schemas/research-*.json'
      - 'ops/research-intake/**'
      - 'ops/research-coordinator/**'
      - 'ops/enrichment-submissions/reconciliation/**'
      - 'lib/research-source-register.ts'
      - 'app/research/source-register/**'
      - '.github/workflows/research-rolling-gate.yml'
      - '.github/workflows/research-rolling-intake.yml'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: research-rolling-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Research control-plane unit tests
        run: node --test scripts/research/*.test.mjs
      - name: Validate frozen rolling batch and independent review
        run: node scripts/research/validate-rolling-batch-pr.mjs
      - name: Validate rolling source-register boundary
        run: node scripts/ci/validate-research-source-register.mjs
      - name: Research-only safety invariant
        run: |
          set -euo pipefail
          ! grep -R --line-number --include='*.json' '"runtime_admission"[[:space:]]*:[[:space:]]*true' ops/research-coordinator ops/research-intake 2>/dev/null
          echo "PASS: rolling research remains fail-closed from clinical/runtime admission."
