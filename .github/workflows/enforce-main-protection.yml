name: Enforce Main Protection

on:
  pull_request:
    paths:
      - '.github/workflows/enforce-main-protection.yml'
      - 'scripts/ci/main-protection-enforcer.test.mjs'
      - 'docs/ci/main-branch-protection.md'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PROTECT MAIN to apply the documented main branch protection contract'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enforce-main-protection-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate protection enforcer contract
        run: npx vitest run scripts/ci/main-protection-enforcer.test.mjs

  enforce:
    if: >-
      (
        github.actor == github.repository_owner ||
        (
          github.actor == 'chatgpt-codex-connector[bot]' &&
          github.event.comment.user.login == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.performed_via_github_app.slug == 'chatgpt-codex-connector'
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request == null &&
          github.event.comment.body == '/protect-main PROTECT MAIN'
        )
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
      REPO: ${{ github.repository }}
      REPO_OWNER: ${{ github.repository_owner }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTOR: ${{ github.actor }}
      DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_USER: ${{ github.event.comment.user.login }}
      COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
      COMMENT_APP: ${{ github.event.comment.performed_via_github_app.slug }}
    steps:
      - name: Fail closed unless explicitly confirmed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$EVENT_ACTOR" != "$REPO_OWNER" ]]; then
              echo "::error title=Owner authority required::Only the repository owner may dispatch main protection enforcement."
              exit 1
            fi
            if [[ "$DISPATCH_CONFIRMATION" != "PROTECT MAIN" ]]; then
              echo "::error title=Explicit confirmation required::Dispatch again with confirmation exactly: PROTECT MAIN"
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "issue_comment" ]]; then
            if [[ "$COMMENT_BODY" != "/protect-main PROTECT MAIN" ]]; then
              echo "::error title=Explicit confirmation required::Use the exact owner-only issue command: /protect-main PROTECT MAIN"
              exit 1
            fi
            if [[ "$EVENT_ACTOR" != "$REPO_OWNER" ]]; then
              if [[ "$EVENT_ACTOR" != "chatgpt-codex-connector[bot]" || "$COMMENT_USER" != "$REPO_OWNER" || "$COMMENT_ASSOCIATION" != "OWNER" || "$COMMENT_APP" != "chatgpt-codex-connector" ]]; then
                echo "::error title=Owner authority required::Connector-originated enforcement requires GitHub-attributed repository-owner authorship, OWNER association, and the trusted ChatGPT Codex Connector app."
                exit 1
              fi
            fi
          else
            echo "::error title=Unsupported trigger::Protection enforcement may run only from workflow_dispatch or the exact owner-only issue command."
            exit 1
          fi

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error title=Admin token missing::Repository secret REPO_ADMIN_TOKEN is required. Use a fine-grained token with repository Administration: write permission (or an equivalently scoped classic token)."
            exit 1
          fi

      - name: Apply documented main protection contract
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/main-protection.json" <<'JSON'
          {
            "required_status_checks": {
              "strict": true,
              "contexts": [
                "CI",
                "Site Health Check",
                "Atomic upgrade gate",
                "Production Content Lint",
                "Build quality regression"
              ]
            },
            "enforce_admins": true,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": false,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 0,
              "require_last_push_approval": false
            },
            "restrictions": null,
            "required_linear_history": false,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "block_creations": false,
            "required_conversation_resolution": false,
            "lock_branch": false,
            "allow_fork_syncing": false
          }
          JSON

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPO/branches/main/protection" \
            --input "$RUNNER_TEMP/main-protection.json" \
            > "$RUNNER_TEMP/main-protection-response.json"

      - name: Verify live protection state
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPO/branches/main" \
            > "$RUNNER_TEMP/main-branch.json"

          jq -e '.protected == true' "$RUNNER_TEMP/main-branch.json" >/dev/null

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPO/branches/main/protection" \
            > "$RUNNER_TEMP/main-live-protection.json"

          for check in \
            "CI" \
            "Site Health Check" \
            "Atomic upgrade gate" \
            "Production Content Lint" \
            "Build quality regression"; do
            jq -e --arg check "$check" '.required_status_checks.contexts | index($check) != null' \
              "$RUNNER_TEMP/main-live-protection.json" >/dev/null
          done

          jq -e '.enforce_admins.enabled == true' "$RUNNER_TEMP/main-live-protection.json" >/dev/null
          jq -e '.required_pull_request_reviews != null' "$RUNNER_TEMP/main-live-protection.json" >/dev/null
          jq -e '.allow_force_pushes.enabled == false' "$RUNNER_TEMP/main-live-protection.json" >/dev/null
          jq -e '.allow_deletions.enabled == false' "$RUNNER_TEMP/main-live-protection.json" >/dev/null

          echo "Main branch protection is enabled and matches the documented universal enforcement boundary."
